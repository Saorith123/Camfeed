<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CamFeed</title><meta name="theme-color" content="#1877f2">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f0f2f5;color:#1c1e21;font-family:'Noto Sans Khmer',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;text-align:center;padding:24px}
.card{background:#fff;border-radius:16px;padding:32px 24px;max-width:360px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
img{width:84px;height:84px;border-radius:20px}h1{font-size:20px;margin:14px 0 6px}p{color:#65676b;font-size:15px;line-height:1.5;margin:4px 0}
button{margin-top:18px;background:#1877f2;color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:16px;font-weight:700;cursor:pointer}
</style></head>
<body><div class="card">
<img src="/icons/icon-192.png" alt="CamFeed">
<h1 id="t">គ្មានការតភ្ជាប់អ៊ីនធឺណិត</h1>
<p id="d">សូមពិនិត្យអ៊ីនធឺណិតរបស់អ្នក រួចព្យាយាមម្តងទៀត។</p>
<button id="b" onclick="location.reload()">ព្យាយាមម្តងទៀត</button>
</div>
<script>
(function(){var l=localStorage.getItem('camfeed_lang');if(l==='en'){document.documentElement.lang='en';
document.getElementById('t').textContent='No internet connection';document.getElementById('d').textContent='Please check your connection and try again.';document.getElementById('b').textContent='Try again';}
window.addEventListener('online',function(){location.reload()});})();
</script></body></html>
