    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, input, button, select, textarea { font-family: 'Battambang', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, 'Noto Color Emoji', sans-serif; }
        body { background: #f0f2f5; color: #050505; min-height: 100vh; padding-bottom: 60px; }
        .top-nav { background: #fff; height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); position: sticky; top: 0; z-index: 50; }
        .back-btn { background: #f0f2f5; border: none; width: 38px; height: 38px; border-radius: 50%; font-size: 18px; cursor: pointer; }

        .ck.on { border-color: #1877f2; background: #e7f3ff; }

        .ck.on .box { background: #1877f2; border-color: #1877f2; }
        .ck b { display: block; font-size: 14px; } .ck span { font-size: 12.5px; color: #4b5563; }
        .provlist { max-height: 55vh; overflow-y: auto; margin-top: 8px; }

        .est { background: linear-gradient(135deg, #e7f3ff, #f0fbff); border: 1.5px solid #b6dcff; border-radius: 14px; padding: 14px; margin-top: 12px; }
        .est .big { font-size: 28px; font-weight: 800; color: #1877f2; line-height: 1.3; }
        .est .row { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; } .est .row div { flex: 1; min-width: 130px; background: #fff; border-radius: 10px; padding: 8px 10px; }

        .postopt { display: flex; gap: 10px; align-items: center; border: 2px solid #e4e6eb; border-radius: 12px; padding: 8px; cursor: pointer; }
        .postopt.on { border-color: #1877f2; background: #e7f3ff; }

        .prod img { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; background: #e4e6eb; flex-shrink: 0; }
        .prod .f { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; } .prod input { padding: 8px 10px; }
        .x { background: #f0f2f5; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 14px; flex-shrink: 0; }
        .preview { border: 1.5px solid #e2e8f0; border-radius: 12px; overflow: hidden; background: #fff; margin-top: 12px; }
        .preview .ph { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
        .preview .ph img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #e4e6eb; }
        .preview .ph .n { font-weight: 800; font-size: 14px; } .preview .ph .s { font-size: 12px; color: #4b5563; }
        .preview .pm { background: #e4e6eb; min-height: 120px; display: flex; align-items: center; justify-content: center; color: #4b5563; overflow: hidden; }
        .preview .pm img, .preview .pm video { width: 100%; max-height: 260px; object-fit: cover; display: block; }
        .strip { display: flex; gap: 8px; overflow-x: auto; padding: 0 12px 12px; scroll-snap-type: x mandatory; }
        .strip .it { flex: 0 0 150px; border: 1px solid #e4e6eb; border-radius: 10px; overflow: hidden; scroll-snap-align: start; background: #fff; }
        .strip .it img { width: 150px; height: 150px; object-fit: cover; display: block; background: #e4e6eb; }
        .strip .it div { padding: 6px 8px; font-size: 13px; } .strip .it b { display: block; color: #1877f2; }
        .cta { display: flex; justify-content: flex-end; padding: 10px 12px; border-top: 1px solid #f0f2f5; }
        .cta span { background: #1877f2; color: #fff; padding: 7px 16px; border-radius: 18px; font-weight: 700; font-size: 13px; }
        .req { border: 1px solid #e4e6eb; border-radius: 12px; padding: 12px; margin-top: 10px; }
        .pill { display: inline-block; font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: #e7f3ff; color: #1877f2; }
        .pill.live { background: #d1fae5; color: #065f46; } .pill.rejected, .pill.ended, .pill.completed { background: #f1f5f9; color: #475569; } .pill.quoted, .pill.payment_sent, .pill.starting { background: #fff4d6; color: #92580a; }
        .pay { background: #f8fafc; border: 1.5px dashed #94a3b8; border-radius: 12px; padding: 14px; margin-top: 10px; font-size: 14px; line-height: 1.6; }
        .pay .amt { font-size: 26px; font-weight: 800; color: #111827; } .pay .code { display: inline-block; font-size: 20px; font-weight: 800; letter-spacing: 1px; background: #fff; border: 2px solid #1877f2; color: #1877f2; border-radius: 10px; padding: 2px 12px; }
        .pay img { max-width: 240px; width: 100%; display: block; margin: 10px auto 0; border-radius: 8px; }
        .pay .txt { white-space: pre-wrap; color: #374151; font-size: 13.5px; margin-top: 8px; }
        .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
        .stat { background: #f8fafc; border-radius: 12px; padding: 10px; }
        .stat b { display: block; font-size: 20px; } .stat span { font-size: 12.5px; color: #4b5563; }
        .bars { display: flex; align-items: flex-end; gap: 4px; height: 90px; margin-top: 10px; }
        .bar { flex: 1; background: #1877f2; border-radius: 4px 4px 0 0; min-height: 2px; }
        .days { display: flex; gap: 4px; } .days div { flex: 1; text-align: center; font-size: 9.5px; color: #4b5563; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 100; display: none; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 20px 12px; }
        .modal.show { display: flex; } .modal .card { max-width: 560px; width: 100%; }
        .progress { height: 8px; background: #e4e6eb; border-radius: 6px; overflow: hidden; margin-top: 6px; } .progress i { display: block; height: 100%; background: #1877f2; }
        .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    </style>
</head>
<body>
    <style>body.in-app .top-nav{display:none}</style><script>try{if(/CamFeedApp/.test(navigator.userAgent))document.addEventListener("DOMContentLoaded",function(){document.body.classList.add("in-app")});}catch(e){}</script>
    <div class="top-nav"><button class="back-btn" onclick="history.length > 1 ? history.back() : (location.href='feed.html')">←</button><div class="nav-title" id="navTitle"></div></div>
    <div class="container" id="root"></div>

    <div class="modal" id="modal" onclick="if(event.target===this) closeModal()">
        <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;"><h2 id="modalTitle"></h2><button class="btn gray small" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div>
    </div>
    <input type="file" id="fileOne" accept="image/*,video/mp4,video/webm,video/quicktime" style="display:none">
    <input type="file" id="fileMany" accept="image/*,video/mp4,video/webm,video/quicktime" multiple style="display:none">

    <script>
        const currentUser = JSON.parse(localStorage.getItem('camfeed_user') || 'null');
        if (!currentUser) window.location.href = 'index.html';
        // one language on the whole page: Khmer, or English when the person chose English
        let LANG = 'km'; try { LANG = localStorage.getItem('camfeed_lang') === 'en' ? 'en' : 'km'; } catch (e) {}
        const T = (km, en) => (LANG === 'en' ? en : km);
        const num = (n) => Number(n || 0).toLocaleString('en-US');
        const $ = (id) => document.getElementById(id);
        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }

        const GOALS = [
            { id: 'products', icon: '🛍️', t: T('លក់ផលិតផល', 'Sell products'), d: T('បង្ហាញទំនិញច្រើនមុខ ឲ្យគេឆាតមកទិញ', 'Show several products; people message you to buy') },
            { id: 'messages', icon: '💬', t: T('ឲ្យគេឆាតមករក', 'Get messages'), d: T('ប៊ូតុងផ្ញើសារមកអ្នកភ្លាម', 'A button to message you at once') },
            { id: 'reach', icon: '👀', t: T('ឲ្យមនុស្សច្រើនឃើញ', 'Reach more people'), d: T('ឲ្យគេស្គាល់ហាង ឬម៉ាករបស់អ្នក', 'Make your shop or brand known') },
            { id: 'engagement', icon: '👍', t: T('ចូលចិត្ត មតិ និងចែករំលែក', 'Likes, comments and shares'), d: T('ផ្សព្វផ្សាយការបង្ហោះមួយរបស់អ្នក', 'Promote one of your posts') },
            { id: 'video_views', icon: '🎬', t: T('ឲ្យគេមើលវីដេអូ', 'Video views'), d: T('វីដេអូរបស់អ្នក', 'Your video') },
            { id: 'traffic', icon: '🔗', t: T('ឲ្យគេចុចតំណភ្ជាប់', 'Link clicks'), d: T('ទៅកាន់ Telegram ឬវេបសាយរបស់អ្នក', 'To your Telegram or website') },
        ];
        const PLACES = [
            { id: 'feed', t: T('📰 ហ្វីត (ទំព័រដើម)', '📰 Feed (home)'), d: T('បង្ហាញក្នុងចំណោមការបង្ហោះ', 'Shown between posts') },
            { id: 'reels', t: T('🎬 Reels (វីដេអូខ្លី)', '🎬 Reels (short videos)'), d: T('បង្ហាញមុនវីដេអូខ្លី ហើយអ្នកមើលអាចរំលងបានក្រោយប៉ុន្មានវិនាទី', 'Shown before short videos; people can skip after a few seconds') },
            { id: 'story', t: T('📖 ស្តូរី', '📖 Stories'), d: T('បង្ហាញពេញអេក្រង់ នៅចន្លោះស្តូរីរបស់មនុស្ស', 'Full screen, between people\'s stories') },
        ];
        const DEVICES = [
            { id: 'android', t: T('🤖 Android', '🤖 Android'), d: T('កម្មវិធី CamFeed លើទូរស័ព្ទ Android', 'The CamFeed app on Android phones') },
            { id: 'ios', t: T('🍎 iPhone', '🍎 iPhone'), d: T('កម្មវិធី CamFeed លើ iPhone', 'The CamFeed app on iPhone') },
            { id: 'web', t: T('🌐 គេហទំព័រ', '🌐 Website'), d: T('camfeedkh.com លើកុំព្យូទ័រ ឬកម្មវិធីរុករក', 'camfeedkh.com on a computer or in a browser') },
        ];
        const OLD_PLACE = { feed_banner: ['feed'], video_preroll: ['reels'], both: ['feed', 'reels'] };
        const CTAS = [['learn_more', T('ស្វែងយល់បន្ថែម', 'Learn more')], ['message', T('ផ្ញើសារ', 'Send message')], ['shop', T('ទិញឥឡូវ', 'Shop now')], ['call', T('ទាក់ទង', 'Contact')], ['none', T('គ្មានប៊ូតុង', 'No button')]];
        const STATUS = { pending: T('⏳ កំពុងពិនិត្យ', '⏳ Being checked'), quoted: T('💵 រង់ចាំការបង់ប្រាក់', '💵 Waiting for payment'), payment_sent: T('🔎 CamFeed កំពុងពិនិត្យការបង់ប្រាក់', '🔎 CamFeed is checking the payment'),
            starting: T('🔎 CamFeed កំពុងពិនិត្យការបង់ប្រាក់', '🔎 CamFeed is checking the payment'), live: T('🟢 កំពុងបង្ហាញ', '🟢 Running'), ended: T('✔ ចប់ហើយ', '✔ Ended'), completed: T('✔ ថវិកាអស់ហើយ', '✔ Budget used'), rejected: T('✖ មិនអនុម័ត', '✖ Not approved') };
        const st = { goal: 'products', mode: 'new', places: new Set(['feed', 'reels', 'story']), devices: new Set(['android', 'ios', 'web']), cc: 'KH', postId: null, mediaUrl: '', items: [], kws: [], provs: new Set(), gender: '', amin: 0, amax: 0, posts: [], words: [], info: { minBudget: 2, provinces: [] } };
        let estTimer = null, pollTimer = null;

        function chip(label, on, fn, cls) { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (on ? ' on' : '') + (cls ? ' ' + cls : ''); b.textContent = label; b.addEventListener('click', fn); return b; }
        function setMsg(id, ok, text) { const m = $(id); m.className = 'msg ' + (ok ? 'ok' : 'bad'); m.textContent = text; }
        function closeModal() { $('modal').classList.remove('show'); }
        function openModal(title, html) { $('modalTitle').textContent = title; $('modalBody').innerHTML = html; $('modal').classList.add('show'); }

        // ---------------- the page ----------------
        function build() {
            $('navTitle').textContent = T('📢 ផ្សាយពាណិជ្ជកម្ម', '📢 Advertise');
            $('root').innerHTML = `
            <div class="tabs"><button class="tab on" id="tabNew">${T('➕ បង្កើតពាណិជ្ជកម្ម', '➕ New ad')}</button><button class="tab" id="tabMine">${T('📊 ពាណិជ្ជកម្មរបស់ខ្ញុំ', '📊 My ads')}</button></div>
            <div id="paneNew" style="display:flex;flex-direction:column;gap:14px;">
                <div class="card"><h2>${T('ឲ្យអ្នកដែលចាប់អារម្មណ៍ ឃើញអាជីវកម្មរបស់អ្នក', 'Show your business to the people who care')}</h2>
                    <p class="muted">${T('CamFeed បង្ហាញពាណិជ្ជកម្មរបស់អ្នកទៅកាន់អ្នកដែលកំពុងស្វែងរក ឬមើលអ្វីដែលទាក់ទងនឹងផលិតផលរបស់អ្នក។ អ្នកបង់តាមចំនួនដងបង្ហាញពិតប្រាកដ ហើយមើលលទ្ធផលបានរៀងរាល់ថ្ងៃ។', 'CamFeed shows your ad to people who are searching for or watching things related to what you sell. You pay for real views only, and see the results every day.')}</p>
                    <p class="muted" id="rateLine" style="margin-top:6px;"></p></div>

                <div class="card"><h2><span class="step">1</span>${T('តើអ្នកចង់បានអ្វី?', 'What do you want?')}</h2><div class="goals" id="goals"></div></div>

                <div class="card"><h2><span class="step">2</span>${T('អ្វីដែលត្រូវបង្ហាញ', 'What to show')}</h2>
                    <div class="chips" id="modeChips"></div>
                    <div id="boxProducts"></div>
                    <div id="boxPost" style="display:none;"><p class="muted" style="margin-top:8px;">${T('ជ្រើសការបង្ហោះសាធារណៈមួយរបស់អ្នក។ មនុស្សនៅតែអាចចូលចិត្ត បញ្ចេញមតិ និងចែករំលែកបានដូចធម្មតា។', 'Choose one of your public posts. People can still like, comment and share as usual.')}</p><div class="posts" id="postList"></div></div>
                    <div id="boxCaption"><label>${T('ពាក្យពណ៌នា', 'Text')}</label><textarea id="fCaption" rows="3" maxlength="500" placeholder="${T('ឧ. បញ្ចុះតម្លៃ 50% ថ្ងៃនេះ!', 'e.g. 50% off today!')}"></textarea></div>

                    <div id="boxCta"><label>${T('ប៊ូតុង', 'Button')}</label><select id="fCta">${CTAS.map(c => `<option value="${c[0]}">${esc(c[1])}</option>`).join('')}</select></div>
                    <div class="preview" id="preview"></div>

                    <div class="chips" id="kwChips"></div>
                    <div style="display:flex;gap:8px;margin-top:10px;"><input id="kwIn" list="kwList" placeholder="${T('សរសេរពាក្យ ហើយចុច បន្ថែម', 'Type a word and press Add')}"><button type="button" class="btn gray small" id="kwAdd">${T('បន្ថែម', 'Add')}</button></div>
                    <datalist id="kwList"></datalist>
                    <div style="margin-top:10px;"><button type="button" class="btn small" id="kwAi">🤖 ${T('ឲ្យ AI ជ្រើសពីរូប និងពាក្យពណ៌នា', 'Let the AI choose from the pictures and text')}</button></div>
                    <div class="muted" id="kwMsg" style="margin-top:6px;"></div>

                <div class="card"><h2><span class="step">4</span>${T('អ្នកដែលនឹងឃើញ', 'Who will see it')}</h2>

                    <div id="provBox"><label>${T('ខេត្ត / រាជធានី', 'Province')}</label><div class="chips" id="provChips"></div></div>
                    <label>${T('អាយុ', 'Age')}</label>
                    <div class="two"><select id="fAmin"></select><select id="fAmax"></select></div>
                    <label>${T('ភេទ', 'Gender')}</label><div class="chips" id="genChips"></div>
                    <p class="muted" style="margin-top:10px;">${T('អ្នកដែលមិនបានបំពេញខេត្ត អាយុ ឬភេទក្នុងប្រូហ្វាល នៅតែអាចឃើញ។', 'People who did not fill in their province, age or gender can still see it.')}</p>
                </div>

                <div class="card"><h2><span class="step">5</span>${T('កន្លែងបង្ហាញ', 'Where')}</h2>
                    <p class="muted">${T('ធីកមួយ ច្រើន ឬទាំងអស់ក៏បាន។', 'Tick one, several or all.')}</p><div id="places"></div>
                    <label style="margin-top:14px;">${T('ប្រភេទទូរស័ព្ទ', 'Kind of phone')}</label><div id="devices"></div></div>

                <div class="card"><h2><span class="step">6</span>${T('ថវិកា និងរយៈពេល', 'Budget and days')}</h2>
                    <label>${T('ថវិកាសរុប (ដុល្លារ)', 'Total budget (USD)')}</label><div class="chips" id="budgetChips"></div>
                    <input id="fBudget" type="number" min="1" step="0.5" value="5" style="margin-top:8px;">
                    <label>${T('រយៈពេល (ថ្ងៃ)', 'Days')}</label><div class="chips" id="dayChips"></div>
                    <input id="fDays" type="number" min="1" max="30" value="5" style="margin-top:8px;">
                    <div class="est" id="est"></div>
                    <div style="margin-top:14px;"><button class="btn" id="fSend">${T('បន្តទៅបង់ប្រាក់ →', 'Continue to payment →')}</button></div>
                    <div class="msg" id="fMsg"></div>
                </div>
            </div>
            <div id="paneMine" style="display:none;"><div class="card"><h2>${T('📋 ពាណិជ្ជកម្មរបស់ខ្ញុំ', '📋 My ads')}</h2><div id="myReqs" class="muted"></div></div></div>`;
            $('tabNew').onclick = () => showTab('new'); $('tabMine').onclick = () => showTab('mine');
            $('kwAdd').onclick = () => addKw($('kwIn').value); $('kwIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addKw($('kwIn').value); } });
            $('kwAi').onclick = suggestKw; $('fSend').onclick = sendRequest;
            ['fBudget', 'fDays'].forEach(i => $(i).addEventListener('input', () => { drawBudget(); estimate(); }));
            ['fCaption', 'fCta'].forEach(i => $(i).addEventListener('input', drawPreview));
            const ages = [0, 13, 18, 25, 35, 45, 55, 65];
            $('fAmin').innerHTML = ages.map(a => `<option value="${a}">${a ? T('ពី ' + a + ' ឆ្នាំ', 'From ' + a) : T('ពីអាយុណាក៏បាន', 'Any age from')}</option>`).join('');
            $('fAmax').innerHTML = ages.map(a => `<option value="${a}">${a ? T('ដល់ ' + a + ' ឆ្នាំ', 'To ' + a) : T('ដល់អាយុណាក៏បាន', 'Any age to')}</option>`).join('');
            ['fAmin', 'fAmax'].forEach(i => $(i).addEventListener('change', () => { st.amin = Number($('fAmin').value); st.amax = Number($('fAmax').value); estimate(); }));
        }
        function showTab(t) {
            $('paneNew').style.display = t === 'new' ? 'flex' : 'none'; $('paneMine').style.display = t === 'mine' ? 'block' : 'none';
            $('tabNew').classList.toggle('on', t === 'new'); $('tabMine').classList.toggle('on', t === 'mine'); if (t === 'mine') loadMine();
        }

        function drawGoals() {
            $('goals').innerHTML = GOALS.map(g => `<button type="button" class="opt ${st.goal === g.id ? 'on' : ''}" data-goal="${g.id}"><b>${g.icon} ${esc(g.t)}</b><span>${esc(g.d)}</span></button>`).join('');
            $('goals').querySelectorAll('[data-goal]').forEach(b => b.addEventListener('click', () => { st.goal = b.dataset.goal; if (st.goal === 'engagement') st.mode = 'post'; if (st.goal === 'products') st.mode = 'new'; drawGoals(); syncGoal(); }));
        }
        function syncGoal() {
            const prod = st.goal === 'products';
            $('modeChips').innerHTML = '';
            if (!prod) { $('modeChips').appendChild(chip(T('🆕 ពាណិជ្ជកម្មថ្មី', '🆕 New ad'), st.mode === 'new', () => setMode('new'))); $('modeChips').appendChild(chip(T('🚀 ការបង្ហោះរបស់ខ្ញុំ', '🚀 One of my posts'), st.mode === 'post', () => setMode('post'))); }
            $('boxProducts').style.display = st.mode === 'new' ? 'block' : 'none';
            $('boxPost').style.display = !prod && st.mode === 'post' ? 'block' : 'none';
            $('boxCaption').style.display = st.mode === 'post' ? 'none' : 'block';
            $('boxLink').style.display = st.goal === 'traffic' && st.mode === 'new' ? 'block' : 'none';
            $('boxCta').style.display = !prod && st.goal !== 'messages' && st.mode === 'new' ? 'block' : 'none';
            if (st.mode === 'post' && !st.posts.length) loadPosts();
            drawProducts(); drawPreview();
        }
        function setMode(m) { st.mode = m; syncGoal(); }

        // ---- 🖼️ pictures / videos (up to 60); for "sell products" each one may have a name and a price (both optional) ----
        const MAXM = 60;
        const isVid = (u) => /\.(mp4|webm|mov|m4v)(\?|$)/i.test(u || '');
        function drawProducts() {
            const box = $('boxProducts'), prod = st.goal === 'products';
            box.innerHTML = `<label>${T('រូបភាព និងវីដេអូ', 'Pictures and videos')} (${st.items.length}/${MAXM})</label>` +
                (prod && st.items.length ? `<div class="muted">${T('ឈ្មោះ និងតម្លៃ មិនបាច់ដាក់ក៏បាន (អតិថិជនអាចឆាតសួរ)។', 'Name and price are optional (customers can ask in chat).')}</div>` : '') +
                st.items.map((it, i) => `
                <div class="prod">${isVid(it.url) ? `<video src="${esc(it.url)}#t=0.5" preload="metadata" muted style="width:64px;height:64px;border-radius:8px;object-fit:cover;background:#000;flex-shrink:0"></video>` : `<img src="${esc(it.url)}" alt="">`}
                    <div class="f">${prod ? `<input data-i="${i}" data-k="name" maxlength="60" value="${esc(it.name)}" placeholder="${T('ឈ្មោះផលិតផល (មិនបាច់ក៏បាន)', 'Product name (optional)')}"><input data-i="${i}" data-k="price" maxlength="30" value="${esc(it.price)}" placeholder="${T('តម្លៃ (មិនបាច់ក៏បាន)', 'Price (optional)')}">` : `<span class="muted">${i + 1}</span>`}</div>
                    <button type="button" class="x" data-del="${i}">✕</button></div>`).join('') +
                (st.items.length < MAXM ? `<button type="button" class="pick" id="pickMany" style="margin-top:8px;">➕ ${st.items.length ? T('បន្ថែមរូបភាព ឬវីដេអូ', 'Add pictures or videos') : T('ជ្រើសរូបភាព ឬវីដេអូ (បានច្រើន)', 'Choose pictures or videos (several)')}</button>` : '') + '<div class="muted" id="upMany" style="margin-top:4px;"></div>';
            box.querySelectorAll('input[data-i]').forEach(inp => inp.addEventListener('input', () => { st.items[Number(inp.dataset.i)][inp.dataset.k] = inp.value; drawPreview(); }));
            box.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => { st.items.splice(Number(b.dataset.del), 1); drawProducts(); drawPreview(); }));
            const pm = $('pickMany'); if (pm) pm.onclick = () => (inApp() ? appPick() : $('fileMany').click());
        }
        async function upload(f) {
            const u = await (await fetch('/api/videos/upload-url', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_email: currentUser.email, file_name: f.name, content_type: f.type || 'application/octet-stream' }) })).json();
            if (!u.uploadUrl) throw new Error(T('មិនអាចផ្ញើឯកសារនេះបានទេ', 'This file can not be sent'));
            const put = await fetch(u.uploadUrl, { method: 'PUT', headers: { 'Content-Type': f.type || 'application/octet-stream' }, body: f });
            if (!put.ok) throw new Error(T('ផ្ញើមិនបាន', 'Upload failed') + ' (' + put.status + ')');
            return u.publicUrl;
        }
        const inApp = () => !!(window.flutter_inappwebview && window.flutter_inappwebview.callHandler) && /CamFeedApp/.test(navigator.userAgent);
        async function appPick() {
            try {
                $('upMany').textContent = '';
                const r = await window.flutter_inappwebview.callHandler('camfeedPickMedia', { max: MAXM - st.items.length });
                (Array.isArray(r) ? r : []).forEach(x => { if (x && x.url && st.items.length < MAXM) st.items.push({ url: x.url, type: x.type === 'video' ? 'video' : 'image', name: '', price: '' }); });
                drawProducts(); drawPreview();
            } catch (e) { $('fileMany').click(); }
        }
        $('fileMany').addEventListener('change', async (ev) => {
            const files = Array.from(ev.target.files || []).slice(0, MAXM - st.items.length); ev.target.value = '';
            for (let i = 0; i < files.length; i++) {
                $('upMany').textContent = T('កំពុងផ្ញើ ', 'Uploading ') + (i + 1) + '/' + files.length + '…';
                try { const u = await upload(files[i]); st.items.push({ url: u, type: (files[i].type || '').startsWith('video') || isVid(u) ? 'video' : 'image', name: '', price: '' }); drawProducts(); }
                catch (e) { $('upMany').textContent = '❌ ' + e.message; return; }
            }
            drawProducts(); drawPreview();
        });
        async function loadPosts() {
            $('postList').innerHTML = `<div class="muted">${T('កំពុងផ្ទុក…', 'Loading…')}</div>`;
            try {
                const d = await (await fetch('/api/ads/my-posts')).json(); st.posts = d.posts || [];
                $('postList').innerHTML = st.posts.length ? st.posts.map(p => {
                    const isVid = p.media_type === 'video', isImg = p.media_type === 'image';
                    const th = isImg ? `<img src="${esc(p.media_url)}" alt="">` : (isVid ? `<video src="${esc(p.media_url)}" muted preload="metadata"></video>` : '📝');
                    return `<div class="postopt ${st.postId === p.id ? 'on' : ''}" data-pid="${Number(p.id)}"><div class="th">${th}</div><div><div class="notranslate" translate="no" style="font-size:13.5px;font-weight:700;">${esc(p.content || (isVid ? T('🎬 វីដេអូ', '🎬 Video') : T('🖼️ រូបភាព', '🖼️ Picture')))}</div><div class="muted">${new Date(p.created_at).toLocaleDateString()}</div></div></div>`;
                }).join('') : `<div class="muted">${T('អ្នកមិនទាន់មានការបង្ហោះសាធារណៈទេ។', 'You have no public posts yet.')}</div>`;
                $('postList').querySelectorAll('[data-pid]').forEach(el => el.addEventListener('click', () => { st.postId = Number(el.dataset.pid); $('postList').querySelectorAll('.postopt').forEach(x => x.classList.toggle('on', x === el)); drawPreview(); }));
            } catch (e) { $('postList').innerHTML = `<div class="muted">${T('ផ្ទុកមិនបាន', 'Could not load')}</div>`; }
        }
        function drawPreview() {
            const me = st.info.me || {};
            let cap = $('fCaption').value, media = `<div class="pm"><div class="muted" style="padding:20px;">${T('រូបភាព ឬវីដេអូរបស់អ្នក', 'Your picture or video')}</div></div>`;
            if (st.mode === 'new' && st.items.length > 1 && window.CamGrid) media = CamGrid.html(0, st.items.map(x => ({ url: x.url, type: x.type, name: x.name, price: x.price })));
            else if (st.mode === 'new' && st.items.length === 1) media = isVid(st.items[0].url) ? `<video src="${esc(st.items[0].url)}" muted playsinline preload="metadata" controls style="width:100%;display:block;background:#000"></video>` : `<img src="${esc(st.items[0].url)}" alt="" style="width:100%;height:auto;display:block">`;
            else if (st.mode === 'post') { const p = st.posts.find(x => x.id === st.postId); if (p) { cap = p.content; media = `<div class="pm">${p.media_type === 'image' ? `<img src="${esc(p.media_url)}" alt="">` : (p.media_type === 'video' ? `<video src="${esc(p.media_url)}" muted playsinline preload="metadata"></video>` : `<div class="muted" style="padding:20px;">📝</div>`)}</div>`; } }
            const ctaId = (st.goal === 'products' || st.goal === 'messages') ? 'message' : $('fCta').value;
            const ctaLabel = (CTAS.find(c => c[0] === ctaId) || [])[1];
            $('preview').innerHTML = `<div class="ph"><img src="${esc(me.pic || 'logo-icon.png')}" alt=""><div><div class="n notranslate" translate="no">${esc(me.name || '')}</div><div class="s">${T('ផ្សាយពាណិជ្ជកម្ម', 'Sponsored')}</div></div></div>` +
                (cap ? `<div class="notranslate" translate="no" style="padding:0 12px 10px;font-size:14px;white-space:pre-wrap;">${esc(cap)}</div>` : '') + media +
                (ctaId !== 'none' && st.mode === 'new' ? `<div class="cta"><span>${esc(ctaLabel || '')}</span></div>` : '');
        }

        // ---- 🏷️ keywords ----
        function drawKw() {
            $('kwChips').innerHTML = '';
            if (!st.kws.length) $('kwChips').innerHTML = `<span class="muted">${T('មិនទាន់មានពាក្យគន្លឹះទេ', 'No keywords yet')}</span>`;
            st.kws.forEach((w, i) => { const b = chip(w, false, () => { st.kws.splice(i, 1); drawKw(); estimate(); }, 'kw'); const x = document.createElement('i'); x.textContent = '✕'; b.appendChild(x); $('kwChips').appendChild(b); });
        }
        function findWord(v) {
            const n = String(v || '').trim().toLowerCase(); if (!n) return null;
            for (const w of st.words) { if (w.word.toLowerCase() === n || String(w.syn || '').toLowerCase().split(',').map(s => s.trim()).includes(n)) return w.word; }
            return null;
        }
        function addKw(v) {
            const w = findWord(v);
            if (!w) { $('kwMsg').textContent = T('រកមិនឃើញពាក្យនេះក្នុងបញ្ជីទេ។ សូមជ្រើសពីបញ្ជីដែលលោតឡើង។', 'This word is not in the list. Please choose one from the list.'); return; }
            $('kwMsg').textContent = ''; $('kwIn').value = '';
            if (!st.kws.includes(w) && st.kws.length < 12) st.kws.push(w); drawKw(); estimate();
        }
        async function suggestKw() {
            const urls = st.mode === 'new' ? st.items.map(i => i.url).slice(0, 3) : [];
            let text = $('fCaption').value + ' ' + st.items.map(i => i.name).join(', ');
            if (st.mode === 'post') { const p = st.posts.find(x => x.id === st.postId); if (p) text = p.content || ''; }
            if (!urls.length && !text.trim()) { $('kwMsg').textContent = T('សូមបន្ថែមរូប ឬពាក្យពណ៌នាជាមុនសិន។', 'Please add a picture or some text first.'); return; }
            $('kwAi').disabled = true; $('kwMsg').textContent = T('🤖 AI កំពុងមើល…', '🤖 The AI is looking…');
            try {
                const d = await (await fetch('/api/ads/suggest-keywords', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, urls: urls.slice(0, 3) }) })).json();
                if (!d.success) throw new Error(d.error === 'busy' ? T('AI រវល់បន្តិច សូមសាកម្ដងទៀតក្រោយមួយភ្លែត។', 'The AI is busy. Please try again in a moment.') : (T('AI មិនបានឆ្លើយទេ។ សូមបន្ថែមពាក្យដោយខ្លួនឯង។', 'The AI did not answer. Please add words yourself.') + (d.why ? ' (' + d.why + ')' : '')));
                (d.words || []).forEach(w => { if (!st.kws.includes(w) && st.kws.length < 12) st.kws.push(w); });
                $('kwMsg').textContent = (d.words || []).length ? T('✅ AI បានជ្រើស ' + d.words.length + ' ពាក្យ។ ចុចលើពាក្យណាដែលមិនត្រូវ ដើម្បីលុប។', '✅ The AI chose ' + d.words.length + ' words. Tap a wrong one to remove it.') : T('AI រកមិនឃើញពាក្យសមស្របទេ។ សូមបន្ថែមដោយខ្លួនឯង។', 'The AI found nothing that fits. Please add some yourself.');
                drawKw(); estimate();
            } catch (e) { $('kwMsg').textContent = '❌ ' + e.message; }
            $('kwAi').disabled = false;
        }

        // ---- 📍 who ----
        const provName = (id) => { const p = (st.info.provinces || []).find(x => x.id === id); return p ? T(p.km, p.en) : id; };
        function drawWho() {

            // two separate ways: 📷 scan the QR  /  📱 open the ABA app (only the chosen one is shown)
            const ways = [];
            if (W.abaQr) ways.push(['qr', '📷 ' + T('ស្កេន QR', 'Scan the QR')]);
            if (W.abaLink) ways.push(['link', '📱 ' + T('បើកកម្មវិធី ABA', 'Open the ABA app')]);
            function showWay(k) {
                $('payWays').querySelectorAll('.chip').forEach((c, i) => c.classList.toggle('on', ways[i][0] === k));
                $('payShow').innerHTML = k === 'qr'
                    ? `<div class="muted">${T('ស្កេន QR នេះ ពីកម្មវិធីធនាគារណាក៏បាន ហើយបង់ចំនួនខាងលើ', 'Scan this QR from any bank app and pay the amount above')}</div>
                       <img src="${esc(W.abaQr)}" alt="KHQR" style="width:100%;max-width:260px;margin:8px auto;display:block;border-radius:12px;">`
                    : `<div class="muted">${T('ចុចប៊ូតុងខាងក្រោម ដើម្បីបើក ABA ហើយបង់ចំនួនខាងលើ', 'Tap the button below to open ABA and pay the amount above')}</div>
                       <a class="btn" href="${esc(W.abaLink)}" target="_blank" rel="noopener noreferrer" style="display:block;text-align:center;text-decoration:none;margin-top:8px;">📱 ${T('បើក ABA ដើម្បីបង់', 'Open ABA to pay')}</a>`;
            }
            ways.forEach(w => $('payWays').appendChild(chip(w[1], false, () => showWay(w[0]))));
            if (ways.length === 1) { $('payWays').style.display = 'none'; showWay(ways[0][0]); }
            let receipt = '', upBusy = false;
            $('topFile').addEventListener('change', async (ev) => {
                const f = ev.target.files && ev.target.files[0]; receipt = ''; if (!f) return;
                if (!/^image\//.test(f.type || '')) { $('topUp').textContent = T('❌ សូមដាក់រូបភាព', '❌ Please choose a picture'); return; }
                upBusy = true; $('topUp').textContent = T('កំពុងអាប់ឡូត…', 'Uploading…');
                try {
                    const u = await (await fetch('/api/videos/upload-url', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_email: currentUser.email, file_name: f.name || 'receipt.jpg', content_type: f.type || 'image/jpeg' }) })).json();
                    if (!u.uploadUrl) throw new Error('x');
                    const put = await fetch(u.uploadUrl, { method: 'PUT', headers: { 'Content-Type': f.type || 'image/jpeg' }, body: f });
                    if (!put.ok) throw new Error('x');
                    receipt = u.publicUrl; $('topUp').textContent = T('✅ អាប់ឡូតរួចរាល់', '✅ Uploaded');
                } catch (e) { $('topUp').textContent = T('❌ អាប់ឡូតមិនបាន។ សូមសាកម្ដងទៀត។', '❌ Upload failed. Please try again.'); }
                upBusy = false;
            });
            $('topGo').addEventListener('click', async () => {
                const btn = $('topGo'), amt = Number($('topAmt').value);
                if (upBusy) { setMsg('topMsg', false, T('សូមរង់ចាំការអាប់ឡូតរូបបន្តិច…', 'Please wait for the picture to upload…')); return; }
                if (!receipt && !$('topRef').value.trim()) { setMsg('topMsg', false, T('សូមដាក់រូបវិក្កយបត្រ', 'Please add the photo of the receipt')); return; }
                if (!(amt >= W.min && amt <= W.max)) { setMsg('topMsg', false, T('ចំនួនត្រូវចាប់ពី $' + W.min + ' ដល់ $' + W.max, 'The amount must be from $' + W.min + ' to $' + W.max)); return; }
                if (!confirm(T('តើអ្នកបានបង់ $' + amt.toFixed(2) + ' តាម ABA រួចហើយមែនទេ?', 'Have you already paid $' + amt.toFixed(2) + ' by ABA?'))) return;
                btn.disabled = true;
                try {
                    const d = await (await fetch('/api/ad-wallet/manual', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ amount: amt, ref: $('topRef').value, receipt }) })).json();
                    if (!d.success) { setMsg('topMsg', false, d.code === 'amount' ? T('ចំនួនត្រូវចាប់ពី $' + d.min + ' ដល់ $' + d.max, 'The amount must be from $' + d.min + ' to $' + d.max) : d.code === 'many' ? T('សូមរង់ចាំ CamFeed ពិនិត្យការបង់ប្រាក់មុនៗសិន។', 'Please wait until CamFeed checks the ones you sent.') : T('មិនបាន។ សូមសាកម្ដងទៀត។', 'Failed. Please try again.')); btn.disabled = false; return; }
                    $('topMsg').className = 'msg';
                    ['topChips', 'topAmt', 'topAba', 'topFile', 'topUp', 'topRef', 'topGo'].forEach(i => { if ($(i)) $(i).style.display = 'none'; });
                    $('topQr').innerHTML = `<div style="text-align:center;margin-top:8px;"><div style="font-size:26px;font-weight:800;">$${Number(d.amount).toFixed(2)}</div>
                        <div class="muted" id="topWait" style="margin-top:8px;">⏳ ${T('CamFeed កំពុងពិនិត្យការបង់ប្រាក់ (W' + Number(d.id) + ')។ ពេលឃើញលុយចូល វានឹងចូលកាបូបអ្នកភ្លាម ហើយអ្នកនឹងទទួលការជូនដំណឹង។ អ្នកអាចបិទទំព័រនេះបាន។', 'CamFeed is checking the payment (W' + Number(d.id) + '). When the money is seen it goes into your wallet at once and you get a notification. You can close this page.')}</div></div>`;
                    loadWallet();
                    clearInterval(topTimer);
                    const until = Date.now() + 30 * 60 * 1000;
                    topTimer = setInterval(async () => {
                        if (!$('topWait') || Date.now() > until) { clearInterval(topTimer); return; }
                        try {
                            const x = await (await fetch('/api/ad-wallet/topup/' + Number(d.id))).json();
                            if (x.success && x.status === 'paid') {
                                clearInterval(topTimer);
                                $('topQr').innerHTML = `<div class="msg ok" style="display:block;font-size:15px;text-align:center;">✅ ${T('បានបញ្ចូល $' + Number(d.amount).toFixed(2) + ' ហើយ!', 'Added $' + Number(d.amount).toFixed(2) + '!')}<br>${T('កាបូប៖ ', 'Wallet: ')}<b>${money(x.balance)}</b></div>`;
                                await loadWallet(); loadMine(); estimate();
                                if (after) setTimeout(() => { closeModal(); after(); }, 1200);
                            } else if (x.success && x.status === 'rejected') {
                                clearInterval(topTimer);
                                $('topWait').textContent = T('❌ CamFeed មិនទាន់ឃើញប្រាក់ចូលទេ។ សូមពិនិត្យការផ្ទេរ ហើយសាកម្ដងទៀត។', '❌ CamFeed has not seen the money yet. Please check the transfer and try again.');
                                loadWallet(); loadMine();
                            }
                        } catch (e) {}
                    }, 5000);
                } catch (e) { setMsg('topMsg', false, T('❌ បញ្ហាបណ្ដាញ', '❌ Network problem')); btn.disabled = false; }
            });
        }
        let mine = [];
        function payBox(r, where) {
            const code = 'A' + Number(r.id);
            return `<div class="pay"><div>${T('ត្រូវបង់', 'Amount to pay')}</div><div class="amt">${money(r.price_cents)}</div>
                <div style="margin-top:6px;">${T('សរសេរលេខនេះក្នុង «ចំណាំ» ពេលផ្ទេរ៖', 'Write this in the transfer note:')} <span class="code">${code}</span></div>
                ${st.info.paymentQr ? `<img src="${esc(st.info.paymentQr)}" alt="QR">` : ''}
                <div class="txt">${esc(st.info.paymentText || '')}</div>
                <div style="margin-top:10px;"><label>${T('លេខប្រតិបត្តិការ (បើមាន)', 'Transaction number (if you have it)')}</label><input id="ref-${where}-${Number(r.id)}" maxlength="120"></div>
                <div style="margin-top:10px;"><button class="btn" onclick="sendPaid(${Number(r.id)}, '${where}')">✅ ${T('ខ្ញុំបានបង់ហើយ', 'I have paid')}</button></div>
                <div class="muted" style="margin-top:8px;">${T('CamFeed ពិនិត្យការបង់ប្រាក់ ហើយពាណិជ្ជកម្មចាប់ផ្ដើមភ្លាម។ អ្នកនឹងទទួលបានការជូនដំណឹង។', 'CamFeed checks the payment and the ad starts at once. You will get a notification.')}</div></div>`;
        }
        function openPay(id) { const r = mine.find(x => Number(x.id) === Number(id)); if (r && r.status === 'quoted') openModal(T('💵 បង់ប្រាក់', '💵 Pay'), payBox(r, 'm')); }
        async function sendPaid(id, where) {
            const inp = $('ref-' + where + '-' + id);
            const d = await (await fetch('/api/ads/my/' + id + '/paid', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pay_ref: inp ? inp.value : '' }) })).json().catch(() => ({}));
            if (d.success) { closeModal(); loadMine(); } else alert(d.error || T('មិនបាន', 'Failed'));
        }
        async function loadMine() {
            const box = $('myReqs'); clearTimeout(pollTimer);
            try {
                const d = await (await fetch('/api/ads/my')).json();
                mine = (d.success && d.requests) || [];
                const credit = Number(d.credit || 0);
                if (!mine.length) { box.innerHTML = walletCard() + `<div class="muted" style="margin-top:10px;">${T('មិនទាន់មានពាណិជ្ជកម្មទេ។', 'No ads yet.')}</div>`; return; }
                const reqHtml = (r) => {
                    const shown = r.ad_status === 'completed' ? 'completed' : (r.ad_status && r.status === 'live' && r.ends_at && new Date(r.ends_at) < new Date() ? 'ended' : r.status);
                    let extra = '';
                    if (r.status === 'quoted') extra = (r.admin_note ? `<div class="muted" style="margin-top:6px;color:#b42318;">${esc(r.admin_note)}</div>` : '') + payBox(r, 'l');
                    else if (r.status === 'payment_sent' || r.status === 'starting') extra = `<div class="muted" style="margin-top:6px;">${T('CamFeed កំពុងពិនិត្យការបង់ប្រាក់ ' + money(r.price_cents) + ' (ចំណាំ A' + Number(r.id) + ')។ ទំព័រនេះនឹងប្ដូរដោយខ្លួនឯង។', 'CamFeed is checking your payment of ' + money(r.price_cents) + ' (note A' + Number(r.id) + '). This page updates by itself.')}</div>`;
                    else if (r.status === 'rejected' && r.admin_note) extra = `<div class="muted" style="margin-top:6px;">${esc(r.admin_note)}</div>`;
                    else if (r.ad_id) {
                        const pct = r.budget_cents ? Math.min(100, Math.round(Number(r.spent_cents) / r.budget_cents * 100)) : 0;
                        extra = `<div class="muted" style="margin-top:8px;">👁️ ${num(r.impressions)} ${T('ដងបង្ហាញ', 'views')} · 👆 ${num(r.clicks)} ${T('ដងចុច', 'clicks')} · ${T('ចំណាយ', 'spent')} ${money(r.spent_cents)} / ${money(r.budget_cents)}</div><div class="progress"><i style="width:${pct}%"></i></div>` +
                            `<div style="margin-top:10px;"><button class="btn gray small" onclick="openReport(${Number(r.id)})">📊 ${T('មើលលទ្ធផលលម្អិត', 'See detailed results')}</button></div>`;
                    }
                    const goal = (GOALS.find(g => g.id === r.objective) || {}).t || '', place = (r.places ? String(r.places).split(',') : (OLD_PLACE[r.placement] || [])).map(x => (PLACES.find(p => p.id === x) || {}).t || '').filter(Boolean).join(' + ');
                    return `<div class="req"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;"><b>A${Number(r.id)}</b><span class="pill ${esc(shown)}">${STATUS[shown] || esc(shown)}</span></div>
                        <div class="muted">${esc(goal)} · ${esc(place)} · ${T(Number(r.days) + ' ថ្ងៃ', Number(r.days) + (Number(r.days) === 1 ? ' day' : ' days'))} · ${T('ថវិកា', 'budget')} ${money(r.budget_cents)}</div>${r.caption ? `<div class="notranslate" translate="no" style="font-size:13.5px;margin-top:4px;">${esc(String(r.caption).slice(0, 120))}</div>` : ''}${extra}</div>`;
                };
                box.innerHTML = (W.payway ? walletCard() : (credit > 0 ? `<div class="pay" style="border-style:solid">💳 ${T('ឥណទានពាណិជ្ជកម្មរបស់អ្នក៖', 'Your ad credit:')} <b>${money(credit)}</b><div class="muted">${T('នឹងកាត់ចេញពីប្រាក់ត្រូវបង់ ពេលអ្នកផ្សាយលើកក្រោយ។ ប្រើបានតែសម្រាប់ផ្សាយពាណិជ្ជកម្ម។', 'It is taken off the price of your next ad. It can only be used for ads.')}</div></div>` : '')) + mine.map(reqHtml).join('');
                if (mine.some(r => r.status === 'payment_sent' || r.status === 'starting')) pollTimer = setTimeout(loadMine, 15000);
            } catch (e) { box.textContent = T('ផ្ទុកមិនបាន', 'Could not load'); }
        }
        async function openReport(id) {
            openModal(T('📊 លទ្ធផល', '📊 Results'), `<div class="muted" style="margin-top:10px;">${T('កំពុងផ្ទុក…', 'Loading…')}</div>`);
            try {
                const d = await (await fetch('/api/ads/my/' + id + '/report')).json();
                if (!d.success) { $('modalBody').innerHTML = `<div class="muted" style="margin-top:10px;">${T('មិនទាន់មានលទ្ធផល', 'No results yet')}</div>`; return; }
                const r = d.report, cells = [
                    [T('👁️ ដងបង្ហាញ', '👁️ Views'), num(r.views)], [T('👤 មនុស្សដែលបានឃើញ', '👤 People reached'), num(r.reach)],
                    [T('👆 ដងចុច', '👆 Clicks'), num(r.clicks)], [T('📈 អត្រាចុច', '📈 Click rate'), r.ctr + '%'],
                    [T('💵 ចំណាយ', '💵 Spent'), '$' + r.spent.toFixed(2) + ' / $' + r.budget.toFixed(2)], [T('💰 តម្លៃក្នុង 1 ដងចុច', '💰 Cost per click'), r.costPerClick === null ? '—' : '$' + r.costPerClick]
                ];
                if (r.messages || r.objective === 'messages' || r.objective === 'products') cells.push([T('💬 ចុចផ្ញើសារ', '💬 Message taps'), num(r.messages)]);
                if (r.engagement) cells.push([T('👍 ការចូលចិត្ត', '👍 Reactions'), num(r.engagement.reactions)], [T('💭 មតិ', '💭 Comments'), num(r.engagement.comments)], [T('↗️ ចែករំលែក', '↗️ Shares'), num(r.engagement.shares)]);
                if (r.videoViews) cells.push([T('🎬 ដងបង្ហាញមុនវីដេអូ', '🎬 Video views'), num(r.videoViews)], [T('⏭️ រំលង', '⏭️ Skipped'), num(r.skips) + (r.skipRate !== null ? ' (' + r.skipRate + '%)' : '')], [T('✅ មើលចប់', '✅ Watched to the end'), num(r.completes) + (r.completionRate !== null ? ' (' + r.completionRate + '%)' : '')]);
                const max = Math.max(1, ...r.daily.map(x => x.views));
                $('modalBody').innerHTML = `<div class="grid2">${cells.map(c => `<div class="stat"><b>${esc(c[1])}</b><span>${esc(c[0])}</span></div>`).join('')}</div>
                    <h2 style="margin-top:16px;font-size:14px;">${T('ដងបង្ហាញ 14 ថ្ងៃចុងក្រោយ', 'Views, last 14 days')}</h2>
                    <div class="bars">${r.daily.map(x => `<div class="bar" title="${esc(x.day)}: ${x.views}" style="height:${Math.max(2, Math.round(x.views / max * 100))}%"></div>`).join('')}</div>
                    <div class="days">${r.daily.map(x => `<div>${esc(x.day.slice(8))}</div>`).join('')}</div>
                    <p class="muted" style="margin-top:10px;">${r.endsAt ? T('បញ្ចប់៖ ', 'Ends: ') + new Date(r.endsAt).toLocaleDateString() : ''}</p>`;
            } catch (e) { $('modalBody').innerHTML = `<div class="muted">${T('ផ្ទុកមិនបាន', 'Could not load')}</div>`; }
        }

        (async function init() {
            build();
            try { const i = await (await fetch('/api/ads/info')).json(); if (i.success) { st.info = i; st.cc = (i.me && i.me.cc) || 'KH'; $('rateLine').textContent = T('តម្លៃ៖ ទំព័រដើម $' + Number(i.cpmFeed).toFixed(2) + ' និងមុនវីដេអូ $' + Number(i.cpmVideo).toFixed(2) + ' ក្នុង 1,000 ដងបង្ហាញ · ថវិកាតិចបំផុត $' + i.minBudget, 'Price: home feed $' + Number(i.cpmFeed).toFixed(2) + ' and before videos $' + Number(i.cpmVideo).toFixed(2) + ' per 1,000 views · smallest budget $' + i.minBudget); $('fBudget').min = i.minBudget; } } catch (e) {}
            await loadWallet();
            try { const k = await (await fetch('/api/ads/keywords')).json(); st.words = k.words || []; $('kwList').innerHTML = st.words.map(w => `<option value="${esc(w.word)}">${esc(w.grp)}</option>`).join(''); } catch (e) {}
            drawGoals(); syncGoal(); drawKw(); drawWho(); drawPlaces(); drawBudget(); estimate();
            if (new URLSearchParams(location.search).get('tab') === 'mine') showTab('mine');
            const boost = Number(new URLSearchParams(location.search).get('boost') || 0);
            if (boost > 0) { st.goal = 'engagement'; st.mode = 'post'; st.postId = boost; drawGoals(); syncGoal(); }
        })();
    </script>
</body>
</html>
