function chart(v, days) {

function viewAnalytics(v) {

  var r = el('div', 'rings');
  // ⭕ 1: posts in the last 7 days against the goal CamFeed sets (green when reached)
  var goal = Math.max(1, data.weekGoal || 7), wk = data.totals.postsWeek || 0, wkDone = wk >= goal;
  r.appendChild(pRing(wkDone ? '✅ ' + wk + '/' + goal : wk + '/' + goal, Math.min(1, wk / goal), wkDone ? '#16a34a' : '#1877f2', '#e7f1ff', t('posts7')));

      row.appendChild(left);
      var num = el('b', ok ? 'cok' : 'cno', (ok ? '✅ ' : '') + Math.min(c.have, c.need).toLocaleString() + ' / ' + c.need.toLocaleString()); num.style.marginLeft = '12px';

  rangeBar(v);

  var g = el('div', 'tiles');
  g.appendChild(tile(t('views'), stats.totals.views.toLocaleString())); g.appendChild(tile(t('earn'), usd(stats.totals.earned), true));
  g.appendChild(tile(t('eng'), stats.totals.engagement.toLocaleString())); g.appendChild(tile(t('follows'), '+' + stats.totals.followers.toLocaleString()));
  v.appendChild(g);
  if (stats.days.length > 1) chart(v, stats.days);
  var notes = [t('approx')];
  if (stats.moneyLogSince && rng.from < stats.moneyLogSince) notes.push(t('since') + stats.moneyLogSince);
  if (stats.followSince && rng.from < stats.followSince) notes.push(t('followNote') + stats.followSince);
  v.appendChild(el('div', 'note', notes.join(' · ')));

// a post in a list; inRange = the views / money of the chosen days (else of all time)
function item(p, inRange) {

  var mid = el('div', 'it'); mid.appendChild(el('div', 'tx', p.text || (p.mediaType === 'video' ? t('video') : p.mediaType === 'image' ? t('photo') : t('text'))));

  it.appendChild(mid);
