<!DOCTYPE html>
<html lang="km">
<head>
<script src="auth-client.js"></script>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1877f2">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CamFeed">
<script src="pwa.js" defer></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CamFeed - Creator Dashboard</title>
<link rel="icon" type="image/png" href="logo-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body,button{font-family:'Plus Jakarta Sans','Noto Sans Khmer',sans-serif}
body{background:#fff;color:#050505;min-height:100vh;padding-bottom:40px}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;position:sticky;top:0;background:#fff;z-index:5;border-bottom:1px solid #e4e6eb}
.top h1{font-size:18px;font-weight:800}.back{background:none;border:0;font-size:24px;width:38px;height:38px;cursor:pointer}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
.tabs{display:flex;gap:10px;overflow-x:auto;padding:12px 0;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:#e4e6eb;color:#050505;font-weight:700;font-size:15px;padding:10px 20px;border-radius:22px;cursor:pointer;white-space:nowrap}.tab.on{background:#1877f2;color:#fff}
.me{display:flex;align-items:center;gap:12px;margin:10px 0 14px}.me img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#e4e6eb}.me b{font-size:19px}.me small{display:block;color:#65676b;margin-top:2px}
.rings{display:flex;justify-content:space-around;margin:16px 0 8px}
.ring{width:96px;height:96px;border-radius:50%;border:7px solid #e7f1ff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:18px}.ring.o{border-color:#fff1e3}.ring.p{border-color:#fde8ff}
.ringlbl{text-align:center;color:#65676b;font-weight:700;font-size:13px;margin-top:6px;width:96px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.tile{border:1px solid #dadde1;border-radius:16px;padding:12px 14px}.tile span{color:#65676b;font-size:14px;display:block}.tile b{font-size:24px;display:block;margin-top:6px}
.note{background:#f0f2f5;border-radius:14px;padding:12px 14px;color:#4b4c4f;font-size:14px;line-height:1.5;margin:10px 0}
.item{display:flex;gap:12px;padding:10px 0;border-top:1px solid #f0f2f5;cursor:pointer;align-items:center}.item:first-child{border-top:0}
.th{width:64px;height:84px;border-radius:10px;background:#e4e6eb;overflow:hidden;flex-shrink:0;position:relative}.th img,.th video{width:100%;height:100%;object-fit:cover;display:block}
.th i{position:absolute;left:4px;top:4px;font-style:normal;font-size:12px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:1px 5px}
.it{flex:1;min-width:0}.it .tx{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}.it small{color:#65676b;display:block;margin-top:4px;font-size:12.5px}
.earn{font-weight:800;white-space:nowrap}
.hero{max-width:300px;margin:12px auto;border-radius:18px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.18)}.hero .m{aspect-ratio:4/5;background:#e4e6eb}.hero .m img,.hero .m video{width:100%;height:100%;object-fit:cover;display:block}.hero p{padding:12px 14px;font-weight:600;word-break:break-word}
.meta{text-align:center;color:#65676b;margin:10px 0}
.ok{display:flex;gap:12px;align-items:center;border-radius:18px;padding:16px;box-shadow:0 1px 8px rgba(0,0,0,.12);margin:14px 0;font-size:16px}
.empty{text-align:center;color:#65676b;padding:30px 10px}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:12px;font-weight:800;font-size:15px;background:#1877f2;color:#fff;cursor:pointer;margin-top:10px}
.sec{font-size:22px;font-weight:800;margin:18px 0 8px}
</style>
</head>
<body>
<div class="top"><button class="back" id="backBtn">←</button><h1 id="hTitle">Creator Dashboard</h1><span style="width:38px"></span></div>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>
<script>
(function () {
var user = null; try { user = JSON.parse(localStorage.getItem('camfeed_user')); } catch (e) {}
if (!user) { location.href = 'index.html'; return; }
var lang = localStorage.getItem('camfeed_lang') === 'en' ? 'en' : 'km';
var T = {
 km: { title: 'ផ្ទាំងគ្រប់គ្រង Creator', details: 'ព័ត៌មានលម្អិតប្រកាស', analytics: 'ទិន្នន័យ', content: 'មាតិកា', monetize: 'រកលុយ', posts7: 'ប្រកាស (7 ថ្ងៃ)', views: 'ចំនួនមើល', eng: 'អន្តរកម្ម', earn: 'ប្រាក់ប៉ាន់ស្មាន', follows: 'អ្នកតាមដានថ្មី', likes: 'ចូលចិត្ត', comments: 'មតិ', shares: 'ចែករំលែក', all: 'ប្រកាសសរុប', wallet: 'កាបូប', none: 'មិនទាន់មានប្រកាស។ ចូលមកវិញបន្ទាប់ពីអ្នកបង្ហោះ។', first: 'បង្កើតប្រកាសដំបូងរបស់អ្នក', firstTx: 'អ្នកនឹងអាចមើលទិន្នន័យនៅទីនេះ បន្ទាប់ពីបង្ហោះ។', noIssue: 'ប្រកាសរបស់អ្នកគ្មានបញ្ហាទេ។', pub: 'សាធារណៈ', fr: 'មិត្តភក្តិ', me: 'តែខ្ញុំ', video: 'វីដេអូ', photo: 'រូបភាព', text: 'អត្ថបទ', creatorOn: '✅ អ្នកមានសិទ្ធិរកលុយ។ ប្រាក់ពីចំនួនមើលថ្មីៗចូលកាបូបរបស់អ្នក។', creatorOff: 'អ្នកមិនទាន់មានសិទ្ធិរកលុយទេ ដូច្នេះប្រាក់គឺ $0.00។ អ្នកអាចស្នើសុំនៅទំព័រ Monetization។', go: 'ទៅទំព័រ Monetization', approx: 'ប្រាក់ប៉ាន់ស្មាន ហើយមានកម្រិតអតិបរមាក្នុងមួយថ្ងៃ។', net: 'មិនទាន់មាន', err: 'មិនអាចទាញទិន្នន័យបាន', open: 'បើកប្រកាស' },
 en: { title: 'Creator Dashboard', details: 'Post details', analytics: 'Analytics', content: 'Content', monetize: 'Monetize', posts7: 'Posts (7 days)', views: 'Views', eng: 'Engagement', earn: 'Approximate earnings', follows: 'Net follows', likes: 'Likes', comments: 'Comments', shares: 'Shares', all: 'Total posts', wallet: 'Wallet', none: 'No posts yet. Come back after you post.', first: 'Create your first post', firstTx: "You'll be able to view details and insights here once you share a post.", noIssue: 'Your post has no issues.', pub: 'Public', fr: 'Friends', me: 'Only me', video: 'Video', photo: 'Photo', text: 'Text', creatorOn: '✅ You can earn money. Money from new views goes into your wallet.', creatorOff: 'You cannot earn money yet, so earnings are $0.00. You can apply on the Monetization page.', go: 'Go to Monetization', approx: 'Approximate, with a daily limit.', net: 'Not yet', err: 'Could not load', open: 'Open post' }
};
var t = function (k) { return T[lang][k]; };
var $ = function (id) { return document.getElementById(id); };
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function usd(n) { return '$' + Number(n || 0).toFixed(2); }
function when(d) { var x = new Date(d); return isNaN(x) ? '' : x.toLocaleString(lang === 'km' ? 'km-KH' : 'en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); }
function safeSrc(u) { return /^https?:\/\//i.test(u || '') ? u : ''; }
var data = null, tab = 'analytics', current = null;

function thumb(p) {
  var th = el('div', 'th'); var u = safeSrc(p.image);
  if (p.mediaType === 'video' && safeSrc(p.video)) { var v = el('video'); v.muted = true; v.preload = 'metadata'; v.playsInline = true; v.src = safeSrc(p.video) + '#t=0.3'; th.appendChild(v); th.appendChild(el('i', '', '▶')); }
  else if (u) { var i = el('img'); i.loading = 'lazy'; i.src = u; i.alt = ''; th.appendChild(i); }
  else th.appendChild(el('div', '', '')), th.firstChild.style.cssText = 'display:flex;align-items:center;justify-content:center;height:100%;font-size:24px', th.firstChild.textContent = '📝';
  return th;
}
function tile(label, value) { var d = el('div', 'tile'); d.appendChild(el('span', '', label)); d.appendChild(el('b', '', String(value))); return d; }
function who() { var m = el('div', 'me'); if (safeSrc(data.pic)) { var i = el('img'); i.src = data.pic; m.appendChild(i); } else m.appendChild(el('img')); var b = el('div'); b.appendChild(el('b', '', data.name || '')); b.appendChild(el('small', '', data.isCreator ? t('creatorOn') : t('creatorOff'))); m.appendChild(b); return m; }

function viewAnalytics(v) {
  v.appendChild(who());
  var r = el('div', 'rings');
  [['', data.totals.postsWeek + '/7', t('posts7')], ['o', String(data.totals.posts), t('all')], ['p', usd(data.totals.wallet), t('wallet')]].forEach(function (x) { var w = el('div'); var c = el('div', 'ring ' + x[0], x[1]); w.appendChild(c); w.appendChild(el('div', 'ringlbl', x[2])); r.appendChild(w); });
  v.appendChild(r);
  var g = el('div', 'tiles'); g.appendChild(tile(t('views'), data.totals.views.toLocaleString())); g.appendChild(tile(t('earn'), usd(data.totals.earnings))); g.appendChild(tile(t('eng'), data.totals.engagement.toLocaleString())); g.appendChild(tile(t('follows'), '--')); v.appendChild(g);
  if (!data.posts.length) { var e = el('div', 'empty'); e.appendChild(el('b', '', t('first'))); e.appendChild(el('div', '', t('firstTx'))); v.appendChild(e); return; }
  v.appendChild(el('div', 'sec', t('content')));
  data.posts.slice(0, 5).forEach(function (p) { v.appendChild(item(p)); });
  var more = el('button', 'btn', t('content')); more.onclick = function () { setTab('content'); }; v.appendChild(more);
}
function item(p) {
  var it = el('div', 'item'); it.appendChild(thumb(p));
  var mid = el('div', 'it'); mid.appendChild(el('div', 'tx', p.text || (p.mediaType === 'video' ? t('video') : p.mediaType === 'image' ? t('photo') : t('text'))));
  mid.appendChild(el('small', '', when(p.created_at) + ' · 👁 ' + p.views + ' · ❤ ' + (p.likes + p.comments + p.shares))); it.appendChild(mid);
  it.appendChild(el('div', 'earn', usd(p.earnings))); it.onclick = function () { current = p; render(); window.scrollTo(0, 0); }; return it;
}
function viewContent(v) {
  if (!data.posts.length) { v.appendChild(el('div', 'empty', t('none'))); return; }
  data.posts.forEach(function (p) { v.appendChild(item(p)); });
}
function viewMonetize(v) {
  v.appendChild(who());
  var g = el('div', 'tiles'); g.appendChild(tile(t('earn'), usd(data.totals.earnings))); g.appendChild(tile(t('wallet'), usd(data.totals.wallet))); v.appendChild(g);
  v.appendChild(el('div', 'note', t('approx')));
  var b = el('button', 'btn', t('go')); b.onclick = function () { location.href = 'monetization.html'; }; v.appendChild(b);
}
function viewPost(v, p) {
  var h = el('div', 'hero'), m = el('div', 'm'); var th = thumb(p); th.style.cssText = 'width:100%;height:100%;border-radius:0'; m.appendChild(th); h.appendChild(m); if (p.text) h.appendChild(el('p', '', p.text)); v.appendChild(h);
  v.appendChild(el('div', 'meta', '👥 ' + ({ public: t('pub'), friends: t('fr'), only_me: t('me') }[p.privacy] || t('pub')) + ' · 📅 ' + when(p.created_at)));
  var ok = el('div', 'ok'); ok.appendChild(el('span', '', '✅')); ok.appendChild(el('span', '', t('noIssue'))); v.appendChild(ok);
  var g = el('div', 'tiles'); g.appendChild(tile(t('views'), p.views.toLocaleString())); g.appendChild(tile(t('earn'), usd(p.earnings))); g.appendChild(tile(t('eng'), (p.likes + p.comments + p.shares).toLocaleString())); g.appendChild(tile(t('follows'), '--')); v.appendChild(g);
  var g2 = el('div', 'tiles'); g2.appendChild(tile(t('likes'), p.likes)); g2.appendChild(tile(t('comments'), p.comments)); g2.appendChild(tile(t('shares'), p.shares)); v.appendChild(g2);
  v.appendChild(el('div', 'note', t('approx')));
}
function setTab(k) { tab = k; current = null; render(); }
function render() {
  document.title = 'CamFeed - ' + t('title');
  $('hTitle').textContent = current ? t('details') : t('title');
  var tabs = $('tabs'); tabs.textContent = ''; tabs.style.display = current ? 'none' : 'flex';
  [['analytics', t('analytics')], ['content', t('content')], ['monetize', t('monetize')]].forEach(function (x) { var b = el('button', 'tab' + (tab === x[0] ? ' on' : ''), x[1]); b.onclick = function () { setTab(x[0]); }; tabs.appendChild(b); });
  var v = $('view'); v.textContent = ''; if (!data) return;
  if (current) viewPost(v, current); else if (tab === 'content') viewContent(v); else if (tab === 'monetize') viewMonetize(v); else viewAnalytics(v);
}
$('backBtn').onclick = function () { if (current) { current = null; render(); } else if (history.length > 1) history.back(); else location.href = 'feed.html'; };
fetch('/api/monetization/posts').then(function (r) { return r.json(); }).then(function (d) { if (!d.success) throw 0; data = d; render(); }).catch(function () { $('view').textContent = t('err'); });
render();
})();
</script>
</body>
</html>
