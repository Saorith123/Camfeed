    function opt(text, fn, red) { var b = el('button', 'opt' + (red ? ' red' : ''), text); b.onclick = function () { closeSheet(); fn(); }; s.appendChild(b); }
    opt(t('profile'), function () { location.href = 'profile.html?email=' + encodeURIComponent(p.email); });
    if (mine) {
      if (p.seat != null && p.role !== 'owner') opt(t('standUp'), standUp);
      return;
    }
    opt(t('sendGift'), function () { giftSheet(p.email); });
    if (canManage() && p.role !== 'owner' && !(p.role === 'helper' && me.role !== 'owner')) {
      if (p.seat == null) opt(t('invite'), function () { manage(p, 'invite'); });
      else { opt(t('unseat'), function () { manage(p, 'unseat'); }); opt(p.muted ? t('unmute') : t('mute'), function () { manage(p, p.muted ? 'unmute' : 'mute'); }); }
      if (me.role === 'owner') opt(p.role === 'helper' ? t('unhelper') : t('helper'), function () { manage(p, p.role === 'helper' ? 'unhelper' : 'helper'); });
      opt(t('kick'), async function () { if (await ask(tf('kickQ', [nm(p)]))) manage(p, 'kick'); }, true);
    }
  });
}
async function manage(p, action) {
  var r = await api('/api/party/rooms/' + roomId + '/manage', { target_email: p.email, action: action });
  if (!r.success) toast(r.error || t('net'));
  poll();
}
async function standUp() {
  var r = await api('/api/party/rooms/' + roomId + '/seat', { action: 'leave' });
  if (!r.success) { toast(r.error || t('net')); return; }
  if (r.live) await voice(r.live);
  poll();
}
$('handBtn').onclick = async function () {
  var up = !(st && st.me && st.me.hand);
  await api('/api/party/rooms/' + roomId + '/hand', { up: up });
  if (up) toast(t('handWait'));

};
$('micBtn').onclick = function () {
  if (st && st.me && st.me.muted) { toast(t('hostMuted')); return; }
  myMicOff = !myMicOff; micApply(); controls(st);
};
$('chatIn').addEventListener('keydown', async function (e) {
  if (e.key !== 'Enter') return;
  var v = this.value.trim(); if (!v || !roomId) return;
  this.value = '';
  var r = await api('/api/party/rooms/' + roomId + '/message', { text: v });

});
$('leaveBtn').onclick = async function () {
  if (!(await ask(isOwner() ? t('closeQ') : t('leaveQ')))) return;
  await api('/api/party/rooms/' + roomId + '/leave', {});
  exitRoom('');
};
$('followBtn').onclick = async function () {
  var on = !(st && st.room && st.room.following);
  await api('/api/party/rooms/' + roomId + '/follow', { on: on });
  poll();
};
$('moreBtn').onclick = function () {
  sheet(function (s) {
    function opt(text, fn, red) { var b = el('button', 'opt' + (red ? ' red' : ''), text); b.onclick = function () { closeSheet(); fn(); }; s.appendChild(b); }
    opt(t('copy'), function () { var u = location.origin + '/party.html?room=' + roomId; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(function () { toast(t('copied')); }).catch(function () { prompt('', u); }); });
    if (st && st.room && st.room.music) opt(musicOff ? t('musicOn') : t('musicOff'), function () { musicOff = !musicOff; music(st); });
    if (isOwner()) opt(t('settings'), settingsSheet);
    if (!isOwner()) opt(t('report'), async function () { await api('/api/party/rooms/' + roomId + '/report', { reason: 'Website' }); toast(t('reported')); }, true);
  });
};
function settingsSheet() {
  var r = st.room || {}, priv = r.privacy || 'public', seatsN = r.seats || 8, free = !!r.free_seats;
  sheet(function (s) {
    s.appendChild(el('h3', '', t('settings')));
    s.appendChild(el('label', '', t('rTitle')));
    var inp = el('input'); inp.type = 'text'; inp.maxLength = 60; inp.value = r.title || ''; s.appendChild(inp);
    s.appendChild(el('label', '', t('who')));
    var pc = el('div', 'chips'); [['public', t('pub')], ['friends', t('fr')]].forEach(function (o) { var b = el('button', 'chip' + (o[0] === priv ? ' on' : ''), o[1]); b.onclick = function () { priv = o[0]; Array.prototype.forEach.call(pc.children, function (x) { x.classList.remove('on'); }); b.classList.add('on'); }; pc.appendChild(b); }); s.appendChild(pc);
    s.appendChild(el('label', '', t('seatsN')));
    var sc = el('div', 'chips'); ((cfg && cfg.seatChoices) || [4, 8, 12]).forEach(function (n) { var b = el('button', 'chip' + (n === seatsN ? ' on' : ''), String(n)); b.onclick = function () { seatsN = n; Array.prototype.forEach.call(sc.children, function (x) { x.classList.remove('on'); }); b.classList.add('on'); }; sc.appendChild(b); }); s.appendChild(sc);
    var lab = el('label'); lab.style.cssText = 'display:flex;gap:8px;align-items:center'; var cb = el('input'); cb.type = 'checkbox'; cb.checked = free; lab.appendChild(cb); lab.appendChild(el('span', '', t('freeSeats'))); s.appendChild(lab);
    var go = el('button', 'big', t('save')); go.style.width = '100%'; go.style.marginTop = '14px';
    go.onclick = async function () { var x = await api('/api/party/rooms/' + roomId + '/settings', { title: inp.value.trim(), privacy: priv, seats: seatsN, free_seats: cb.checked }); closeSheet(); toast(x.success ? t('saved') : (x.error || t('net'))); poll(); };
    s.appendChild(go);
  });
}

// 🎁 gifts
async function giftSheet(toId) {
  if (!gifts) {
    var c = await api('/api/coins'); gifts = c.success ? c : null;
    var a = await api('/api/app-config'); if (a && a.config && Array.isArray(a.config.giftCounts) && a.config.giftCounts.length) giftCounts = a.config.giftCounts;
  } else { var c2 = await api('/api/coins'); if (c2.success) gifts.balance = c2.balance; }
  var seated = (st.people || []).filter(function (p) { return p.email !== meId; });
  var to = toId || ((seated.find(function (p) { return p.seat != null; }) || {}).email), pick = null, count = giftCounts[0];
  sheet(function (s) {
    s.appendChild(el('h3', '', t('giftTitle')));
    if (!gifts) { s.appendChild(el('div', 'muted', t('net'))); return; }
    var bal = el('div', 'muted', tf('myCoins', [gifts.balance || 0])); var buy = el('a', '', ' · ' + t('buy')); buy.href = 'coins.html'; buy.style.color = '#7c3aed'; buy.style.fontWeight = '800'; bal.appendChild(buy); s.appendChild(bal);
    if (!seated.length) { s.appendChild(el('div', 'empty', t('giftNone'))); return; }
    s.appendChild(el('label', '', t('giftTo')));
    var tc = el('div', 'chips'); seated.forEach(function (p) { var b = el('button', 'chip' + (p.email === to ? ' on' : ''), nm(p)); b.onclick = function () { to = p.email; Array.prototype.forEach.call(tc.children, function (x) { x.classList.remove('on'); }); b.classList.add('on'); }; tc.appendChild(b); }); s.appendChild(tc);
    s.appendChild(el('label', '', '🎁'));
    var gg = el('div', 'ggrid');
    (gifts.gifts || []).forEach(function (g) { var b = el('button', 'g'); b.appendChild(el('span', 'e', g.emoji)); b.appendChild(el('div', '', lang === 'en' ? g.name_en : g.name_km)); b.appendChild(el('div', 'muted', '🪙 ' + g.coins)); b.onclick = function () { pick = g; Array.prototype.forEach.call(gg.children, function (x) { x.classList.remove('on'); }); b.classList.add('on'); }; gg.appendChild(b); });
    s.appendChild(gg);
    var cc = el('div', 'chips'); cc.style.marginTop = '12px'; giftCounts.forEach(function (n) { var b = el('button', 'chip' + (n === count ? ' on' : ''), '×' + n); b.onclick = function () { count = n; Array.prototype.forEach.call(cc.children, function (x) { x.classList.remove('on'); }); b.classList.add('on'); }; cc.appendChild(b); }); s.appendChild(cc);
    var go = el('button', 'big', t('send')); go.style.width = '100%'; go.style.marginTop = '14px';
    go.onclick = async function () {
      if (!pick || !to) return;
      go.disabled = true;
      var r = await api('/api/party/rooms/' + roomId + '/gift', { to_email: to, gift_id: pick.id, count: count });
      go.disabled = false;
      if (!r.success) { toast(/coin/i.test(String(r.error || r.code || '')) ? t('noCoins') : (r.error || t('net'))); return; }
      closeSheet(); toast(t('giftSent')); poll();
    };
    s.appendChild(go);
  });
}
$('giftBtn').onclick = function () { giftSheet(null); };

// 🎵 the room's music: every browser plays the same song at the same point (the server's clock)
function music(s) {
  var m = s.room && s.room.music, a = $('music');
  $('musicBtn').style.display = m ? '' : 'none';
  $('musicBtn').textContent = musicOff ? '🔇' : '🎵';
  if (!m || musicOff) { try { a.pause(); } catch (e) {} if (!m) a.removeAttribute('src'); return; }
  if (a.dataset.url !== m.url) { a.dataset.url = m.url; a.src = m.url; }
  var dur = a.duration && isFinite(a.duration) ? a.duration : 0;
  var at = Date.parse(m.at), now = m.paused_at ? Date.parse(m.paused_at) : Date.now() + skew;
  var pos = Math.max(0, (now - at) / 1000); if (dur > 0) pos = pos % dur;
  if (dur > 0 && Math.abs(a.currentTime - pos) > 2.5) { try { a.currentTime = pos; } catch (e) {} }
  if (m.paused_at) { try { a.pause(); } catch (e) {} } else if (a.paused) { a.volume = 0.6; a.play().catch(function () {}); }
}
$('musicBtn').onclick = function () { musicOff = !musicOff; music(st); };

// 🎙️ the voice (LiveKit)
async function voice(live) {
  var LK = window.LivekitClient;
  if (!live || !live.url || !live.token) return;
  if (!LK) { toast(t('noVoice')); return; }
  try { if (lk) await lk.disconnect(); } catch (e) {}
  $('lkAudio').textContent = '';
  var room = new LK.Room({ adaptiveStream: true, dynacast: true });
  lk = room;
  room.on(LK.RoomEvent.TrackSubscribed, function (track) { if (track.kind === 'audio') { var a = track.attach(); $('lkAudio').appendChild(a); } });
  room.on(LK.RoomEvent.TrackUnsubscribed, function (track) { track.detach().forEach(function (x) { x.remove(); }); });
  room.on(LK.RoomEvent.ActiveSpeakersChanged, function (sp) { speaking = new Set(sp.map(function (p) { return p.identity; })); if (st) seats(st); });
  room.on(LK.RoomEvent.AudioPlaybackStatusChanged, function () { if (!room.canPlaybackAudio) askSound(room); });
  try {
    await room.connect(live.url, live.token);
    if (lk !== room) { room.disconnect(); return; }
    meId = room.localParticipant.identity || meId;
    try { await room.startAudio(); } catch (e) {}
    if (!room.canPlaybackAudio) askSound(room);
    micApply();
  } catch (e) { toast(t('noVoice')); }
}
function askSound(room) {
  sheet(function (s) { var b = el('button', 'big', t('tapSound')); b.style.width = '100%'; b.onclick = function () { room.startAudio().catch(function () {}); closeSheet(); }; s.appendChild(b); });
}
async function micApply() {
  if (!lk || !st || !st.me) return;
  var on = st.me.seat != null && !st.me.muted && !myMicOff;
  try { await lk.localParticipant.setMicrophoneEnabled(on, { echoCancellation: true, noiseSuppression: true, autoGainControl: true }); }
  catch (e) { if (on) { toast(t('micDenied')); myMicOff = true; controls(st); } }
}
async function refreshTicket() {
  var r = await api('/api/party/rooms/' + roomId + '/ticket');
  if (r.success && r.live) await voice(r.live);
}

texts();

loadList().then(function () { if (q && /^\d+$/.test(q)) join(parseInt(q, 10)); });
})();
