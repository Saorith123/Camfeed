<!DOCTYPE html>
<html lang="km">
<head>
    <script src="auth-client.js"></script>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#1877f2">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamFeed</title>
    <link rel="icon" type="image/png" href="logo-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@300;400;700;900&family=Noto+Color+Emoji&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, input, button, select, textarea { font-family: 'Battambang', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, 'Noto Color Emoji', sans-serif; }
        body { background: #f0f2f5; color: #050505; min-height: 100vh; padding-bottom: 60px; }
        .top-nav { background: #fff; height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); position: sticky; top: 0; z-index: 50; }
        .back-btn { background: #f0f2f5; border: none; width: 38px; height: 38px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .nav-title { font-size: 17px; font-weight: 800; color: #1877f2; }
        .container { max-width: 640px; margin: 16px auto; padding: 0 12px; display: flex; flex-direction: column; gap: 14px; }
        .card { background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        .card h2 { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
        .muted { color: #4b5563; font-size: 13.5px; line-height: 1.6; }
        label { display: block; font-size: 13px; font-weight: 700; color: #374151; margin: 12px 0 4px; }
        input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 14px; background: #f8f9fa; outline: none; color: #111827; }
        input:focus, select:focus, textarea:focus { border-color: #1877f2; background: #fff; }
        .btn { background: #1877f2; color: #fff; border: none; padding: 12px 20px; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 14px; }
        .btn:disabled { opacity: .55; cursor: default; }
        .opt { display: flex; gap: 10px; align-items: flex-start; width: 100%; border: 2px solid #e4e6eb; border-radius: 12px; padding: 11px 12px; margin-top: 8px; background: #fff; cursor: pointer; text-align: left; color: #111827; font: inherit; }
        .opt.on { border-color: #1877f2; background: #e7f3ff; }
        .opt .ic { font-size: 22px; line-height: 1; } .opt b { display: block; font-size: 14.5px; } .opt span { font-size: 12.5px; color: #4b5563; line-height: 1.5; }
        .chk { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; padding: 7px 0; border-bottom: 1px solid #f0f2f5; line-height: 1.5; }
        .chk:last-child { border-bottom: 0; }
        .msg { margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: 13.5px; display: none; line-height: 1.6; }
        .msg.ok { display: block; background: #e6f6ec; color: #176f35; } .msg.bad { display: block; background: #fdecec; color: #b42318; }
        .status { display: flex; gap: 12px; align-items: center; }
        .status .big { font-size: 36px; }
        .code { display: inline-block; font-size: 22px; font-weight: 800; letter-spacing: 1px; background: #fff; border: 2px solid #1877f2; color: #1877f2; border-radius: 10px; padding: 2px 12px; margin: 6px 0; }
        .steps { margin: 6px 0 0 18px; font-size: 13.5px; line-height: 1.7; color: #374151; }
        .pf { border: 1px solid #e4e6eb; border-radius: 12px; padding: 12px; margin-top: 10px; }
        .pf b.t { font-size: 14.5px; } .pf .st { font-size: 13px; margin-top: 4px; }
        .note { background: #fff8e6; color: #7a4b00; border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.6; margin-top: 8px; white-space: pre-wrap; }
        .btn2 { background: #fff; color: #1877f2; border: 2px solid #1877f2; }
        .shots { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .shot { flex: 1; min-width: 130px; border: 2px dashed #cbd5e1; border-radius: 12px; padding: 10px; text-align: center; font-size: 13px; color: #374151; background: #f8fafc; cursor: pointer; font: inherit; }
        .shot img { width: 100%; max-height: 150px; object-fit: cover; border-radius: 8px; display: block; margin-bottom: 6px; }
        .shot.done { border-style: solid; border-color: #16a34a; }
        #cam { position: fixed; inset: 0; background: #000; z-index: 9000; display: none; flex-direction: column; }
        #cam video { flex: 1; width: 100%; object-fit: contain; background: #000; }
        #cam .bar { display: flex; gap: 10px; padding: 14px; justify-content: center; align-items: center; background: #000; }
        #cam .snap { width: 70px; height: 70px; border-radius: 50%; border: 5px solid #fff; background: #1877f2; cursor: pointer; }
        #cam .x { background: #333; color: #fff; border: none; border-radius: 12px; padding: 12px 16px; font: inherit; font-weight: 700; cursor: pointer; }
        #cam .hint { color: #fff; text-align: center; padding: 10px 14px; font-size: 14px; line-height: 1.5; }
    </style>
</head>
<body>
    <style>body.in-app .top-nav{display:none}</style><script>try{if(/CamFeedApp/.test(navigator.userAgent))document.addEventListener("DOMContentLoaded",function(){document.body.classList.add("in-app")});}catch(e){}</script>
    <div class="top-nav"><button class="back-btn" onclick="history.length > 1 ? history.back() : (location.href='feed.html')">←</button><div class="nav-title" id="navTitle"></div></div>
    <div class="container" id="root"></div>
<script>
(function () {
    const currentUser = JSON.parse(localStorage.getItem('camfeed_user') || 'null');
    if (!currentUser) { location.href = 'index.html'; return; }
    const LANG = localStorage.getItem('camfeed_lang') === 'en' ? 'en' : 'km';
    const T = (km, en) => (LANG === 'en' ? en : km);
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const num = (n) => Number(n || 0).toLocaleString('en-US');
    const msg = (id, ok, t) => { const m = $(id); if (!m) return; m.className = 'msg ' + (ok ? 'ok' : 'bad'); m.textContent = t; };
    const alertMsg = (id, t) => setTimeout(() => msg(id, false, t), 50);
    const api = async (url, body) => { const r = await fetch(url, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {}); return r.json().catch(() => ({ success: false })); };
    $('navTitle').textContent = T('✔ គណនីផ្លូវការ', '✔ Official account');

    const CATS = { shop: ['ហាង', 'Shop'], company: ['ក្រុមហ៊ុន', 'Company'], media: ['សារព័ត៌មាន', 'Media'], organization: ['អង្គការ', 'Organisation'], government: ['ស្ថាប័នរដ្ឋ', 'Government'],
        public_figure: ['បុគ្គលល្បី', 'Public figure'], artist: ['សិល្បករ', 'Artist'], creator: ['អ្នកបង្កើតមាតិកា', 'Content creator'], education: ['ការអប់រំ', 'Education'], health: ['សុខភាព', 'Health'], food: ['ម្ហូបអាហារ', 'Food'], other: ['ផ្សេងៗ', 'Other'] };
    const PATHS = [
        { id: 'business', ic: '🏪', t: T('ហាង ឬក្រុមហ៊ុន', 'Shop or company'), d: T('បញ្ជាក់ដោយលេខចុះបញ្ជីពាណិជ្ជកម្ម (CamFeed ពិនិត្យលើគេហទំព័រក្រសួងពាណិជ្ជកម្ម)', 'Proven by the business registration number (CamFeed checks it on the Ministry of Commerce website)') },
        { id: 'official', ic: '🏛️', t: T('បុគ្គល ឬស្ថាប័នល្បី', 'Well-known person or organisation'), d: T('ដាក់លេខកូដ CamFeed លើផេក ឬ Telegram ផ្លូវការរបស់អ្នក', 'Put the CamFeed code on your official page or Telegram channel') },
        { id: 'creator', ic: '🎬', t: T('អ្នកបង្កើតមាតិកាធំ', 'Big content creator'), d: T('មានអ្នកតាមដានច្រើននៅ CamFeed ឬមានឆានែលធំនៅ YouTube, TikTok, Facebook (ដាក់លេខកូដ CamFeed នៅទីនោះ)', 'Many followers on CamFeed, or a big YouTube, TikTok or Facebook channel (put the CamFeed code there)') },
    ];
    const CHECK = {
        days: (c) => T('ប្រើ CamFeed យ៉ាងតិច ' + c.need + ' ថ្ងៃ (អ្នក៖ ' + num(c.have) + ' ថ្ងៃ)', 'Used CamFeed for at least ' + c.need + ' days (you: ' + num(c.have) + ')'),
        clean: () => T('មិនដែលបំពានច្បាប់ CamFeed', 'Never broke the CamFeed rules'),
        phone: () => T('បានផ្ទៀងផ្ទាត់លេខទូរស័ព្ទ', 'Phone number confirmed'),
        pic: () => T('មានរូបប្រូហ្វាល និងឈ្មោះពិត', 'Has a profile picture and a real name'),
        posts: (c) => T('បង្ហោះយ៉ាងតិច ' + c.need + ' ដងក្នុង 30 ថ្ងៃចុងក្រោយ (អ្នក៖ ' + num(c.have) + ')', 'At least ' + c.need + ' posts in the last 30 days (you: ' + num(c.have) + ')'),
        followers: (c) => T('អ្នកតាមដានយ៉ាងតិច ' + num(c.need) + ' នាក់ (អ្នក៖ ' + num(c.have) + ')' + (c.soft ? ' — មិនចាំបាច់ បើបញ្ជាក់តាមផ្លូវផ្សេង' : ''), 'At least ' + num(c.need) + ' followers (you: ' + num(c.have) + ')' + (c.soft ? ' — not needed when proven another way' : '')),
        rename: (c) => T('មិនបានប្ដូរឈ្មោះក្នុង ' + c.need + ' ថ្ងៃចុងក្រោយ', 'No name change in the last ' + c.need + ' days'),
        tick: () => T('មានសញ្ញា ✔ រួចហើយ', 'Already has the ✔'),
        idproof: () => T('បញ្ជាក់អត្តសញ្ញាណ (ID + Selfie) ឬបង់ថ្លៃប្រចាំខែ — មើលខាងក្រោម', 'ID + selfie confirmed, or the monthly fee paid — see below'),
        bank: () => T('បញ្ជាក់ឈ្មោះតាមគណនីធនាគារ — មើលខាងក្រោម', 'Bank account name confirmed — see below'),
    };
    const PST = { pending: () => '⏳ ' + T('CamFeed កំពុងពិនិត្យ', 'CamFeed is checking'), approved: (p) => '✅ ' + T('បានបញ្ជាក់', 'Confirmed') + (p.expires_at ? ' · ' + T('ដល់ថ្ងៃ ', 'until ') + String(p.expires_at).slice(0, 10) : ''),
        rejected: (p) => '❌ ' + T('មិនត្រូវ', 'Not accepted') + (p.note ? ' — ' + p.note : '') + ' · ' + T('សូមសាកម្ដងទៀត', 'please try again') };
    const st = { path: '', type: 'personal', cat: '', d: null, code: '', shots: { id: '', selfie: '' }, way: { pay: '', bank: '' }, rc: { pay: '', bank: '' } };

    // ---------- 📸 the camera (no picking a picture from the phone): ID with the back camera, selfie with the front one ----------
    let camStream = null;
    function camClose() { try { camStream && camStream.getTracks().forEach(t => t.stop()); } catch (e) {} camStream = null; const c = $('cam'); if (c) c.remove(); }
    async function upload(blob, name) {
        const u = await (await fetch('/api/videos/upload-url', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_email: currentUser.email, file_name: name, content_type: 'image/jpeg' }) })).json();
        if (!u.uploadUrl) throw new Error('x');
        const put = await fetch(u.uploadUrl, { method: 'PUT', headers: { 'Content-Type': 'image/jpeg' }, body: blob });
        if (!put.ok) throw new Error('x');
        return u.publicUrl;
    }
    function camOpen(which, done) {
        const front = which === 'selfie';
        const hint = front ? T('ដាក់មុខរបស់អ្នកឲ្យនៅកណ្ដាល ហើយចុចប៊ូតុងខៀវ', 'Put your face in the middle and press the blue button')
            : T('ដាក់អត្តសញ្ញាណប័ណ្ណឲ្យឃើញរូប និងឈ្មោះច្បាស់ ហើយចុចប៊ូតុងខៀវ', 'Show the photo and the name on the ID card clearly and press the blue button');
        if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
            // an old phone without live camera on the web: the phone's own camera opens (capture), still not the gallery
            const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.setAttribute('capture', front ? 'user' : 'environment');
            inp.onchange = () => { const f = inp.files && inp.files[0]; if (f) done(f); }; inp.click(); return;
        }
        const box = document.createElement('div'); box.id = 'cam'; box.style.display = 'flex';
        box.innerHTML = `<div class="hint"></div><video playsinline autoplay muted></video><div class="bar"><button class="x" type="button" data-x>✖ ${T('បិទ', 'Close')}</button><button class="snap" type="button" aria-label="📸"></button></div>`;
        box.querySelector('.hint').textContent = hint;
        document.body.appendChild(box);
        const v = box.querySelector('video');
        if (front) v.style.transform = 'scaleX(-1)';
        box.querySelector('[data-x]').onclick = camClose;
        navigator.mediaDevices.getUserMedia({ video: { facingMode: front ? 'user' : { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false })
            .then(s => { camStream = s; v.srcObject = s; })
            .catch(() => { box.querySelector('.hint').textContent = T('មិនអាចបើកកាមេរ៉ាបានទេ។ សូមអនុញ្ញាតឲ្យ CamFeed ប្រើកាមេរ៉ា (ការកំណត់របស់ទូរស័ព្ទ) ហើយសាកម្ដងទៀត។', 'Could not open the camera. Please allow CamFeed to use the camera (phone settings) and try again.'); });
        box.querySelector('.snap').onclick = () => {
            if (!v.videoWidth) return;
            const k = Math.min(1, 1280 / Math.max(v.videoWidth, v.videoHeight));
            const c = document.createElement('canvas'); c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
            c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
            c.toBlob(b => { camClose(); if (b) done(b); }, 'image/jpeg', 0.85);
        };
    }

    function proofCard(d) {
        const pc = d.proofCfg; if (!pc) return '';
        const P = {}; (d.proofs || []).forEach(p => { P[p.kind] = p; });
        const stat = (k) => P[k] ? `<div class="st">${esc(PST[P[k].status] ? PST[P[k].status](P[k]) : P[k].status)}</div>` : '';
        const can = (k) => !P[k] || P[k].status === 'rejected' || (k === 'pay' && P[k].status === 'approved' && P[k].expires_at && new Date(P[k].expires_at) - Date.now() < 5 * 86400000);
        const ways = (k) => {
            const w = [];
            if (pc.qr) w.push(['qr', '📷 ' + T('ស្កេន QR', 'Scan the QR')]);
            if (pc.link) w.push(['link', '📱 ' + T('បើកកម្មវិធី ABA', 'Open the ABA app')]);
            if (!w.length) return `<div class="note">${T('ការបង់តាម ABA មិនទាន់បើកទេ។ សូមរង់ចាំបន្តិច។', 'Paying by ABA is not open yet. Please wait a little.')}</div>`;
            const cur = st.way[k] || (w.length === 1 ? w[0][0] : '');
            return `<div style="display:flex;gap:8px;margin-top:8px;">${w.map(x => `<button type="button" class="opt ${cur === x[0] ? 'on' : ''}" data-way="${k}:${x[0]}" style="justify-content:center;margin:0;"><b>${x[1]}</b></button>`).join('')}</div>
                ${cur === 'qr' ? `<img src="${esc(pc.qr)}" alt="KHQR" style="width:100%;max-width:240px;margin:10px auto 0;display:block;border-radius:12px;">` : ''}
                ${cur === 'link' ? `<a class="btn" href="${esc(pc.link)}" target="_blank" rel="noopener noreferrer" style="display:block;text-align:center;text-decoration:none;">📱 ${T('បើក ABA', 'Open ABA')}</a>` : ''}
                ${cur ? `<label>${T('រូបវិក្កយបត្រ (Screenshot ពី ABA)', 'Picture of the receipt (screenshot from ABA)')}</label><input type="file" accept="image/*" data-rc="${k}"><div class="muted" id="rcMsg_${k}">${st.rc[k] ? '✅ ' + T('អាប់ឡូតរួចរាល់', 'Uploaded') : ''}</div>
                <button class="btn" type="button" data-send="${k}">${T('ផ្ញើ', 'Send')}</button><div class="msg" id="pfMsg_${k}"></div>` : ''}`;
        };
        let h = `<div class="card"><h2>🪪 ${T('ការបញ្ជាក់', 'Proof')}</h2>`;
        if (d.proofOn && d.proofOn.idproof) {
            const idNote = T(pc.id_note_km, pc.id_note_en) || '';
            h += `<div class="pf"><b class="t">🪪 ${T('អត្តសញ្ញាណប័ណ្ណ + Selfie', 'ID card + selfie')}</b>${stat('id')}
                ${can('id') ? `<div class="muted" style="margin-top:4px;">${T('ថតដោយកាមេរ៉ាផ្ទាល់ (មិនអាចជ្រើសរូបពីទូរស័ព្ទ)។ មានតែ CamFeed ប៉ុណ្ណោះដែលមើលឃើញ ហើយរូបនឹងត្រូវលុបចោល ក្រោយពិនិត្យរួច។', 'Taken with the camera (no picking a picture from the phone). Only CamFeed sees them, and they are deleted after the check.')}</div>
                ${idNote ? `<div class="note">ℹ️ ${esc(idNote)}</div>` : ''}
                <div class="shots"><button type="button" class="shot ${st.shots.id ? 'done' : ''}" data-shot="id">${st.shots.id ? `<img src="${esc(st.shots.id)}" alt="">` : '<div style="font-size:30px">🪪</div>'}${T('ថតអត្តសញ្ញាណប័ណ្ណ', 'Take the ID card')}</button>
                <button type="button" class="shot ${st.shots.selfie ? 'done' : ''}" data-shot="selfie">${st.shots.selfie ? `<img src="${esc(st.shots.selfie)}" alt="">` : '<div style="font-size:30px">🤳</div>'}${T('ថត Selfie', 'Take a selfie')}</button></div>
                <button class="btn" type="button" id="sendId" ${st.shots.id && st.shots.selfie ? '' : 'disabled'}>${T('ផ្ញើទៅ CamFeed', 'Send to CamFeed')}</button><div class="msg" id="pfMsg_id"></div>` : ''}</div>`;
            h += `<div class="pf"><b class="t">💳 ${T('ឬ បង់ថ្លៃសេវាប្រចាំខែ', 'Or pay the monthly fee')} · $${(pc.monthCents / 100).toFixed(2)}</b>${stat('pay')}
                ${can('pay') ? `<div class="muted" style="margin-top:4px;">${T('ជំនួសឲ្យ ID + Selfie។ មានសុពលភាព 30 ថ្ងៃ។ ការបង់ពីគណនីធនាគារឈ្មោះរបស់អ្នក ក៏បញ្ជាក់ឈ្មោះធនាគារដែរ។', 'Instead of the ID + selfie. Good for 30 days. Paying from a bank account in your name also confirms the bank name.')}</div>${ways('pay')}` : ''}</div>`;
        }
        if (d.proofOn && d.proofOn.bank) {
            h += `<div class="pf"><b class="t">🏦 ${T('បញ្ជាក់ឈ្មោះតាមគណនីធនាគារ', 'Confirm the name with your bank account')}</b>${stat('bank')}
                ${can('bank') ? `<div class="muted" style="margin-top:4px;">${T('ផ្ទេរ $' + (pc.bankCents / 100).toFixed(2) + ' (' + pc.bankCents + ' សេន) ពីគណនីធនាគារឈ្មោះរបស់អ្នក។ ឈ្មោះលើវិក្កយបត្រ ត្រូវដូចឈ្មោះរបស់អ្នកក្នុង CamFeed។', 'Send $' + (pc.bankCents / 100).toFixed(2) + ' (' + pc.bankCents + ' cents) from a bank account in your name. The name on the receipt must be the same as your CamFeed name.')}</div>
                <div class="note">ℹ️ ${esc(T(pc.note_km, pc.note_en))}</div>${ways('bank')}` : ''}</div>`;
        }
        return h + `</div>`;
    }

    function nameCard(d) {
        if (d.accountType === 'business' || !d.nameChecks) return '';
        const q = d.nameRequest;
        const sts = q ? (q.status === 'pending' ? '⏳ ' + T('CamFeed កំពុងពិនិត្យសំណើឈ្មោះ «', 'CamFeed is checking the name "') + esc(q.name) + T('»', '"')
            : q.status === 'approved' ? '✅ ' + T('ឈ្មោះ «', 'The name "') + esc(q.name) + T('» បានអនុម័ត', '" was approved')
            : '❌ ' + T('ឈ្មោះ «', 'The name "') + esc(q.name) + T('» មិនទាន់អនុម័ត', '" was not approved') + (q.note ? ' — ' + esc(q.note) : '')) : '';
        const list = d.nameChecks.map(c => `<div class="chk"><span>${c.ok ? '✅' : '❌'}</span><span>${esc((CHECK[c.k] || (() => c.k))(c))}</span></div>`).join('');
        return `<div class="card"><h2>🏷️ ${T('ឈ្មោះមួយពាក្យ (គណនីផ្ទាល់ខ្លួន)', 'One-word name (personal account)')}</h2>
            <div class="muted">${T('គណនីផ្ទាល់ខ្លួន អាចស្នើប្រើឈ្មោះតែមួយពាក្យបាន ពេលលក្ខខណ្ឌខាងក្រោមគ្រប់។ CamFeed ពិនិត្យ ហើយអនុម័ត។', 'A personal account can ask for a one-word name when the conditions below are met. CamFeed checks and approves it.')}</div>
            ${sts ? `<div class="pf">${sts}</div>` : ''}
            <div style="margin-top:8px;">${list || `<div class="muted">${T('គ្មានលក្ខខណ្ឌ', 'No conditions')}</div>`}</div>
            ${d.nameCanAsk && !(q && q.status === 'pending') ? `<a class="btn" href="settings.html" style="display:block;text-align:center;text-decoration:none;">${T('ស្នើឈ្មោះ៖ ការកំណត់ › ប្ដូរឈ្មោះ (វាយតែនាមខ្លួន)', 'Ask: Settings › Change name (type only the first name)')}</a>` : ''}</div>`;
    }

    function draw() {
        const d = st.d, r = d.request;
        let status;
        if (d.verified && !d.paused) status = `<div class="status"><div class="big">✔</div><div><b>${T('គណនីរបស់អ្នក ជាគណនីផ្លូវការ', 'Your account is an official account')}</b><div class="muted">${T('សញ្ញា ✔ បង្ហាញក្បែរឈ្មោះរបស់អ្នក។ ប្ដូរឈ្មោះ = ✔ ផ្អាកសិន រហូតដល់ CamFeed ពិនិត្យម្ដងទៀត។', 'The ✔ shows next to your name. Changing the name pauses it until CamFeed checks again.')}</div></div></div>`;
        else if (d.verified && d.paused) status = `<div class="status"><div class="big">⏸️</div><div><b>${T('សញ្ញា ✔ កំពុងផ្អាក', 'Your ✔ is paused')}</b><div class="muted">${T('ព្រោះអ្នកបានប្ដូរឈ្មោះ ឬដល់ពេលពិនិត្យប្រចាំឆ្នាំ។ CamFeed នឹងពិនិត្យ ឬអ្នកអាចដាក់ពាក្យម្ដងទៀតខាងក្រោម។', 'Because the name changed or it is time for the yearly check. CamFeed will check, or you can ask again below.')}</div></div></div>`;
        else if (r && r.status === 'pending') status = `<div class="status"><div class="big">⏳</div><div><b>${T('CamFeed កំពុងពិនិត្យពាក្យសុំរបស់អ្នក', 'CamFeed is checking your request')}</b><div class="muted">${T('លេខកូដរបស់អ្នក៖', 'Your code:')} <span class="code">${esc(r.code)}</span><br>${T('សូមទុកលេខកូដនេះនៅលើផេក ឬឆានែលរបស់អ្នក រហូតដល់ទទួលចម្លើយ។', 'Keep this code on your page or channel until you get the answer.')}</div></div></div>`;
        else if (r && r.status === 'rejected') status = `<div class="status"><div class="big">✖</div><div><b>${T('ពាក្យសុំលើកមុន មិនទាន់ទទួលបាន', 'The last request was not accepted')}</b><div class="muted">${esc(r.admin_note || '')} ${T('អ្នកអាចដាក់ពាក្យម្ដងទៀតក្រោយ 30 ថ្ងៃ។', 'You can ask again after 30 days.')}</div></div></div>`;
        else status = `<div class="muted">${T('សញ្ញា ✔ បង្ហាញថា គណនីនេះជាគណនីផ្លូវការ មិនមែនក្លែងបន្លំ។ CamFeed ផ្ដល់ឲ្យតែគណនីដែលមានលក្ខខណ្ឌគ្រប់ និងបញ្ជាក់បានថាជាម្ចាស់ពិតប្រាកដ។ ✔ មិនលក់ទេ។', 'The ✔ shows the account is the official one, not a fake. CamFeed gives it only to accounts that meet every condition and prove who they are. It is never sold.')}</div>`;

        const canAsk = (!d.verified || d.paused) && !(r && r.status === 'pending');
        const checks = d.checks.map(c => `<div class="chk"><span>${c.ok ? '✅' : (c.soft ? '➖' : '❌')}</span><span>${esc((CHECK[c.k] || (() => c.k))(c))}</span></div>`).join('');
        const pathBox = !st.path ? '' : st.path === 'business'
            ? `<label>${T('លេខចុះបញ្ជីពាណិជ្ជកម្ម', 'Business registration number')}</label><input id="fReg" maxlength="60">
               <label>${T('តំណភ្ជាប់គេហទំព័រ ឬផេករបស់ហាង (មិនបង្ខំ)', 'Link of the shop website or page (optional)')}</label><input id="fLink" placeholder="https://">`
            : `<div class="muted" style="margin-top:10px;">${T('ជំហាន៖', 'Steps:')}<ol class="steps"><li>${T('ចម្លងលេខកូដនេះ៖', 'Copy this code:')} <span class="code">${esc(st.code)}</span></li>
               <li>${T('ដាក់វានៅលើផេក ឬឆានែលផ្លូវការរបស់អ្នក (ក្នុងការបង្ហោះមួយ ឬផ្នែកណែនាំខ្លួន)', 'Put it on your official page or channel (in a post or in the about part)')}</li>
               <li>${T('ដាក់តំណភ្ជាប់ផេកនោះខាងក្រោម ហើយផ្ញើ។ CamFeed ពិនិត្យរួច អ្នកអាចលុបលេខកូដវិញ។', 'Put the link of that page below and send. After CamFeed checks, you can remove the code.')}</li></ol></div>
               <label>${st.path === 'creator' ? T('តំណភ្ជាប់ឆានែល YouTube, TikTok ឬ Facebook (មិនបង្ខំ បើមានអ្នកតាមដានគ្រប់នៅ CamFeed)', 'Link of the YouTube, TikTok or Facebook channel (optional when you have enough followers on CamFeed)') : T('តំណភ្ជាប់ផេក ឬ Telegram ផ្លូវការ', 'Link of the official page or Telegram channel')}</label><input id="fLink" placeholder="https://">
               <label>${T('តំណភ្ជាប់អត្ថបទព័ត៌មានអំពីអ្នក (មិនបង្ខំ)', 'A news article about you (optional)')}</label><input id="fLink2" placeholder="https://">`;

        $('root').innerHTML = `
            <div class="card"><h2>${T('ប្រភេទគណនី', 'Account type')}</h2>
                <button type="button" class="opt ${st.type === 'personal' ? 'on' : ''}" data-type="personal"><span class="ic">👤</span><div><b>${T('ផ្ទាល់ខ្លួន', 'Personal')}</b><span>${T('ឈ្មោះត្រូវមាននាមខ្លួន និងនាមត្រកូល', 'The name has a first and a last name')}</span></div></button>
                <button type="button" class="opt ${st.type === 'business' ? 'on' : ''}" data-type="business"><span class="ic">🏪</span><div><b>${T('អាជីវកម្ម ស្ថាប័ន ឬបុគ្គលល្បី', 'Business, organisation or public figure')}</b><span>${T('ឈ្មោះមួយពាក្យបាន (ឧ. ឈ្មោះហាង) និងបង្ហាញប្រភេទក្រោមឈ្មោះ', 'A one-word name is allowed (e.g. the shop name) and the kind shows under the name')}</span></div></button>
                <div id="catBox" style="display:${st.type === 'business' ? '' : 'none'}"><label>${T('ប្រភេទ', 'Kind')}</label><select id="fCat"><option value="">—</option>${Object.entries(CATS).map(([k, v]) => `<option value="${k}" ${st.cat === k ? 'selected' : ''}>${esc(T(v[0], v[1]))}</option>`).join('')}</select></div>
                <button class="btn" id="saveType" type="button">${T('រក្សាទុក', 'Save')}</button><div class="msg" id="typeMsg"></div>
            </div>
            ${d.invite ? `<div class="card" style="border:2px solid #1877f2;"><h2>✔ ${T('CamFeed អញ្ជើញអ្នក', 'CamFeed invites you')}</h2>
                <div class="muted">${T('CamFeed អញ្ជើញគណនីរបស់អ្នកឲ្យមានសញ្ញា ✔ គណនីផ្លូវការ។ ចុច «ទទួល» ហើយសញ្ញា ✔ នឹងបង្ហាញក្បែរឈ្មោះរបស់អ្នកភ្លាម។', 'CamFeed invites your account to get the ✔ official mark. Press "Accept" and the ✔ shows next to your name at once.')}</div>
                <button class="btn" type="button" id="invYes">✔ ${T('ទទួល', 'Accept')}</button>
                <button class="btn btn2" type="button" id="invNo">${T('មិនទទួល', 'No, thanks')}</button><div class="msg" id="invMsg"></div></div>` : ''}
            <div class="card"><h2>✔ ${T('គណនីផ្លូវការ', 'Official account')}</h2>${status}</div>
            ${canAsk ? `<div class="card"><h2>${T('លក្ខខណ្ឌ', 'Conditions')}</h2>${checks}
                ${d.canApply ? '' : `<div class="msg bad" style="display:block;">${T('លក្ខខណ្ឌខ្លះមិនទាន់គ្រប់។ សូមព្យាយាមម្ដងទៀតពេលគ្រប់។', 'Some conditions are not met yet. Please try again when they are.')}</div>`}</div>
            ${d.canApply ? `<div class="card"><h2>${T('បញ្ជាក់ថាជាអ្នកពិតប្រាកដ', 'Prove it is really you')}</h2>
                <div class="muted">${d.proofOn && d.proofOn.idproof ? T('ជ្រើសផ្លូវមួយ៖', 'Choose one way:') : T('CamFeed មិនសុំអត្តសញ្ញាណប័ណ្ណទេ។ ជ្រើសផ្លូវមួយ៖', 'CamFeed never asks for an ID card. Choose one way:')}</div>
                ${PATHS.map(p => `<button type="button" class="opt ${st.path === p.id ? 'on' : ''}" data-path="${p.id}"><span class="ic">${p.ic}</span><div><b>${esc(p.t)}</b><span>${esc(p.d)}</span></div></button>`).join('')}
                ${pathBox}
                ${st.path ? `<label>${T('ពាក្យបន្ថែម (មិនបង្ខំ)', 'Anything to add (optional)')}</label><textarea id="fNote" rows="3" maxlength="600"></textarea>
                <button class="btn" id="send" type="button">${T('ផ្ញើពាក្យសុំ', 'Send the request')}</button>` : ''}<div class="msg" id="sendMsg"></div></div>` : ''}` : ''}
            ${proofCard(d)}
            ${nameCard(d)}`;

        // ✔ an invitation from CamFeed
        const inv = async (yes) => {
            ['invYes', 'invNo'].forEach(id => { if ($(id)) $(id).disabled = true; });
            const x = await api('/api/verify/invite-reply', { accept: yes });
            if (x.success) { await load(); window.scrollTo(0, 0); return; }
            msg('invMsg', false, T('មិនបានសម្រេច។ សូមសាកម្ដងទៀត។', 'Could not save. Please try again.'));
            ['invYes', 'invNo'].forEach(id => { if ($(id)) $(id).disabled = false; });
        };
        $('invYes') && $('invYes').addEventListener('click', () => inv(true));
        $('invNo') && $('invNo').addEventListener('click', () => { if (confirm(T('មិនទទួលការអញ្ជើញ ✔ មែនទេ?', 'Say no to the ✔ invitation?'))) inv(false); });
        // 📸 ID + selfie with the camera
        document.querySelectorAll('[data-shot]').forEach(b => b.addEventListener('click', () => {
            const k = b.dataset.shot;
            camOpen(k, async (blob) => {
                b.innerHTML = '⏳ ' + T('កំពុងអាប់ឡូត…', 'Uploading…');
                try { st.shots[k] = await upload(blob, k + '.jpg'); } catch (e) { st.shots[k] = ''; alertMsg('pfMsg_id', T('អាប់ឡូតមិនបាន។ សូមសាកម្ដងទៀត។', 'Upload failed. Please try again.')); }
                draw();
            });
        }));
        $('sendId') && $('sendId').addEventListener('click', async () => {
            const btn = $('sendId'); btn.disabled = true;
            const x = await api('/api/verify/proof', { kind: 'id', id_url: st.shots.id, selfie_url: st.shots.selfie });
            if (x.success) { st.shots = { id: '', selfie: '' }; await load(); return; }
            msg('pfMsg_id', false, x.code === 'open' ? T('កំពុងត្រូវបានពិនិត្យរួចហើយ។', 'Already being checked.') : T('ផ្ញើមិនបាន។ សូមថតទាំងពីរម្ដងទៀត។', 'Could not send. Please take both photos again.'));
            btn.disabled = false;
        });
        // 💳 🏦 pay / small transfer: 📷 QR or 📱 ABA link, then the receipt
        document.querySelectorAll('[data-way]').forEach(b => b.addEventListener('click', () => { const [k, w] = b.dataset.way.split(':'); st.way[k] = w; draw(); }));
        document.querySelectorAll('[data-rc]').forEach(inp => inp.addEventListener('change', async () => {
            const k = inp.dataset.rc, f = inp.files && inp.files[0]; st.rc[k] = ''; if (!f) return;
            const m = $('rcMsg_' + k);
            if (!/^image\//.test(f.type || '')) { m.textContent = '❌ ' + T('សូមដាក់រូបភាព', 'Please choose a picture'); return; }
            m.textContent = T('កំពុងអាប់ឡូត…', 'Uploading…');
            try { st.rc[k] = await upload(f, 'receipt.jpg'); m.textContent = '✅ ' + T('អាប់ឡូតរួចរាល់', 'Uploaded'); } catch (e) { m.textContent = '❌ ' + T('អាប់ឡូតមិនបាន។ សូមសាកម្ដងទៀត។', 'Upload failed. Please try again.'); }
        }));
        document.querySelectorAll('[data-send]').forEach(b => b.addEventListener('click', async () => {
            const k = b.dataset.send;
            if (!st.rc[k]) { msg('pfMsg_' + k, false, T('សូមដាក់រូបវិក្កយបត្រជាមុនសិន។', 'Please add the picture of the receipt first.')); return; }
            b.disabled = true;
            const x = await api('/api/verify/proof', { kind: k, receipt: st.rc[k] });
            if (x.success) { st.rc[k] = ''; await load(); return; }
            msg('pfMsg_' + k, false, x.code === 'open' ? T('កំពុងត្រូវបានពិនិត្យរួចហើយ។', 'Already being checked.') : T('ផ្ញើមិនបាន។', 'Could not send.'));
            b.disabled = false;
        }));

        document.querySelectorAll('[data-type]').forEach(b => b.addEventListener('click', () => { st.type = b.dataset.type; draw(); }));
        document.querySelectorAll('[data-path]').forEach(b => b.addEventListener('click', async () => {
            st.path = b.dataset.path;
            if (st.path !== 'business' && !st.code) { const c = await api('/api/verify/code', {}); st.code = c.code || ''; }
            draw();
        }));
        $('fCat') && $('fCat').addEventListener('change', (e) => { st.cat = e.target.value; });
        $('saveType').addEventListener('click', async () => {
            if (st.type === 'business' && !st.cat) { msg('typeMsg', false, T('សូមជ្រើសប្រភេទ។', 'Please choose the kind.')); return; }
            const x = await api('/api/account/type', { type: st.type, category: st.cat });
            if (x.success) msg('typeMsg', true, T('✅ បានរក្សាទុក។', '✅ Saved.') + (st.type === 'business' ? ' ' + T('ឥឡូវអ្នកអាចប្ដូរឈ្មោះជាមួយពាក្យបាន (ការកំណត់ › ប្ដូរឈ្មោះ)។', 'You can now use a one-word name (Settings › Change name).') : ''));
            else msg('typeMsg', false, x.code === 'need_last' ? T('គណនីផ្ទាល់ខ្លួនត្រូវមាននាមខ្លួន និងនាមត្រកូល។ សូមប្ដូរឈ្មោះជាមុនសិន។', 'A personal account needs a first and a last name. Please change the name first.') : T('រក្សាទុកមិនបាន', 'Could not save'));
        });
        $('send') && $('send').addEventListener('click', async () => {
            const btn = $('send'); btn.disabled = true;
            const x = await api('/api/verify/request', { path: st.path, reg_no: ($('fReg') || {}).value || '', link: ($('fLink') || {}).value || '', link2: ($('fLink2') || {}).value || '', note: ($('fNote') || {}).value || '' });
            if (x.success) { await load(); window.scrollTo(0, 0); return; }
            const KM = { 'Please write the business registration number.': 'សូមសរសេរលេខចុះបញ្ជីពាណិជ្ជកម្ម។', 'Please add the link of your official page or channel.': 'សូមដាក់តំណភ្ជាប់ផេក ឬឆានែលផ្លូវការ។',
                'Please add the link of your big channel (YouTube, TikTok or Facebook).': 'សូមដាក់តំណភ្ជាប់ឆានែលធំរបស់អ្នក (YouTube, TikTok ឬ Facebook)។', 'Some of the conditions are not met yet.': 'លក្ខខណ្ឌខ្លះមិនទាន់គ្រប់។',
                'Your request is already being checked.': 'ពាក្យសុំរបស់អ្នកកំពុងត្រូវបានពិនិត្យ។', 'You can ask again 30 days after the last answer.': 'អ្នកអាចដាក់ពាក្យម្ដងទៀត 30 ថ្ងៃក្រោយចម្លើយលើកមុន។' };
            msg('sendMsg', false, LANG === 'en' ? (x.error || 'Could not send.') : (KM[x.error] || 'ផ្ញើមិនបាន។'));
            btn.disabled = false;
        });
    }
    async function load() {
        const d = await api('/api/verify/me');
        if (!d.success) { $('root').innerHTML = `<div class="card muted">${T('ផ្ទុកមិនបាន', 'Could not load')}</div>`; return; }
        st.d = d; st.type = d.accountType === 'business' ? 'business' : 'personal';
        st.cat = d.category || '';
        draw();
    }
    load();
})();
</script>
</body>
</html>
