<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camfeed - Friends</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; }
        
        /* 🌐 របារខាងលើ (Top Bar & Navigation) ដូច Facebook */
        .top-bar { display: flex; flex-direction: column; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 1000; padding: 0 10px; }
        .top-bar-row1 { display: flex; justify-content: space-between; align-items: center; height: 50px; border-bottom: 1px solid #f0f2f5; width: 100%; }
        .top-left { display: flex; align-items: center; gap: 8px; position: relative; }
        .logo-nav { font-size: 22px; font-weight: bold; color: #1877f2; cursor: pointer; letter-spacing: -0.5px; }

        /* Navigation Tabs ខាងលើ (Home, Videos, Friends, Chat) */
        .nav-menus { display: flex; justify-content: space-around; align-items: center; height: 48px; width: 100%; border-top: 1px solid #f0f2f5; position: relative; }
        .menu-btn { background: none; border: none; font-size: 22px; color: #65676b; cursor: pointer; flex: 1; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; border-radius: 0; }
        .menu-btn:hover { background: #f2f2f2; }
        .menu-btn.active { color: #1877f2; border-bottom: 3px solid #1877f2; }

        .top-right-icons { display: flex; align-items: center; gap: 6px; }
        .icon-circle-btn { width: 38px; height: 38px; border-radius: 50%; background: #e4e6eb; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; position: relative; }
        .notif-badge { position: absolute; top: 1px; right: 1px; background: #fa383e; color: white; font-size: 9px; padding: 2px 4px; border-radius: 10px; font-weight: bold; }
        .hidden { display: none !important; }

        .container { max-width: 680px; margin: 15px auto; padding: 0 10px; box-sizing: border-box; }
        .friends-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        
        .user-grid { display: flex; flex-direction: column; gap: 15px; margin-top: 15px; }
        .user-card { display: flex; align-items: center; justify-content: space-between; background: #fff; border-bottom: 1px solid #f0f2f5; padding-bottom: 12px; }
        .user-info-left { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .avatar { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; background: #ccc; }
        .user-name { font-weight: bold; color: #050505; font-size: 16px; margin-bottom: 4px; }
        
        .user-actions { display: flex; gap: 8px; }
        .btn-follow { padding: 8px 16px; background: #1877f2; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-follow:hover { background: #166fe5; }
        
        /* 🎨 ប៊ូតុងពណ៌បៃតងសម្រាប់ Follow Back */
        .btn-follow-back { background: #31a24c !important; }
        .btn-remove { padding: 8px 16px; background: #e4e6eb; color: #050505; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-remove:hover { background: #d8dadf; }
    </style>
</head>
<body>

    <!-- 🌐 Top Bar ដូច Facebook (មានរបារខាងលើពេញលេញ) -->
    <div class="top-bar">
        <div class="top-bar-row1">
            <div class="top-left">
                <div class="logo-nav" onclick="switchTab('feed')">camfeed</div>
            </div>
            <div class="top-right-icons">
                <a class="user-profile-link" href="profile.html" title="My Profile">
                    <img id="navUserAvatar" src="https://via.placeholder.com/38" style="width:36px; height:36px; border-radius:50%; object-fit:cover;">
                </a>
            </div>
        </div>

        <!-- Navigation Tabs (Home, Videos, Friends, Chat) -->
        <div class="nav-menus">
            <button class="menu-btn" id="menuFeed" onclick="switchTab('feed')" title="Home">🏠</button>
            <button class="menu-btn" id="menuVideos" onclick="switchTab('videos')" title="Videos">🎬</button>
            <button class="menu-btn active" id="menuFriends" onclick="switchTab('friends')" title="Friends">👥</button>
            <button class="menu-btn" id="menuChat" onclick="switchTab('chat')" title="Chat" style="position: relative;">
                💬
                <span id="feedUnreadBadge" class="notif-badge hidden" style="top: 8px; right: 18px;">0</span>
            </button>
        </div>
    </div>

    <div class="container">
        <div class="friends-card">
            <h2 style="margin-top: 0; color: #050505; font-size: 20px;" id="friendsTitle">People you may know</h2>
            <div id="friendsContainer" class="user-grid"></div>
        </div>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('camfeed_user')) || null;
        if (!currentUser) {
            window.location.href = 'index.html';
        } else {
            if(currentUser.profile_pic) {
                document.getElementById('navUserAvatar').src = currentUser.profile_pic;
            }
            loadUsers();
            loadFeedMessengerBadge();
            setInterval(loadFeedMessengerBadge, 3000);
        }

        // 🎯 មុខងារ SwitchTab ដែលបានកែសម្រួលថ្មី៖ ពេលចុចលើ tab ដែលកំពុងមើលស្រាប់ វានឹង Scroll ឡើងលើនិង Reload ទិន្នន័យស្វ័យប្រវត្តិ
        function switchTab(tab) {
            if (tab === 'videos') { 
                if (window.location.pathname.includes('videos.html')) {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    window.location.href = 'videos.html'; 
                }
                return; 
            }
            if (tab === 'friends') { 
                if (window.location.pathname.includes('friends.html')) {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    loadUsers(); // 🔄 Refresh បញ្ជីមិត្តភក្តិឡើងវិញ
                } else {
                    window.location.href = 'friends.html'; 
                }
                return; 
            }
            if (tab === 'chat') { 
                if (window.location.pathname.includes('messages.html')) {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    window.location.href = 'messages.html'; 
                }
                return; 
            }
            
            // 🏠 ករណីចុចប៊ូតុង Home (Feed)
            if (window.location.pathname.includes('feed.html') || window.location.pathname === '/' || window.location.pathname.endsWith('/')) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                window.location.href = 'feed.html';
            }
        }

        async function loadFeedMessengerBadge() {
            if (!currentUser) return;
            try {
                const res = await fetch(`/api/chat-notifications?email=${currentUser.email}`);
                const data = await res.json();
                if (data.success) {
                    const unreadList = data.unreadMessages;
                    const badge = document.getElementById('feedUnreadBadge');
                    if (unreadList.length > 0) {
                        badge.innerText = unreadList.length;
                        badge.classList.remove('hidden');
                    } else {
                        badge.classList.add('hidden');
                    }
                }
            } catch (err) { console.error(err); }
        }

        async function loadUsers() {
            try {
                const res = await fetch(`/api/users?email=${encodeURIComponent(currentUser.email)}`);
                const data = await res.json();
                
                const container = document.getElementById('friendsContainer');
                container.innerHTML = '';

                if (data.success && data.users && data.users.length > 0) {
                    const filteredUsers = data.users.filter(u => u.email !== currentUser.email && !u.is_following);

                    if (filteredUsers.length === 0) {
                        container.innerHTML = `<p style="color: #65676b; text-align: center; padding: 20px;">No new users to follow.</p>`;
                        return;
                    }

                    filteredUsers.forEach(u => {
                        const div = document.createElement('div');
                        div.className = 'user-card';

                        let btnClass = '';
                        let btnText = 'Follow';

                        if (u.is_followed_by) {
                            btnClass = 'btn-follow-back';
                            btnText = 'Follow Back';
                        }

                        div.innerHTML = `
                            <div class="user-info-left" onclick="window.location.href='profile.html?email=${u.email}'">
                                <img src="${u.profile_pic || 'https://via.placeholder.com/90'}" class="avatar">
                                <div>
                                    <div class="user-name">${u.first_name} ${u.last_name}</div>
                                    <div style="font-size: 12px; color: #65676b;">Suggested for you</div>
                                </div>
                            </div>
                            <div class="user-actions">
                                <button class="btn-follow ${btnClass}" id="followBtn-${u.email.replace(/[@.]/g, '_')}" onclick="toggleFollow('${u.email}')">${btnText}</button>
                                <button class="btn-remove" onclick="this.closest('.user-card').remove()">Remove</button>
                            </div>
                        `;
                        container.appendChild(div);
                    });
                } else {
                    container.innerHTML = `<p style="color: #65676b; text-align: center; padding: 20px;">No new users to follow.</p>`;
                }
            } catch (err) {
                console.error("Error loading users:", err);
                document.getElementById('friendsContainer').innerHTML = `<p style="color: red; text-align: center; padding: 20px;">Failed to load users.</p>`;
            }
        }

        async function toggleFollow(targetEmail) {
            try {
                const res = await fetch('/api/follow', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ followerEmail: currentUser.email, followingEmail: targetEmail, action: 'follow' })
                });
                const data = await res.json();
                if (data.success) {
                    loadUsers(); // 🔄 Refresh បញ្ជីឡើងវិញភ្លាមៗ
                }
            } catch (err) {
                console.error("Error following user:", err);
            }
        }
    </script>
</body>
</html>
