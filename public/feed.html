<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamFeed - Friends & Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; top: 0 !important; }

        /* Hide Google Translate Top Banner for Clean Mobile App UI */
        .goog-te-banner-frame.skiptranslate,
        .goog-te-gadget-icon,
        #goog-gt-tt,
        .goog-te-balloon-frame,
        iframe.goog-te-banner-frame {
            display: none !important;
        }
        .skiptranslate {
            display: none !important;
        }

        /* Language Switching Loading Toast */
        .lang-loading-toast {
            position: fixed;
            top: 64px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(24, 119, 242, 0.95);
            color: #fff;
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 13.5px;
            font-weight: 700;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
            z-index: 9999;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .top-bar { display: flex; flex-direction: column; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 1000; padding: 0 10px; }
        .top-bar-row1 { display: flex; justify-content: space-between; align-items: center; height: 52px; border-bottom: 1px solid #f0f2f5; width: 100%; }
        .top-left { display: flex; align-items: center; gap: 8px; position: relative; }
        .menu-icon-btn { font-size: 18px; background: #e4e6eb; border: none; border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #050505; }
        .menu-icon-btn:hover { background: #d8dadf; }

        .logo-nav {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #1877f2 0%, #00c6ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            letter-spacing: -0.8px;
            user-select: none;
        }

        /* Dropdown Menu */
        .dropdown-menu { position: absolute; top: 48px; left: 0; background: white; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.18); width: 235px; display: none; z-index: 1100; border: 1px solid #e4e6eb; overflow: hidden; }
        .dropdown-item { padding: 12px 16px; font-size: 14px; font-weight: 600; color: #050505; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; text-decoration: none; border-bottom: 1px solid #f0f2f5; }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover { background: #f2f2f2; }

        .lang-submenu { display: none; background: #f8f9fa; border-bottom: 1px solid #e4e6eb; }
        .lang-submenu.open { display: block; }
        .lang-option-row { padding: 10px 18px 10px 32px; font-size: 13.5px; font-weight: 600; color: #050505; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
        .lang-option-row:hover { background: #e7f3ff; color: #1877f2; }
        .lang-option-row.active-lang { color: #1877f2; font-weight: 700; }

        /* Notification Dropdown */
        .notification-dropdown { position: absolute; right: 10px; top: 48px; background: white; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); width: 315px; max-height: 420px; overflow-y: auto; display: none; z-index: 1100; border: 1px solid #e4e6eb; }
        .notification-item { padding: 10px 14px; border-bottom: 1px solid #f0f2f5; font-size: 13px; color: #050505; display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
        .notification-item:hover { background: #f0f7ff; }

        /* Search Box with Dedicated Search Button */
        .search-box-wrapper { position: relative; display: flex; align-items: center; background: #f0f2f5; border: 1px solid #dddfe2; border-radius: 20px; padding: 2px 4px 2px 10px; }
        .search-box-wrapper:focus-within { background: #fff; border-color: #1877f2; }
        .search-input { border: none; background: transparent; outline: none; font-size: 13px; width: 105px; transition: width 0.25s; padding: 4px 4px; }
        .search-input:focus { width: 145px; }
        .search-submit-btn { background: #1877f2; color: #fff; border: none; border-radius: 16px; padding: 4px 10px; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .search-submit-btn:hover { background: #166fe5; }

        /* Navigation Tabs */
        .nav-menus { display: flex; justify-content: space-around; align-items: center; height: 50px; width: 100%; border-top: 1px solid #f0f2f5; position: relative; }
        .menu-btn { background: none; border: none; font-size: 22px; color: #65676b; cursor: pointer; flex: 1; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; border-radius: 0; }
        .menu-btn:hover { background: #f2f2f2; }
        .menu-btn.active { color: #1877f2; border-bottom: 3px solid #1877f2; }

        .center-plus-slot { flex: 1; display: flex; align-items: center; justify-content: center; height: 100%; }
        .unified-plus-btn {
            width: 44px; height: 34px; border-radius: 10px; border: none;
            background: linear-gradient(135deg, #1877f2 0%, #00c6ff 100%);
            color: #fff; font-size: 24px; font-weight: 800; line-height: 1;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 2px 8px rgba(24, 119, 242, 0.35);
        }

        .top-right-icons { display: flex; align-items: center; gap: 6px; }
        .icon-circle-btn { width: 38px; height: 38px; border-radius: 50%; background: #e4e6eb; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; position: relative; }
        .icon-circle-btn:hover { background: #d8dadf; }
        .notif-badge { position: absolute; top: 1px; right: 1px; background: #fa383e; color: white; font-size: 9px; padding: 2px 4px; border-radius: 10px; font-weight: bold; }
        .hidden { display: none !important; }

        .user-profile-link { display: flex; align-items: center; cursor: pointer; border-radius: 50%; padding: 2px; }

        .container { max-width: 680px; margin: 12px auto; padding: 0 10px; box-sizing: border-box; }
        .friends-card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }

        /* Search Category Filter Pills (All | People | Photos | Videos) */
        .search-filter-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid #e4e6eb; scrollbar-width: none; }
        .search-filter-bar::-webkit-scrollbar { display: none; }
        .filter-pill { padding: 7px 14px; border-radius: 20px; border: none; background: #e4e6eb; color: #050505; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .filter-pill.active { background: #1877f2; color: #fff; }

        .user-grid { display: flex; flex-direction: column; gap: 14px; margin-top: 10px; }
        .user-card { display: flex; align-items: center; justify-content: space-between; background: #fff; border-bottom: 1px solid #f0f2f5; padding-bottom: 12px; }
        .user-info-left { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: #ccc; }
        .user-name { font-weight: bold; color: #050505; font-size: 15.5px; margin-bottom: 3px; }
        
        .user-actions { display: flex; gap: 8px; }
        .btn-follow { padding: 8px 15px; background: #1877f2; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13.5px; }
        .btn-follow:hover { background: #166fe5; }
        .btn-follow-back { background: #31a24c !important; }
        .btn-remove { padding: 8px 14px; background: #e4e6eb; color: #050505; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13.5px; }

        /* Search Media Result Card */
        .search-media-card { border: 1px solid #e4e6eb; border-radius: 10px; overflow: hidden; background: #fff; margin-bottom: 12px; cursor: pointer; }
        .search-media-header { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
        .search-media-thumb { width: 100%; max-height: 360px; object-fit: cover; background: #000; display: block; }

        /* Notification Popup Modal (Instant Post/Video Viewer + Comment Reactions & Replies) */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.65); display: none; align-items: center; justify-content: center; z-index: 3000; padding: 12px; box-sizing: border-box; }
        .modal-card { background: #fff; width: 100%; max-width: 500px; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,0.3); overflow: hidden; max-height: 90vh; display: flex; flex-direction: column; }
        .modal-header { padding: 12px 16px; font-weight: 700; font-size: 15.5px; border-bottom: 1px solid #e4e6eb; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 12px 16px; overflow-y: auto; flex: 1; }
    </style>
</head>
<body>

    <div id="langLoadingToast" class="lang-loading-toast">🌐 កំពុងផ្លាស់ប្តូរភាសា...</div>

    <div class="top-bar">
        <div class="top-bar-row1">
            <div class="top-left">
                <button class="menu-icon-btn" onclick="toggleMenuDropdown(event)">☰</button>
                <div class="logo-nav notranslate" translate="no" onclick="switchTab('feed')">CamFeed</div>
                <div class="dropdown-menu" id="menuDropdown" onclick="event.stopPropagation()">
                    <div class="dropdown-item" onclick="window.location.href='settings.html'"><span>⚙️ Settings & Privacy</span></div>
                    <div class="dropdown-item" onclick="toggleLanguageSubmenu(event)" style="background: #f8f9fa;">
                        <span>🌐 ភាសា / Language</span>
                        <span id="langArrowIcon" style="font-size: 11px; color: #65676b;">▼</span>
                    </div>
                    <div class="lang-submenu" id="langSubmenu">
                        <div class="lang-option-row" id="optLangKm" onclick="selectAppLanguage('km')">
                            <span>🇰🇭 ភាសាខ្មែរ (Khmer)</span>
                            <span id="checkKm" style="display:none;">✓</span>
                        </div>
                        <div class="lang-option-row" id="optLangEn" onclick="selectAppLanguage('en')">
                            <span>🇺🇸 English (អង់គ្លេស)</span>
                            <span id="checkEn" style="display:none;">✓</span>
                        </div>
                    </div>
                    <div class="dropdown-item" onclick="logout()" style="color: #fa383e;"><span>🚪 Log Out</span></div>
                </div>
            </div>

            <div class="top-right-icons">
                <div class="search-box-wrapper">
                    <input type="text" id="searchInput" class="search-input" placeholder="វាយពាក្យស្វែងរក..." onkeypress="if(event.key==='Enter') executeSearch()">
                    <button type="button" class="search-submit-btn" onclick="executeSearch()" title="ស្វែងរក">🔍</button>
                </div>

                <!-- 🔔 Notification Icon -->
                <button class="icon-circle-btn" onclick="toggleNotifications(event)">
                    🔔
                    <span id="notifBadge" class="notif-badge hidden">0</span>
                </button>
                <div class="notification-dropdown" id="notifDropdown" onclick="event.stopPropagation()">
                    <div style="padding: 10px 15px; font-weight: bold; border-bottom: 1px solid #e4e6eb;">Notifications</div>
                    <div id="notifList">
                        <div style="padding: 15px; text-align: center; color: #65676b; font-size: 13px;">No notifications yet</div>
                    </div>
                </div>

                <a class="user-profile-link" href="profile.html" title="My Profile">
                    <img id="navUserAvatar" src="https://via.placeholder.com/38" style="width:36px; height:36px; border-radius:50%; object-fit:cover;">
                </a>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="nav-menus">
            <button class="menu-btn" id="menuFeed" onclick="switchTab('feed')" title="Home">🏠</button>
            <button class="menu-btn" id="menuVideos" onclick="switchTab('videos')" title="Videos">🎬</button>
            <div class="center-plus-slot">
                <button class="unified-plus-btn" onclick="window.location.href='feed.html?create=1'" title="Create Post">+</button>
            </div>
            <button class="menu-btn active" id="menuFriends" onclick="switchTab('friends')" title="Friends">👥</button>
            <button class="menu-btn" id="menuChat" onclick="switchTab('chat')" title="Chat" style="position: relative;">
                💬
                <span id="feedUnreadBadge" class="notif-badge hidden" style="top: 8px; right: 14px;">0</span>
            </button>
        </div>
    </div>

    <div class="container">
        <div class="friends-card">
            <!-- Category Filter Bar (Shown when searching) -->
            <div class="search-filter-bar hidden" id="searchFilterBar">
                <button class="filter-pill active" id="filter-all" onclick="setSearchFilter('all')">All (ទាំងអស់)</button>
                <button class="filter-pill" id="filter-people" onclick="setSearchFilter('people')">👤 People (មនុស្ស)</button>
                <button class="filter-pill" id="filter-photos" onclick="setSearchFilter('photos')">🖼️ Photos (រូបភាព)</button>
                <button class="filter-pill" id="filter-videos" onclick="setSearchFilter('videos')">🎬 Videos (វីដេអូ)</button>
            </div>

            <h2 style="margin-top: 0; color: #050505; font-size: 19px;" id="friendsTitle">People you may know</h2>
            <div id="friendsContainer" class="user-grid"></div>
        </div>
    </div>

    <!-- Instant Notification Post/Video Modal -->
    <div id="notifPostModal" class="modal-overlay" onclick="closeNotifPostModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span id="notifPostModalTitle">ការបង្ហោះ (Post)</span>
                <span style="cursor:pointer; font-size:22px;" onclick="closeNotifPostModal()">&times;</span>
            </div>
            <div class="modal-body" id="notifPostModalBody"></div>
        </div>
    </div>

    <div id="google_translate_element" style="display:none;"></div>

    <script src="notification.js"></script>
    <script>
        const currentUser = JSON.parse(localStorage.getItem('camfeed_user')) || null;
        let currentSearchKeyword = '';
        let currentSearchFilter = 'all';

        if (!currentUser) {
            window.location.href = 'index.html';
        } else {
            if (currentUser.profile_pic) {
                document.getElementById('navUserAvatar').src = currentUser.profile_pic;
            }
            updateLangCheckmarks();

            const params = new URLSearchParams(window.location.search);
            const initialQuery = params.get('search') || '';
            const initialFilter = params.get('filter') || 'all';
            if (initialQuery) {
                document.getElementById('searchInput').value = initialQuery;
                currentSearchKeyword = initialQuery;
                currentSearchFilter = initialFilter;
                executeSearch();
            } else {
                loadUsers();
            }

            if (typeof loadNotifications === 'function') {
                loadNotifications();
                setInterval(loadNotifications, 5000);
            }
            loadFeedMessengerBadge();
            setInterval(loadFeedMessengerBadge, 3000);
        }

        function updateLangCheckmarks() {
            const lang = localStorage.getItem('camfeed_lang') || 'en';
            document.getElementById('checkKm').style.display = lang === 'km' ? 'inline' : 'none';
            document.getElementById('checkEn').style.display = lang === 'en' ? 'inline' : 'none';
            document.getElementById('optLangKm').classList.toggle('active-lang', lang === 'km');
            document.getElementById('optLangEn').classList.toggle('active-lang', lang === 'en');
        }

        function toggleLanguageSubmenu(event) {
            event.stopPropagation();
            const sub = document.getElementById('langSubmenu');
            const arrow = document.getElementById('langArrowIcon');
            sub.classList.toggle('open');
            arrow.innerText = sub.classList.contains('open') ? '▲' : '▼';
        }

        function triggerGoogleTranslate(langCode) {
            const selectEl = document.querySelector('.goog-te-combo');
            if (selectEl) {
                selectEl.value = langCode;
                selectEl.dispatchEvent(new Event('change'));
            }
            document.cookie = `googtrans=/en/${langCode}; path=/`;
            document.cookie = `googtrans=/en/${langCode}; domain=.${window.location.hostname}; path=/`;
        }

        function selectAppLanguage(langCode) {
            localStorage.setItem('camfeed_lang', langCode);
            updateLangCheckmarks();
            document.getElementById('langSubmenu').classList.remove('open');
            document.getElementById('menuDropdown').style.display = 'none';

            const toast = document.getElementById('langLoadingToast');
            toast.innerText = langCode === 'km' ? '🌐 កំពុងប្តូរទៅភាសាខ្មែរ...' : '🌐 Switching to English...';
            toast.style.display = 'flex';

            setTimeout(() => {
                if (langCode === 'km') {
                    triggerGoogleTranslate('km');
                    setTimeout(() => { toast.style.display = 'none'; }, 900);
                } else {
                    document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                    document.cookie = `googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=.${window.location.hostname}; path=/;`;
                    location.reload();
                }
            }, 250);
        }

        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                includedLanguages: 'en,km',
                autoDisplay: false
            }, 'google_translate_element');
            const savedLang = localStorage.getItem('camfeed_lang') || 'en';
            if (savedLang === 'km') {
                setTimeout(() => triggerGoogleTranslate('km'), 500);
            }
        }

        function toggleMenuDropdown(event) {
            event.stopPropagation();
            document.getElementById('notifDropdown').style.display = 'none';
            const dropdown = document.getElementById('menuDropdown');
            dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
        }

        window.onclick = function() {
            document.getElementById('menuDropdown').style.display = 'none';
            document.getElementById('notifDropdown').style.display = 'none';
        }

        function switchTab(tab) {
            if (tab === 'videos') { window.location.href = 'videos.html'; return; }
            if (tab === 'friends') { window.scrollTo({ top: 0, behavior: 'smooth' }); loadUsers(); return; }
            if (tab === 'chat') { window.location.href = 'messages.html'; return; }
            window.location.href = 'feed.html';
        }

        function setSearchFilter(filterType) {
            currentSearchFilter = filterType;
            document.querySelectorAll('.filter-pill').forEach(btn => btn.classList.remove('active'));
            const activePill = document.getElementById(`filter-${filterType}`);
            if (activePill) activePill.classList.add('active');
            executeSearch();
        }

        async function executeSearch() {
            const keyword = document.getElementById('searchInput').value.trim();
            currentSearchKeyword = keyword;
            const filterBar = document.getElementById('searchFilterBar');
            const titleEl = document.getElementById('friendsTitle');
            const container = document.getElementById('friendsContainer');

            if (!keyword) {
                filterBar.classList.add('hidden');
                titleEl.innerText = 'People you may know';
                loadUsers();
                return;
            }

            filterBar.classList.remove('hidden');
            titleEl.innerText = `លទ្ធផលស្វែងរកសម្រាប់ "${keyword}"`;
            container.innerHTML = `<p style="color:#65676b; text-align:center; padding:20px;">កំពុងស្វែងរក...</p>`;

            try {
                const [usersRes, postsRes] = await Promise.all([
                    fetch(`/api/users?email=${encodeURIComponent(currentUser.email)}`),
                    fetch(`/api/posts?email=${encodeURIComponent(currentUser.email)}`)
                ]);
                const usersData = await usersRes.json();
                const postsData = await postsRes.json();
                const q = keyword.toLowerCase();

                const matchedUsers = (usersData.users || []).filter(u =>
                    u.email !== currentUser.email &&
                    (`${u.first_name || ''} ${u.last_name || ''}`.toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q))
                );

                const allMatchedPosts = (postsData.posts || []).filter(p =>
                    (p.content || '').toLowerCase().includes(q) ||
                    `${p.first_name || ''} ${p.last_name || ''}`.toLowerCase().includes(q) ||
                    (p.ai_category || '').toLowerCase().includes(q)
                );

                const matchedPhotos = allMatchedPosts.filter(p =>
                    p.media_type === 'image' || (p.media_url && p.media_url.includes('"type":"image"'))
                );
                const matchedVideos = allMatchedPosts.filter(p =>
                    p.media_type === 'video' || (p.media_url && p.media_url.includes('"type":"video"'))
                );

                let html = '';

                if (currentSearchFilter === 'all' || currentSearchFilter === 'people') {
                    if (matchedUsers.length > 0) {
                        html += matchedUsers.map(u => `
                            <div class="user-card">
                                <div class="user-info-left" onclick="window.location.href='profile.html?email=${encodeURIComponent(u.email)}'">
                                    <img src="${u.profile_pic || 'https://via.placeholder.com/70'}" class="avatar">
                                    <div>
                                        <div class="user-name">${u.first_name} ${u.last_name}</div>
                                        <div style="font-size: 12px; color: #65676b;">👤 People on CamFeed</div>
                                    </div>
                                </div>
                                <div class="user-actions">
                                    ${u.is_following
                                        ? `<button class="btn-remove" onclick="window.location.href='profile.html?email=${encodeURIComponent(u.email)}'">View Profile</button>`
                                        : `<button class="btn-follow ${u.is_followed_by ? 'btn-follow-back' : ''}" onclick="toggleFollow('${u.email}')">${u.is_followed_by ? 'Follow Back' : 'Follow'}</button>`
                                    }
                                </div>
                            </div>
                        `).join('');
                    }
                }

                const mediaPostsToRender = currentSearchFilter === 'photos'
                    ? matchedPhotos
                    : (currentSearchFilter === 'videos' ? matchedVideos : (currentSearchFilter === 'all' ? allMatchedPosts : []));

                if (mediaPostsToRender.length > 0) {
                    html += mediaPostsToRender.map(p => {
                        let thumbHtml = '';
                        let isVid = p.media_type === 'video';
                        let mediaSrc = p.media_url || '';
                        if (mediaSrc.trim().startsWith('[')) {
                            try {
                                const arr = JSON.parse(mediaSrc);
                                if (arr.length > 0) {
                                    mediaSrc = arr[0].url;
                                    isVid = arr[0].type === 'video';
                                }
                            } catch (e) {}
                        }
                        if (mediaSrc) {
                            thumbHtml = isVid
                                ? `<video src="${mediaSrc}" class="search-media-thumb" muted playsinline></video>`
                                : `<img src="${mediaSrc}" class="search-media-thumb">`;
                        }
                        return `
                            <div class="search-media-card" onclick="openPostInPopupModal(${p.id})">
                                <div class="search-media-header">
                                    <img src="${p.profile_pic || 'https://via.placeholder.com/36'}" style="width:36px; height:36px; border-radius:50%; object-fit:cover;">
                                    <div>
                                        <div style="font-weight:700; font-size:14px;">${p.first_name} ${p.last_name}</div>
                                        <div style="font-size:11px; color:#65676b;">${isVid ? '🎬 Video' : (mediaSrc ? '🖼️ Photo' : '📝 Post')} · ${new Date(p.created_at).toLocaleDateString()}</div>
                                    </div>
                                </div>
                                ${p.content ? `<div style="padding:0 12px 10px; font-size:14px;">${p.content}</div>` : ''}
                                ${thumbHtml}
                            </div>
                        `;
                    }).join('');
                }

                container.innerHTML = html || `<p style="color:#65676b; text-align:center; padding:24px;">រកមិនឃើញលទ្ធផលសម្រាប់ "${keyword}" ទេ។</p>`;
            } catch (err) {
                console.error(err);
                container.innerHTML = `<p style="color:red; text-align:center; padding:20px;">Search failed.</p>`;
            }
        }

        async function loadFeedMessengerBadge() {
            if (!currentUser) return;
            try {
                const res = await fetch(`/api/chat-notifications?email=${currentUser.email}`);
                const data = await res.json();
                if (data.success) {
                    const unreadList = data.unreadMessages;
                    const badge = document.getElementById('feedUnreadBadge');
                    if (unreadList.length > 0) {
                        badge.innerText = unreadList.length;
                        badge.classList.remove('hidden');
                    } else {
                        badge.classList.add('hidden');
                    }
                }
            } catch (err) { console.error(err); }
        }

        async function loadUsers() {
            try {
                const res = await fetch(`/api/users?email=${encodeURIComponent(currentUser.email)}`);
                const data = await res.json();
                const container = document.getElementById('friendsContainer');
                container.innerHTML = '';

                if (data.success && data.users && data.users.length > 0) {
                    const filteredUsers = data.users.filter(u => u.email !== currentUser.email && !u.is_following);

                    if (filteredUsers.length === 0) {
                        container.innerHTML = `<p style="color: #65676b; text-align: center; padding: 20px;">No new users to follow.</p>`;
                        return;
                    }

                    filteredUsers.forEach(u => {
                        const div = document.createElement('div');
                        div.className = 'user-card';
                        const btnClass = u.is_followed_by ? 'btn-follow-back' : '';
                        const btnText = u.is_followed_by ? 'Follow Back' : 'Follow';

                        div.innerHTML = `
                            <div class="user-info-left" onclick="window.location.href='profile.html?email=${encodeURIComponent(u.email)}'">
                                <img src="${u.profile_pic || 'https://via.placeholder.com/70'}" class="avatar">
                                <div>
                                    <div class="user-name">${u.first_name} ${u.last_name}</div>
                                    <div style="font-size: 12px; color: #65676b;">Suggested for you</div>
                                </div>
                            </div>
                            <div class="user-actions">
                                <button class="btn-follow ${btnClass}" onclick="toggleFollow('${u.email}')">${btnText}</button>
                                <button class="btn-remove" onclick="this.closest('.user-card').remove()">Remove</button>
                            </div>
                        `;
                        container.appendChild(div);
                    });
                } else {
                    container.innerHTML = `<p style="color: #65676b; text-align: center; padding: 20px;">No new users to follow.</p>`;
                }
            } catch (err) {
                console.error("Error loading users:", err);
                document.getElementById('friendsContainer').innerHTML = `<p style="color: red; text-align: center; padding: 20px;">Failed to load users.</p>`;
            }
        }

        async function toggleFollow(targetEmail) {
            try {
                const res = await fetch('/api/follow', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ followerEmail: currentUser.email, followingEmail: targetEmail, action: 'follow' })
                });
                const data = await res.json();
                if (data.success) {
                    if (currentSearchKeyword) executeSearch();
                    else loadUsers();
                }
            } catch (err) { console.error("Error following user:", err); }
        }

        function closeNotifPostModal() {
            document.getElementById('notifPostModal').style.display = 'none';
            document.getElementById('notifPostModalBody').innerHTML = '';
        }

        function logout() {
            localStorage.removeItem('camfeed_user');
            window.location.href = 'index.html';
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
