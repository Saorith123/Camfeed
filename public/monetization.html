        .card-title { font-size: 17px; font-weight: 800; color: #050505; display: flex; align-items: center; gap: 8px; }

        /* Wallet Header */
        .wallet-box { background: linear-gradient(135deg, #1877f2 0%, #00c6ff 100%); color: #fff; border-radius: 12px; padding: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(24,119,242,0.3); }

        .withdraw-btn { background: #fff; color: #1877f2; border: none; padding: 10px 20px; border-radius: 20px; font-weight: 800; cursor: pointer; font-size: 13.5px; transition: transform 0.1s; }
        .withdraw-btn:active { transform: scale(0.95); }

        /* Eligibility Grid */
        .criteria-list { display: flex; flex-direction: column; gap: 10px; }
        .criteria-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #f8f9fa; border-radius: 10px; border: 1px solid #e4e6eb; font-size: 13.5px; font-weight: 700; }
        .criteria-badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 800; }
        .badge-pass { background: #e6f4ea; color: #137333; }
        .badge-pending { background: #fef7e0; color: #b06000; }

        .ref-input-row { display: flex; gap: 8px; }
        .ref-input { flex: 1; padding: 10px 14px; border: 1px solid #dddfe2; border-radius: 10px; background: #f0f2f5; font-weight: 700; font-size: 14px; color: #65676b; outline: none; }

        .copy-btn:hover { background: #166fe5; }

        .btn-primary { width: 100%; padding: 12px; background: #1877f2; color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 2px 8px rgba(24,119,242,0.3); }

function render() {

  $('refLinkInput').value = d.referralCode ? location.origin + '/index.html?ref=' + d.referralCode : '';
  $('refCodeInput').value = d.referralCode || '';

  var box = $('monetizationStatusContainer'); box.textContent = '';

    });

  }

  (d.ledger || []).forEach(function (l) { var k = { bonus: 'kBonus', adjustment: 'kAdjustment', withdrawal: 'kWithdrawal', withdrawal_refund: 'kRefund', revenue_share: 'kRev', referral: 'kReferral' }[l.kind] || 'kBonus'; rows.push({ date: l.created_at, title: t(k), sub: l.note, amount: l.amount, ledger: true }); });

}
async function api(path, body) {

}
async function load() { var d = await api('/api/monetization/status?email=' + encodeURIComponent(currentUser.email)); if (d.success) { data = d; render(); } else msg(false, d.error || t('net')); }

  box.appendChild(el('div', { class: 'mz-lbl' }, t('method'))); var sel = el('select', { class: 'mz-in', id: 'wdMethod' }); ['ABA', 'Wing', 'KHQR', 'Other'].forEach(function (m) { sel.appendChild(el('option', { value: m }, m)); }); box.appendChild(sel);
  field(t('accName'), 'wdName'); field(t('accNum'), 'wdNumber'); box.appendChild(el('div', { class: 'mz-lbl', style: 'font-weight:400' }, t('paidBy')));

  document.body.appendChild(modal);
});
applyTexts(); load();
})();
