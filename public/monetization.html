    if (n1 !== n2) return msg(false, t('mismatch'));
    send.disabled = true;
    var d = await api('/api/monetization/withdraw', { amount: $('wdAmount').value, method: m, carrier: $('wdCarrier') ? $('wdCarrier').value : '', accountName: $('wdName') ? $('wdName').value : '', accountNumber: $('wdNumber') ? $('wdNumber').value : '', pocket: pocket });
    send.disabled = false; if (d.success) { modal.remove(); msg(true, t('wdSent')); load(); } else { msg(false, d.error || t('net')); }
  });
  document.body.appendChild(modal);
}

})();

<script>

  function left(end) { var d = (new Date(end) - Date.now()) / 1000; if (d <= 0) return L.ended; var dd = Math.floor(d / 86400), h = Math.floor(d % 86400 / 3600), m = Math.floor(d % 3600 / 60); return en ? (dd ? dd + 'd ' : '') + h + 'h ' + m + 'm left' : 'នៅសល់ ' + (dd ? dd + ' ថ្ងៃ ' : '') + h + ' ម៉ោង ' + m + ' នាទី'; }
