      async function reveal() { if (real) return true; var r = await api('/api/monetization/withdrawals/' + w.id + '/code', {}); if (r.success) { real = r.code; return true; } msg(false, r.error || t('net')); return false; }
      show.addEventListener('click', async function () { if (shown) { shown = false; inp.type = 'password'; inp.value = '••••••••'; show.textContent = t('showCode'); return; } if (!(await reveal())) return; shown = true; inp.type = 'text'; inp.value = real; show.textContent = t('hideCode'); });
      cp.addEventListener('click', async function () { if (!(await reveal())) return; try { await navigator.clipboard.writeText(real); } catch (e) { var tmp = el('input'); document.body.appendChild(tmp); tmp.value = real; tmp.select(); document.execCommand('copy'); tmp.remove(); } msg(true, t('copiedC')); });
      row.appendChild(inp); row.appendChild(show); row.appendChild(cp); card.appendChild(row);
      card.appendChild(el('small', { style: 'display:block;color:#9b1229;margin-top:4px' }, t('keepSecret')));
      if (w.reissuePending) card.appendChild(el('small', { style: 'display:block;margin-top:6px;color:#b25e00;font-weight:700' }, t('reissueWait')));
      else if (w.reissueLeft > 0) { var rb = el('button', { type: 'button', class: 'mz-btn', style: 'margin-top:8px' }, t('reissue')); rb.addEventListener('click', async function () { if (!confirm(t('confirmReissue'))) return; rb.disabled = true; var r = await api('/api/monetization/withdrawals/' + w.id + '/reissue', {}); if (r.success) { msg(true, t('reissueSent')); load(); } else { rb.disabled = false; msg(false, r.error || t('net')); } }); card.appendChild(rb); }
    }

  });

  if (location.hash === '#payouts') box.scrollIntoView();
}
async function api(path, body) {
  try { var res = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : undefined); return await res.json(); } catch (e) { return { success: false, error: t('net') }; }
}

async function loadPosts() {
  if (!data || data.applicationStatus !== 'approved') return;
  var d = await api('/api/monetization/posts'); if (!d.success) return;
  $('postsCard').style.display = ''; $('tPostsTitle').textContent = t('postsTitle');
  $('postsNote').textContent = t('pNote') + (data.payPerView > 0 ? ' ' + t('pRate') + Number(data.payPerView).toFixed(2) + ' / 1,000 ' + t('pViews') : '');
  var box = $('postsBox'); box.textContent = ''; if (!d.posts.length) { box.appendChild(el('div', { class: 'mz-empty' }, t('pNone'))); return; }
  d.posts.forEach(function (p) {
    var card = el('div', { style: 'border-top:1px solid #f0f2f5;padding:10px 0' });
    var head = el('div', { style: 'display:flex;justify-content:space-between;gap:8px;cursor:pointer' });
    head.appendChild(el('div', { style: 'flex:1;min-width:0' }, (p.text || (p.mediaType === 'video' ? '🎬 Video' : p.mediaType === 'image' ? '🖼 Photo' : '—'))));
    head.appendChild(el('div', { style: 'font-weight:800;white-space:nowrap' }, usd(p.earnings)));
    card.appendChild(head); card.appendChild(el('small', { style: 'color:#65676b' }, fmtDate(p.created_at) + ' · 👁 ' + p.views));
    var det = el('div', { style: 'display:none;margin-top:8px;grid-template-columns:1fr 1fr;gap:8px' });
    [[t('pViews'), p.views], [t('pEarn'), usd(p.earnings)], [t('pEng'), p.likes + p.comments + p.shares], [t('pLikes') + ' / ' + t('pComments') + ' / ' + t('pShares'), p.likes + ' / ' + p.comments + ' / ' + p.shares]].forEach(function (x) {
      var c = el('div', { style: 'border:1px solid #e4e6eb;border-radius:12px;padding:8px 10px' }); c.appendChild(el('div', { style: 'font-size:12px;color:#65676b' }, x[0])); c.appendChild(el('div', { style: 'font-size:18px;font-weight:800' }, String(x[1]))); det.appendChild(c);
    });
    head.addEventListener('click', function () { det.style.display = det.style.display === 'none' ? 'grid' : 'none'; });
    card.appendChild(det); box.appendChild(card);
  });
}
async function load() { var d = await api('/api/monetization/status?email=' + encodeURIComponent(currentUser.email)); if (d.success) { data = d; render(); loadPosts(); } else msg(false, d.error || t('net')); }
async function apply() { if ((($('applyMsg') || {}).value || '').trim().length < 10) return msg(false, t('reqShort')); if (!confirm(t('apply') + '?')) return; var b = $('applyMonetizeBtn'); b.disabled = true; b.textContent = t('applying'); var d = await api('/api/monetization/apply', { message: ($('applyMsg') || {}).value || '' }); if (d.success) { msg(true, t('sent')); } else msg(false, d.error || t('net')); load(); }
$('copyBtn').addEventListener('click', function () { var i = $('refLinkInput'); i.select(); try { navigator.clipboard.writeText(i.value); } catch (e) { document.execCommand('copy'); } msg(true, t('copied')); });
$('copyCodeBtn').addEventListener('click', function () { var i = $('refCodeInput'); i.select(); try { navigator.clipboard.writeText(i.value); } catch (e) { document.execCommand('copy'); } msg(true, t('copiedCode')); });
$('withdrawBtn').addEventListener('click', function () {
  if (!data) return;
  if (data.walletBalance < data.minWithdraw) return msg(false, t('needMore') + Number(data.minWithdraw).toFixed(2));
  var modal = el('div', { class: 'mz-modal' }), box = el('div', { class: 'mz-box', style: 'max-height:90vh;overflow:auto' }); modal.appendChild(box); box.appendChild(el('h3', {}, t('wdTitle')));
  function field(label, id, type, value, parent) { var w = el('div'); w.appendChild(el('div', { class: 'mz-lbl' }, label)); var i = el('input', { class: 'mz-in', id: id, type: type || 'text', autocomplete: 'off' }); if (value !== undefined) i.value = value; w.appendChild(i); (parent || box).appendChild(w); return i; }
  field(t('amount') + ' (' + t('min') + Number(data.minWithdraw).toFixed(2) + ')', 'wdAmount', 'number', Math.min(data.walletBalance, Math.max(data.minWithdraw, 1)).toFixed(2));
  box.appendChild(el('div', { class: 'mz-lbl' }, t('method'))); var sel = el('select', { class: 'mz-in', id: 'wdMethod' });
  sel.appendChild(el('option', { value: '' }, t('pickMethod'))); ['TopUp', 'WingCash', 'ABA', 'ACLEDA', 'Wing'].forEach(function (m) { sel.appendChild(el('option', { value: m }, t(MN[m]))); }); box.appendChild(sel);
  var dyn = el('div'); box.appendChild(dyn);
  function build() {
    dyn.textContent = ''; var m = sel.value; if (!m) return;
    if (m === 'TopUp') { dyn.appendChild(el('div', { class: 'mz-lbl' }, t('carrier'))); var c = el('select', { class: 'mz-in', id: 'wdCarrier' }); ['Cellcard', 'Smart', 'Metfone'].forEach(function (x) { c.appendChild(el('option', { value: x }, x)); }); dyn.appendChild(c); field(t('phone'), 'wdNumber', 'tel', undefined, dyn); field(t('phone2'), 'wdNumber2', 'tel', undefined, dyn); }
    else if (m === 'WingCash') { field(t('wingPhone'), 'wdNumber', 'tel', undefined, dyn); field(t('phone2'), 'wdNumber2', 'tel', undefined, dyn); }
    else { field(t('accNameFull'), 'wdName', 'text', undefined, dyn); field(t('accNum'), 'wdNumber', 'text', undefined, dyn); field(t('accNum2'), 'wdNumber2', 'text', undefined, dyn); }
  }
  sel.addEventListener('change', build);
  box.appendChild(el('div', { class: 'mz-lbl', style: 'font-weight:400' }, t('minFee') + ' ' + t('paidBy')));
  var btns = el('div', { class: 'mz-btns' }); var cancel = el('button', { type: 'button', class: 'mz-btn' }, t('cancel')), send = el('button', { type: 'button', class: 'mz-btn p' }, t('send')); btns.appendChild(cancel); btns.appendChild(send); box.appendChild(btns);
  cancel.addEventListener('click', function () { modal.remove(); });
  send.addEventListener('click', async function () {
    var m = sel.value; if (!m) return msg(false, t('pickMethod'));
    var n1 = $('wdNumber') ? $('wdNumber').value.replace(/\D/g, '') : '', n2 = $('wdNumber2') ? $('wdNumber2').value.replace(/\D/g, '') : '';
    if (n1 !== n2) return msg(false, t('mismatch'));
    send.disabled = true;
    var d = await api('/api/monetization/withdraw', { amount: $('wdAmount').value, method: m, carrier: $('wdCarrier') ? $('wdCarrier').value : '', accountName: $('wdName') ? $('wdName').value : '', accountNumber: $('wdNumber') ? $('wdNumber').value : '' });
    send.disabled = false; if (d.success) { modal.remove(); msg(true, t('wdSent')); load(); } else { msg(false, d.error || t('net')); }
  });
  document.body.appendChild(modal);
});
applyTexts(); load();
})();
