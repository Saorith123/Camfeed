<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CamFeed - Messages</title>
    <link rel="icon" type="image/png" href="logo-icon.png">
    <link rel="apple-touch-icon" href="logo-icon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #050505;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Contacts List Top Bar */
        .top-nav {
            background: #fff;
            height: 56px;
            padding: 0 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e4e6eb;
            flex-shrink: 0;
        }
        .nav-left { display: flex; align-items: center; gap: 10px; }
        .back-btn {
            background: #f0f2f5;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #050505;
        }
        .back-btn:hover { background: #e4e6eb; }
        .page-title {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #1877f2 0%, #00c6ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .chat-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            background: #fff;
        }

        /* Sidebar Contacts */
        .contacts-panel {
            width: 330px;
            border-right: 1px solid #e4e6eb;
            display: flex;
            flex-direction: column;
            background: #fff;
        }
        .search-box { padding: 10px 14px; border-bottom: 1px solid #f0f2f5; }
        .search-box input {
            width: 100%;
            padding: 9px 14px;
            border-radius: 20px;
            border: none;
            background: #f0f2f5;
            outline: none;
            font-size: 14px;
        }
        .contacts-list { flex: 1; overflow-y: auto; }
        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .contact-item:hover { background: #f2f3f5; }
        .contact-item.active { background: #ebf5ff; }
        .contact-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: #e4e6eb;
        }
        .contact-info { flex: 1; min-width: 0; }
        .contact-name { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .contact-sub { font-size: 13px; color: #65676b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

        /* Messenger Conversation Panel */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
            min-width: 0;
            height: 100%;
        }

        /* Messenger Top Header (← Avatar Name / Active status + Call / Video / Info) */
        .chat-header {
            height: 58px;
            padding: 0 12px;
            border-bottom: 1px solid #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background: #fff;
            z-index: 10;
        }
        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }
        .header-back-arrow {
            background: none;
            border: none;
            color: #1877f2;
            font-size: 24px;
            font-weight: 700;
            cursor: pointer;
            padding: 4px 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-avatar-wrap {
            position: relative;
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            cursor: pointer;
        }
        .header-avatar-wrap img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            background: #e4e6eb;
        }
        .online-green-dot {
            display: none;
            position: absolute;
            bottom: 0;
            right: 0;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #31a24c;
            border: 2px solid #fff;
        }
        .online-green-dot.is-online {
            display: block;
        }
        .contact-avatar-wrap {
            position: relative;
            width: 48px;
            height: 48px;
            flex-shrink: 0;
        }
        .contact-online-dot {
            display: none;
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #31a24c;
            border: 2px solid #fff;
        }
        .contact-online-dot.is-online {
            display: block;
        }
        /* Voice Review & Preview Bar Before Sending */
        .voice-review-banner {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: #eef5ff;
            border-top: 1px solid #cce0ff;
            padding: 8px 12px;
        }
        .voice-review-banner.active {
            display: flex;
        }
        .review-audio-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0038b8;
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            flex: 1;
            min-width: 0;
        }
        .header-user-meta {
            min-width: 0;
            cursor: pointer;
        }
        .header-user-name {
            font-weight: 700;
            font-size: 15.5px;
            color: #050505;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .header-user-status {
            font-size: 11.5px;
            color: #65676b;
        }
        .chat-header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .header-action-icon {
            background: none;
            border: none;
            color: #1877f2;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .header-action-icon:hover { background: #f0f2f5; }

        /* Chat Messages Feed */
        .chat-messages {
            flex: 1;
            padding: 12px 12px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #fff;
        }
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #65676b;
            text-align: center;
            padding: 20px;
        }

        /* Timestamp Divider */
        .time-divider {
            text-align: center;
            font-size: 11.5px;
            font-weight: 600;
            color: #8a8d91;
            margin: 10px 0 6px;
        }

        /* Message Row */
        .msg-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            width: 100%;
        }
        .msg-row.sent {
            justify-content: flex-end;
        }
        .msg-row.received {
            justify-content: flex-start;
        }
        .msg-sender-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: #e4e6eb;
        }
        .msg-seen-avatar {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            object-fit: cover;
            align-self: flex-end;
            margin-top: 2px;
        }

        /* Forward Button beside Audio & Media */
        .forward-circle-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #f0f2f5;
            border: none;
            color: #050505;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            align-self: center;
        }
        .forward-circle-btn:hover { background: #e4e6eb; }

        /* Text Bubble */
        .msg-bubble {
            padding: 9px 14px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.38;
            word-break: break-word;
            max-width: 75vw;
        }
        .msg-row.sent .msg-bubble {
            background: #0044cc;
            color: #fff;
        }
        .msg-row.received .msg-bubble {
            background: #f0f2f5;
            color: #050505;
        }

        /* Big Thumb Sticker */
        .big-thumb-sticker {
            font-size: 36px;
            line-height: 1;
            padding: 2px 4px;
            user-select: none;
        }

        /* Messenger Waveform Voice Message Pill */
        .voice-pill-box {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px 8px 10px;
            border-radius: 22px;
            min-width: 225px;
            max-width: 74vw;
            user-select: none;
        }
        .msg-row.sent .voice-pill-box {
            background: #0038b8;
            color: #fff;
        }
        .msg-row.received .voice-pill-box {
            background: #f0f2f5;
            color: #050505;
        }
        .voice-play-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            font-size: 13px;
            transition: transform 0.1s;
        }
        .voice-play-btn:active { transform: scale(0.92); }
        .msg-row.sent .voice-play-btn {
            background: rgba(0, 0, 0, 0.35);
            color: #fff;
        }
        .msg-row.received .voice-play-btn {
            background: #1877f2;
            color: #fff;
        }
        .voice-waveform {
            display: flex;
            align-items: center;
            gap: 2.5px;
            height: 24px;
            flex: 1;
            cursor: pointer;
        }
        .wave-bar {
            width: 2.5px;
            border-radius: 2px;
            transition: opacity 0.15s, background-color 0.15s;
        }
        .msg-row.sent .wave-bar {
            background-color: rgba(255, 255, 255, 0.42);
        }
        .msg-row.sent .wave-bar.played {
            background-color: #ffffff;
        }
        .msg-row.received .wave-bar {
            background-color: rgba(24, 119, 242, 0.3);
        }
        .msg-row.received .wave-bar.played {
            background-color: #1877f2;
        }
        .voice-duration-text {
            font-size: 12.5px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            min-width: 34px;
            text-align: right;
            flex-shrink: 0;
        }

        /* Clean Standard Media Card (Images & Videos) */
        .msg-media-card {
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #e4e6eb;
            background: #000;
            max-width: 230px;
            position: relative;
        }
        .msg-media-card img {
            width: 100%;
            max-height: 310px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }
        .msg-media-card video {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            display: block;
            background: #000;
        }

        /* Messenger Bottom Input Bar */
        .chat-input-bar {
            padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid #f0f2f5;
            display: flex;
            align-items: center;
            gap: 6px;
            background: #fff;
            flex-shrink: 0;
        }
        .bar-icon-btn {
            background: none;
            border: none;
            color: #1877f2;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s, transform 0.1s;
        }
        .bar-icon-btn:hover { background: #f0f2f5; }
        .bar-icon-btn:active { transform: scale(0.92); }
        .bar-icon-btn.recording {
            color: #fff;
            background: #fa383e;
            animation: pulseRec 1s infinite;
        }
        @keyframes pulseRec {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .message-pill-input-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            background: #f0f2f5;
            border-radius: 20px;
            padding: 4px 10px 4px 14px;
            min-width: 0;
        }
        .msg-input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 15px;
            color: #050505;
            padding: 5px 0;
            min-width: 0;
        }
        .emoji-inside-btn {
            background: none;
            border: none;
            color: #1877f2;
            font-size: 19px;
            cursor: pointer;
            padding: 2px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Quick Emoji Picker Popup */
        .emoji-popup-bar {
            display: none;
            position: fixed;
            bottom: 62px;
            left: 12px;
            right: 12px;
            max-width: 420px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #e4e6eb;
            border-radius: 16px;
            padding: 10px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.18);
            z-index: 500;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .emoji-popup-bar.show { display: flex; }
        .emoji-item-btn {
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px;
        }

        /* Recording Live Banner */
        .recording-banner {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: #ffebe9;
            color: #d93025;
            padding: 8px 14px;
            font-size: 13.5px;
            font-weight: 700;
            border-top: 1px solid #ffcdd2;
        }
        .recording-banner.active { display: flex; }

        /* Multi-Media Preview Tray (Choose Multiple Photos/Videos -> Edit or Send Immediately) */
        .media-staging-tray {
            display: none;
            flex-direction: column;
            gap: 8px;
            background: #f8f9fa;
            border-top: 1px solid #e4e6eb;
            padding: 10px 12px;
        }
        .media-staging-tray.active {
            display: flex;
        }
        .staging-items-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .staging-items-scroll::-webkit-scrollbar { display: none; }
        .staging-thumb-card {
            position: relative;
            width: 86px;
            height: 86px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            border: 1.5px solid #dddfe2;
            flex-shrink: 0;
        }
        .staging-thumb-card img, .staging-thumb-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .staging-remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.72);
            color: #fff;
            border: none;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .staging-edit-badge {
            position: absolute;
            bottom: 4px;
            left: 4px;
            right: 4px;
            background: rgba(24, 119, 242, 0.92);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 3px 0;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }
        .staging-actions-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        /* Full-Screen Photo Editor Modal (Crop, Draw Pen, Add Text) */
        .photo-editor-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            height: 100dvh;
            background: #000;
            z-index: 3000;
            flex-direction: column;
            color: #fff;
            user-select: none;
            -webkit-user-select: none;
        }
        .photo-editor-overlay.active { display: flex; }
        .editor-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px calc(10px + env(safe-area-inset-top, 0px));
            background: rgba(0, 0, 0, 0.85);
            border-bottom: 1px solid rgba(255,255,255,0.12);
            z-index: 10;
        }
        .editor-tool-tabs {
            display: flex;
            gap: 8px;
        }
        .editor-tool-btn {
            background: rgba(255,255,255,0.14);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 7px 12px;
            border-radius: 18px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .editor-tool-btn.active {
            background: #1877f2;
            border-color: #1877f2;
        }
        .editor-canvas-stage {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 12px;
            touch-action: none;
        }
        #photoEditorCanvas {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.6);
            touch-action: none;
        }
        .editor-sub-toolbar {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px 12px;
            background: rgba(18, 18, 18, 0.95);
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .color-swatch {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid #fff;
            cursor: pointer;
            transition: transform 0.12s;
        }
        .color-swatch.selected {
            transform: scale(1.22);
            box-shadow: 0 0 0 2px #1877f2;
        }
        .editor-bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
            background: #0a0a0a;
            border-top: 1px solid rgba(255,255,255,0.12);
        }

        /* Forward Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.55);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-card {
            background: #fff;
            width: 100%;
            max-width: 400px;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 6px 24px rgba(0,0,0,0.25);
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            padding: 14px 16px;
            font-weight: 700;
            font-size: 16px;
            border-bottom: 1px solid #e4e6eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-body {
            padding: 10px 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        @media (max-width: 768px) {
            .top-nav.chat-open-hide { display: none; }
            .contacts-panel { width: 100%; }
            .contacts-panel.hidden { display: none; }
            .chat-panel { width: 100%; }
            .chat-panel.hidden { display: none; }
        }
    </style>
</head>
<body>

    <div class="top-nav" id="mainTopNav">
        <div class="nav-left">
            <button class="back-btn" onclick="window.location.href='feed.html'" title="Back to Feed">←</button>
            <div class="page-title notranslate" translate="no">CamFeed Chats</div>
        </div>
        <div id="userBadge" class="notranslate" translate="no" style="font-size: 13px; color: #65676b; font-weight: 600;"></div>
    </div>

    <div class="chat-layout">
        <!-- Contacts Sidebar -->
        <div class="contacts-panel" id="contactsPanel">
            <div class="search-box">
                <input type="text" id="searchContactInput" placeholder="ស្វែងរកអ្នកជជែក (Search)..." oninput="handleSearch(this.value)">
            </div>
            <div class="contacts-list" id="contactsList">
                <div style="padding: 20px; text-align: center; color: #65676b;">Loading conversations...</div>
            </div>
        </div>

        <!-- Messenger Conversation Panel -->
        <div class="chat-panel hidden" id="chatPanel">
            <!-- Messenger Header -->
            <div class="chat-header" id="chatHeader">
                <div class="chat-header-left">
                    <button class="header-back-arrow" onclick="showContactsMobile()" title="Back">←</button>
                    <div class="header-avatar-wrap" onclick="if(activeFriend) window.location.href='profile.html?email='+encodeURIComponent(activeFriend.email)">
                        <img src="https://via.placeholder.com/38" id="activeChatAvatar">
                        <span class="online-green-dot" id="activeChatOnlineDot"></span>
                    </div>
                    <div class="header-user-meta" onclick="if(activeFriend) window.location.href='profile.html?email='+encodeURIComponent(activeFriend.email)">
                        <div class="header-user-name notranslate" translate="no" id="activeChatName">Select a conversation</div>
                        <div class="header-user-status" id="activeChatStatus"></div>
                    </div>
                </div>

                <div class="chat-header-actions">
                    <button class="header-action-icon" onclick="alert('មុខងារហៅជាសំឡេង (Audio Call) នឹងដាក់ឱ្យប្រើប្រាស់ឆាប់ៗនេះ!')" title="Audio Call">
