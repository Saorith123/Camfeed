                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userEmail: currentUser.email, senderEmail: friend.email })
            }).catch(() => {});

            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(() => {
                fetchMessages(false);
                refreshActiveFriendStatus();
            }, 3000);
        }

        function showContactsMobile() {
            if (activeAudioPlayer) {
                activeAudioPlayer.pause();
                activeAudioPlayer = null;
                activeAudioMsgId = null;
            }
            document.getElementById('mainTopNav').classList.remove('chat-open-hide');
            document.getElementById('contactsPanel').classList.remove('hidden');
            document.getElementById('chatPanel').classList.add('hidden');
            if (pollInterval) clearInterval(pollInterval);
            loadConversations();
        }

        let cachedServerMessages = [];

        async function fetchMessages(forceScroll = false) {
            if (!activeFriend) return;
            try {
                const res = await fetch(`/api/messages?user1=${encodeURIComponent(currentUser.email)}&user2=${encodeURIComponent(activeFriend.email)}`);
                const data = await res.json();
                if (data.success && Array.isArray(data.messages)) {
                    cachedServerMessages = data.messages;
                    const overrides = JSON.stringify(getLocalOverrides());
                    const sig = data.messages.map(m => `${m.id}:${m.is_read}:${m.message}:${m.media_url}`).join('|') + '||' + pendingOutgoingMessages.length + '||' + overrides;
                    if (sig !== lastMessagesSignature || forceScroll) {
                        lastMessagesSignature = sig;
                        renderMessages(data.messages, forceScroll);
                    }
                }
            } catch (err) {
                console.error('Error fetching messages:', err);
            }
        }

        function forceRenderCurrentFeed(scrollBottom = false) {
            renderMessages(cachedServerMessages, scrollBottom);
        }

        function toggleMsgOptionsMenu(msgId, event) {
            if (event) event.stopPropagation();
            document.querySelectorAll('.cf-msg-popover').forEach(p => {
                if (p.id !== `msg-pop-${msgId}`) p.classList.remove('open');
            });
            const pop = document.getElementById(`msg-pop-${msgId}`);
            if (pop) pop.classList.toggle('open');
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.cf-msg-actions-wrap')) {
                document.querySelectorAll('.cf-msg-popover').forEach(p => p.classList.remove('open'));
            }
            if (!e.target.closest('#emojiPopupBar') && !e.target.closest('.cf-emoji-trigger')) {
                document.getElementById('emojiPopupBar').classList.remove('show');
            }
        });

        function renderMessages(messages, forceScroll) {
            const box = document.getElementById('chatMessages');
            const activePending = activeFriend ? pendingOutgoingMessages.filter(p => p.receiverEmail === activeFriend.email) : [];

            if (messages.length === 0 && activePending.length === 0) {
                box.innerHTML = '<div class="cf-empty-box"><div>សួស្តី! ចាប់ផ្តើមផ្ញើសារឥឡូវនេះ 👋</div></div>';
                return;
            }

            const wasAtBottom = forceScroll || (box.scrollHeight - box.scrollTop <= box.clientHeight + 100);
            const friendAvatar = (activeFriend && activeFriend.profile_pic) ? activeFriend.profile_pic : 'https://via.placeholder.com/30';
            let lastTimeGroup = '';
            let lastSeenSentMsgId = null;
            messages.forEach(m => {
                if (m.sender_email === currentUser.email && (m.is_read === true || m.is_read === 1 || m.is_read === 't')) {
                    lastSeenSentMsgId = m.id;
                }
            });

            const overrides = getLocalOverrides();
            const audioUrlsToPreload = [];

            let html = messages.map(m => {
                const isSent = m.sender_email === currentUser.email;
                const rowClass = isSent ? 'sent' : 'received';
                const timeStr = m.created_at ? new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
                let timeDividerHtml = '';
                if (timeStr && timeStr !== lastTimeGroup) {
                    timeDividerHtml = `<div class="cf-time-chip">${timeStr}</div>`;
                    lastTimeGroup = timeStr;
                }

                const ov = overrides[m.id] || {};
                const rawMsg = ov.deleted ? DELETED_MARKER : (ov.editedText !== undefined ? EDITED_PREFIX + ov.editedText : (m.message || ''));
                const isDeleted = ov.deleted || m.is_deleted === true || rawMsg === DELETED_MARKER;

                // If deleted, show permanent deleted trace ("Message deleted")
                if (isDeleted) {
                    const leftAv = !isSent ? `<img src="${friendAvatar}" class="cf-msg-avatar">` : '';
                    return `
                        ${timeDividerHtml}
                        <div class="cf-msg-row ${rowClass}">
                            ${leftAv}
                            <div class="cf-msg-stack">
                                <div class="cf-bubble-deleted">🚫 សារនេះត្រូវបានលុប (Message deleted)</div>
                            </div>
                        </div>
                    `;
                }

                let isEdited = false;
                let displayText = rawMsg;
                if (displayText.startsWith(EDITED_PREFIX)) {
                    isEdited = true;
                    displayText = displayText.slice(EDITED_PREFIX.length);
                } else if (m.is_edited) {
                    isEdited = true;
                }

                const isVideo = !ov.deleted && m.media_url && (m.message_type === 'video' || (m.media_url.match(/\.(mp4|webm|mov|m4v)$/i) && m.message_type !== 'audio'));
                const isAudio = !ov.deleted && m.media_url && (m.message_type === 'audio' || displayText === '[Voice Message]' || m.media_url.match(/\.(mp3|wav|ogg|m4a)$/i));
                const isTextOnly = !m.media_url && displayText && displayText !== '👍';

                // Action menu: Forward for all; Edit (text) + Delete (text, photo, video, voice) for sender!
                const menuItems = `
                    <button type="button" onclick="openForwardModal(${m.id}, '${encodeURIComponent(displayText)}', '${encodeURIComponent(m.media_url || '')}', '${m.message_type || 'text'}')">↪️ បញ្ជូនបន្ត (Forward)</button>
                    ${(isSent && isTextOnly) ? `<button type="button" onclick="startEditMessage(${m.id}, '${encodeURIComponent(displayText)}')">✏️ កែប្រែ (Edit)</button>` : ''}
                    ${isSent ? `<button type="button" class="danger" onclick="deleteSentMessage(${m.id})">🗑️ លុប (Delete)</button>` : ''}
                `;

                const actionsHtml = `
                    <div class="cf-msg-actions-wrap">
                        <button type="button" class="cf-msg-opt-btn" onclick="toggleMsgOptionsMenu(${m.id}, event)" title="Options">⋮</button>
                        <div class="cf-msg-popover" id="msg-pop-${m.id}">${menuItems}</div>
                    </div>
                `;

                let bodyHtml = '';
                if (isAudio) {
                    audioUrlsToPreload.push({ url: m.media_url, id: m.id });
                    const cached = audioBlobCache.get(m.media_url);
                    const initialDur = (cached && cached.durationSec > 0) ? formatSeconds(cached.durationSec) : '0:00';
                    const barsHtml = WAVEFORM_BARS.map(h => `<span class="wave-bar" style="height:${Math.round(h * 0.22)}px;"></span>`).join('');
                    const playedSet = getPlayedVoicesSet();
                    const isUnplayedReceived = !isSent && !playedSet.has(String(m.id));
                    bodyHtml = `
                        <div class="cf-voice-pill ${isUnplayedReceived ? 'is-unplayed' : ''}" id="voice-pill-${m.id}">
                            <button type="button" class="cf-voice-play" id="voice-btn-${m.id}" onclick="togglePlayVoiceMessage(${m.id}, '${m.media_url}')">▶</button>
                            <div class="cf-waveform" id="voice-wave-${m.id}" onclick="togglePlayVoiceMessage(${m.id}, '${m.media_url}')">${barsHtml}</div>
                            <span class="cf-voice-dur" id="voice-dur-${m.id}" data-total-dur="${initialDur}">${initialDur}</span>
                            ${isUnplayedReceived ? `<span class="cf-voice-unplayed-dot" id="voice-unplayed-dot-${m.id}" title="សារសំឡេងថ្មីមិនទាន់ស្តាប់"></span>` : ''}
                        </div>
                    `;
                } else if (m.media_url) {
                    const dlBtnHtml = `<button type="button" class="cf-media-dl-btn" onclick="downloadChatMediaFile('${m.media_url}', ${isVideo ? 'true' : 'false'}, event)" title="ទាញយក (Download)">⬇️</button>`;
                    bodyHtml = isVideo
                        ? `<div class="cf-media-card">${dlBtnHtml}<video src="${m.media_url}" controls playsinline webkit-playsinline preload="metadata"></video></div>`
                        : `<div class="cf-media-card">${dlBtnHtml}<img src="${m.media_url}" onclick="window.open('${m.media_url}', '_blank')"></div>`;
                } else if (displayText === '👍') {
                    bodyHtml = `<div class="big-thumb-sticker">👍</div>`;
                } else if (displayText) {
                    bodyHtml = `<div class="cf-bubble notranslate" translate="no">${escapeHtml(displayText)}${isEdited ? '<span class="cf-edited-tag">(បានកែ)</span>' : ''}</div>`;
                }

                const seenFooter = (isSent && m.id === lastSeenSentMsgId)
                    ? `<div class="cf-msg-footer"><span>✓✓ បានឃើញ (Seen)</span></div>`
                    : (isSent ? `<div class="cf-msg-footer"><span>✓ បានផ្ញើ</span></div>` : '');

                const leftAvatarHtml = !isSent ? `<img src="${friendAvatar}" class="cf-msg-avatar">` : '';

                return `
                    ${timeDividerHtml}
                    <div class="cf-msg-row ${rowClass}">
                        ${leftAvatarHtml}
                        ${isSent ? actionsHtml : ''}
                        <div class="cf-msg-stack">
                            ${bodyHtml}
                            ${seenFooter}
                        </div>
                        ${!isSent ? actionsHtml : ''}
                    </div>
                `;
            }).join('');

            // Append optimistic "Sending..." bubbles ONLY on sender's screen until R2 + Server confirm!
            if (activePending.length > 0) {
                html += activePending.map(p => {
                    let mediaPreview = '';
                    if (p.type === 'video' && p.previewUrl) {
                        mediaPreview = `
                            <div class="cf-media-card">
                                <video src="${p.previewUrl}" muted playsinline></video>
                                <div class="cf-media-uploading-overlay">
                                    <div class="cf-mini-spin" style="width:22px; height:22px; border-width:3px; border-color:rgba(255,255,255,0.3); border-top-color:#fff;"></div>
                                    <div style="font-size:12px; font-weight:700;">Sending video... ${p.progress || 0}%</div>
                                    <div class="cf-upload-progress-bar"><div class="cf-upload-progress-fill" style="width:${p.progress || 0}%"></div></div>
                                </div>
                            </div>
                        `;
                    } else if (p.type === 'image' && p.previewUrl) {
                        mediaPreview = `
                            <div class="cf-media-card">
                                <img src="${p.previewUrl}">
                                <div class="cf-media-uploading-overlay">
                                    <div class="cf-mini-spin" style="width:20px; height:20px; border-width:2.5px; border-color:rgba(255,255,255,0.3); border-top-color:#fff;"></div>
                                    <div style="font-size:11.5px; font-weight:700;">Sending... ${p.progress || 0}%</div>
                                </div>
                            </div>
                        `;
                    } else if (p.type === 'audio') {
                        mediaPreview = `<div class="cf-bubble">🎙️ សារសំឡេង (Voice)</div>`;
                    } else {
                        mediaPreview = `<div class="cf-bubble">${escapeHtml(p.text)}</div>`;
                    }

                    return `
                        <div class="cf-msg-row sent">
                            <div class="cf-msg-stack">
                                ${mediaPreview}
                                <div class="cf-msg-footer">
                                    <span class="cf-sending-pill"><span class="cf-mini-spin"></span> Sending...</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            box.innerHTML = html;
            audioUrlsToPreload.forEach(item => preloadAudioBlob(item.url, item.id));

            if (wasAtBottom) {
                box.scrollTop = box.scrollHeight;
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // =========================================================================
        // EDIT & DELETE SENT MESSAGES (WITH PERMANENT DELETED TRACE)
        // =========================================================================
        function startEditMessage(msgId, encodedText) {
            document.querySelectorAll('.cf-msg-popover').forEach(p => p.classList.remove('open'));
            const origText = decodeURIComponent(encodedText || '');
            editingMessageId = msgId;
            document.getElementById('editingPreviewText').innerText = origText.slice(0, 42);
            document.getElementById('editMessageBanner').classList.add('active');
            const input = document.getElementById('messageTextInput');
            input.value = origText;
            input.focus();
            updateSendOrThumbIcon();
        }

        function cancelEditMessage() {
            editingMessageId = null;
            const banner = document.getElementById('editMessageBanner');
            if (banner) banner.classList.remove('active');
            const input = document.getElementById('messageTextInput');
            if (input) input.value = '';
            updateSendOrThumbIcon();
        }

        async function submitEditedMessage(msgId, newText) {
            cancelEditMessage();
            setLocalOverride(msgId, { editedText: newText });
            forceRenderCurrentFeed(false);

            try {
                await fetch(`/api/messages/${msgId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sender: currentUser.email,
                        message: EDITED_PREFIX + newText,
                        plainText: newText
                    })
                });
                await fetchMessages(false);
                loadConversations();
            } catch (e) {}
        }

        async function deleteSentMessage(msgId) {
            document.querySelectorAll('.cf-msg-popover').forEach(p => p.classList.remove('open'));
            if (!confirm('តើអ្នកចង់លុបសារ/ឯកសារនេះមែនទេ? (នឹងបន្សល់ទុកដានថា Message deleted)')) return;

            setLocalOverride(msgId, { deleted: true });
            forceRenderCurrentFeed(false);

            try {
                // Try dedicated DELETE endpoint first, then fallback to PUT tombstone update
                const delRes = await fetch(`/api/messages/${msgId}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender: currentUser.email, tombstone: DELETED_MARKER })
                });
                if (!delRes.ok) {
                    await fetch(`/api/messages/${msgId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sender: currentUser.email, message: DELETED_MARKER, media_url: null })
                    });
                }
                await fetchMessages(false);
                loadConversations();
            } catch (e) {}
        }

        // =========================================================================
        // SEND TEXT / EMOJI / MEDIA WITH EXPLICIT "SEND" & "SENDING..."
        // =========================================================================
        function updateSendOrThumbIcon() {
            const val = document.getElementById('messageTextInput').value.trim();
            const lbl = document.getElementById('primaryBtnLabel');
            if (!lbl) return;
            if (editingMessageId) {
                lbl.innerText = 'Save ✓';
            } else if (val.length > 0) {
                lbl.innerText = 'Send ➤';
            } else {
                lbl.innerText = '👍';
            }
        }

        function handlePrimaryActionBtn() {
            const input = document.getElementById('messageTextInput');
            const text = input.value.trim();

            if (editingMessageId) {
                if (!text) return;
                submitEditedMessage(editingMessageId, text);
                return;
            }

            if (text.length > 0) {
                sendTextMessage(text);
            } else {
                sendTextMessage('👍');
            }
        }

        function toggleEmojiPopup(event) {
            event.stopPropagation();
            document.getElementById('emojiPopupBar').classList.toggle('show');
        }

        function insertEmoji(em) {
            const inp = document.getElementById('messageTextInput');
            inp.value += em;
            inp.focus();
            updateSendOrThumbIcon();
        }

        async function sendTextMessage(customText) {
            const input = document.getElementById('messageTextInput');
            const text = (customText !== undefined ? customText : input.value).trim();
            if (!text || !activeFriend) return;

            const targetEmail = activeFriend.email;
            input.value = '';
            updateSendOrThumbIcon();
            document.getElementById('emojiPopupBar').classList.remove('show');

            const tempId = 'temp-' + Date.now() + Math.random();
            pendingOutgoingMessages.push({
                tempId,
                receiverEmail: targetEmail,
                type: 'text',
                text
            });
            forceRenderCurrentFeed(true);

            try {
                const res = await fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sender: currentUser.email,
                        receiver: targetEmail,
                        message: text
                    })
                });
                const data = await res.json();
                pendingOutgoingMessages = pendingOutgoingMessages.filter(p => p.tempId !== tempId);
                if (data.success) {
                    await fetchMessages(true);
                    loadConversations();
                } else {
                    forceRenderCurrentFeed(false);
                }
            } catch (err) {
                pendingOutgoingMessages = pendingOutgoingMessages.filter(p => p.tempId !== tempId);
                forceRenderCurrentFeed(false);
            }
        }

        // =========================================================================
        // MULTI-FILE MEDIA STAGING QUEUE (Click "Send" -> Upload to R2 -> Deliver)
        // =========================================================================
        let stagedMediaItems = [];
        let editingStagedIndex = -1;

        function sendMediaMessage(fileInput) {
            const files = Array.from(fileInput.files || []);
            if (files.length === 0 || !activeFriend) return;
            fileInput.value = '';

            files.forEach(file => {
                const isImage = !!(file.type && file.type.startsWith('image/'));
                const previewUrl = URL.createObjectURL(file);
                stagedMediaItems.push({
                    id: Date.now() + Math.random(),
                    fileOrBlob: file,
                    name: file.name || (isImage ? 'photo.jpg' : 'video.mp4'),
                    previewUrl,
                    isImage
                });
            });

            renderStagedMediaTray();
        }

        function renderStagedMediaTray() {
            const tray = document.getElementById('mediaStagingTray');
            const scrollEl = document.getElementById('stagingItemsScroll');
            const sendBtn = document.getElementById('sendStagedMediaBtn');
            if (!tray || !scrollEl) return;

            if (stagedMediaItems.length === 0) {
                tray.classList.remove('active');
                scrollEl.innerHTML = '';
                return;
            }

            tray.classList.add('active');
            sendBtn.innerText = stagedMediaItems.length > 1 ? `Send (${stagedMediaItems.length}) ➤` : 'Send ➤';

            scrollEl.innerHTML = stagedMediaItems.map((item, idx) => `
                <div class="cf-stage-card">
                    ${item.isImage ? `<img src="${item.previewUrl}">` : `<video src="${item.previewUrl}" muted playsinline></video>`}
                    <button type="button" class="cf-stage-del" onclick="removeStagedMedia(${idx})" title="លុប">×</button>
                    ${item.isImage
                        ? `<button type="button" class="cf-stage-edit" onclick="editStagedPhoto(${idx})">✏️ Edit</button>`
                        : `<span style="position:absolute; bottom:4px; left:4px; background:rgba(15,23,42,0.75); color:#fff; font-size:10px; padding:2px 6px; border-radius:6px;">🎬 Video</span>`
                    }
                </div>
            `).join('');
        }

        function removeStagedMedia(idx) {
            const removed = stagedMediaItems.splice(idx, 1)[0];
            if (removed && removed.previewUrl) URL.revokeObjectURL(removed.previewUrl);
            renderStagedMediaTray();
        }

        function clearStagedMedia() {
            stagedMediaItems.forEach(it => { if (it.previewUrl) URL.revokeObjectURL(it.previewUrl); });
            stagedMediaItems = [];
            renderStagedMediaTray();
        }

        function editStagedPhoto(idx) {
            const item = stagedMediaItems[idx];
            if (!item || !item.isImage) return;
            editingStagedIndex = idx;
            openPhotoEditor(item.fileOrBlob);
        }

        async function sendAllStagedMedia() {
            if (stagedMediaItems.length === 0 || !activeFriend) return;
            const targetEmail = activeFriend.email;
            const itemsToSend = [...stagedMediaItems];

            // Hide staging tray & show "Sending..." bubble in chat stream immediately!
            stagedMediaItems = [];
            renderStagedMediaTray();

            for (let i = 0; i < itemsToSend.length; i++) {
                const it = itemsToSend[i];
                const tempId = 'temp-media-' + Date.now() + '-' + i;
                pendingOutgoingMessages.push({
                    tempId,
                    receiverEmail: targetEmail,
                    type: it.isImage ? 'image' : 'video',
                    previewUrl: it.previewUrl,
                    progress: 5
                });
                forceRenderCurrentFeed(true);

                try {
                    let blobToUpload = it.fileOrBlob;
                    if (it.isImage) {
                        blobToUpload = await compressChatImage(blobToUpload);
                    }

                    // 1. Upload completely to Cloudflare R2 FIRST (shows "Sending... %")
                    const r2Url = await uploadChatMediaToR2(blobToUpload, it.name, (pct) => {
                        const pItem = pendingOutgoingMessages.find(p => p.tempId === tempId);
                        if (pItem) {
                            pItem.progress = pct;
                            forceRenderCurrentFeed(false);
                        }
                    });

                    // 2. Only AFTER R2 has the complete video/photo, save message so recipient receives a ready-to-play file!
                    const res = await fetch('/api/messages', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            sender: currentUser.email,
                            receiver: targetEmail,
                            message: it.isImage ? '[Photo]' : '[Video]',
                            media_url: r2Url,
                            message_type: it.isImage ? 'image' : 'video'
                        })
                    });
                    const data = await res.json();
                    pendingOutgoingMessages = pendingOutgoingMessages.filter(p => p.tempId !== tempId);
                    if (it.previewUrl) URL.revokeObjectURL(it.previewUrl);

                    if (data.success) {
                        await fetchMessages(true);
                        loadConversations();
                    } else {
                        forceRenderCurrentFeed(false);
                        alert(data.error || 'Failed to deliver media.');
                    }
                } catch (err) {
                    pendingOutgoingMessages = pendingOutgoingMessages.filter(p => p.tempId !== tempId);
                    if (it.previewUrl) URL.revokeObjectURL(it.previewUrl);
                    forceRenderCurrentFeed(false);
                    alert('ការផ្ញើបរាជ័យ៖ ' + err.message);
                }
            }
        }

        // =========================================================================
        // INTERACTIVE PHOTO EDITOR (CROP + FREEHAND PEN + DRAGGABLE TEXT)
        // =========================================================================
        let editorBaseImg = null;
        let editorHistoryStack = [];
        let editorStrokes = [];
        let editorTexts = [];
        let editorMode = 'crop';
        let editorColor = '#ff3b30';
        let editorBrushSize = 5;

        let cropBox = { x: 0, y: 0, w: 0, h: 0 };
        let activeDragHandle = null;
        let dragStartPt = { x: 0, y: 0 };
        let dragStartCrop = null;
        let isDrawingStroke = false;
        let currentStroke = null;
        let draggingTextIdx = -1;

        function openPhotoEditor(file) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    editorBaseImg = img;
                    editorHistoryStack = [];
                    editorStrokes = [];
                    editorTexts = [];
                    initCanvasWithImage(img);
                    document.getElementById('photoEditorModal').classList.add('active');
                    setEditorMode('crop');
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

        function closePhotoEditor() {
            document.getElementById('photoEditorModal').classList.remove('active');
            editorBaseImg = null;
        }

        function initCanvasWithImage(img) {
            const canvas = document.getElementById('photoEditorCanvas');
            const maxW = Math.min(window.innerWidth - 24, 900);
            const maxH = Math.min(window.innerHeight - 190, 900);
            const scale = Math.min(maxW / img.width, maxH / img.height, 1);

            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);

            cropBox = {
                x: Math.round(canvas.width * 0.08),
                y: Math.round(canvas.height * 0.08),
                w: Math.round(canvas.width * 0.84),
                h: Math.round(canvas.height * 0.84)
            };
            renderEditorCanvas();
        }

        function setEditorMode(mode) {
            editorMode = mode;
            ['crop', 'pen', 'text'].forEach(m => {
                const b = document.getElementById(`toolBtn-${m}`);
                if (b) b.classList.toggle('active', m === mode);
            });

            const sub = document.getElementById('editorSubToolbar');
            const hint = document.getElementById('editorHintText');
            const colors = ['#ff3b30', '#ffcc00', '#34c759', '#007aff', '#ffffff', '#000000'];

            if (mode === 'crop') {
                hint.innerText = 'អូសជ្រុងប្រអប់ដើម្បីកាត់រូបភាព រួចចុច "✓ អនុវត្តការកាត់"';
                sub.innerHTML = `
                    <button type="button" onclick="setCropAspect('free')" style="background:#1e293b; color:#fff; border:1px solid #475569; padding:5px 11px; border-radius:10px; font-size:12px; font-weight:700; cursor:pointer;">សេរី (Free)</button>
                    <button type="button" onclick="setCropAspect('1:1')" style="background:#1e293b; color:#fff; border:1px solid #475569; padding:5px 11px; border-radius:10px; font-size:12px; font-weight:700; cursor:pointer;">1:1 ការ៉េ</button>
                    <button type="button" onclick="setCropAspect('4:5')" style="background:#1e293b; color:#fff; border:1px solid #475569; padding:5px 11px; border-radius:10px; font-size:12px; font-weight:700; cursor:pointer;">4:5 បញ្ឈរ</button>
                    <button type="button" onclick="applyCropSelection()" style="background:#10b981; color:#fff; border:none; padding:6px 14px; border-radius:10px; font-size:12.5px; font-weight:700; cursor:pointer;">✓ អនុវត្តការកាត់</button>
                `;
            } else if (mode === 'pen') {
                hint.innerText = 'ប្រើម្រាមដៃគូរលើរូបភាពដោយសេរី';
                const swatches = colors.map(c => `<span class="color-swatch ${editorColor === c ? 'selected' : ''}" style="background:${c};" onclick="selectEditorColor('${c}')"></span>`).join('');
                sub.innerHTML = `
                    ${swatches}
                    <button type="button" onclick="editorBrushSize = editorBrushSize === 5 ? 11 : 5; this.innerText = editorBrushSize === 5 ? '🖌️ តូច' : '🖌️ ធំ';" style="background:#1e293b; color:#fff; border:1px solid #475569; padding:5px 11px; border-radius:10px; font-size:12px; font-weight:700; cursor:pointer;">${editorBrushSize === 5 ? '🖌️ តូច' : '🖌️ ធំ'}</button>
                `;
            } else if (mode === 'text') {
                hint.innerText = 'ចុច "+ បន្ថែមអក្សរ" រួចអូសផ្លាស់ប្តូរទីតាំងអក្សរលើរូបភាព';
                const swatches = colors.map(c => `<span class="color-swatch ${editorColor === c ? 'selected' : ''}" style="background:${c};" onclick="selectEditorColor('${c}')"></span>`).join('');
                sub.innerHTML = `
                    ${swatches}
                    <button type="button" onclick="promptAddEditorText()" style="background:#4f46e5; color:#fff; border:none; padding:6px 14px; border-radius:10px; font-size:12.5px; font-weight:700; cursor:pointer;">+ បន្ថែមអក្សរ</button>
                `;
            }
            renderEditorCanvas();
        }

        function selectEditorColor(c) {
            editorColor = c;
            if (editorTexts.length > 0 && editorMode === 'text') editorTexts[editorTexts.length - 1].color = c;
            setEditorMode(editorMode);
        }

        function setCropAspect(ratioType) {
            const canvas = document.getElementById('photoEditorCanvas');
            if (ratioType === 'free') {
                cropBox = { x: Math.round(canvas.width * 0.08), y: Math.round(canvas.height * 0.08), w: Math.round(canvas.width * 0.84), h: Math.round(canvas.height * 0.84) };
            } else if (ratioType === '1:1') {
                const side = Math.round(Math.min(canvas.width, canvas.height) * 0.8);
                cropBox = { x: Math.round((canvas.width - side) / 2), y: Math.round((canvas.height - side) / 2), w: side, h: side };
            } else if (ratioType === '4:5') {
                let h = Math.round(canvas.height * 0.85);
                let w = Math.round(h * 0.8);
                if (w > canvas.width * 0.9) { w = Math.round(canvas.width * 0.9); h = Math.round(w * 1.25); }
                cropBox = { x: Math.round((canvas.width - w) / 2), y: Math.round((canvas.height - h) / 2), w, h };
            }
            renderEditorCanvas();
        }

        function applyCropSelection() {
            const canvas = document.getElementById('photoEditorCanvas');
            if (!editorBaseImg || cropBox.w < 20 || cropBox.h < 20) return;
            renderEditorCanvas(true);
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = cropBox.w;
            tempCanvas.height = cropBox.h;
            tempCanvas.getContext('2d').drawImage(canvas, cropBox.x, cropBox.y, cropBox.w, cropBox.h, 0, 0, cropBox.w, cropBox.h);
            editorHistoryStack.push({ img: editorBaseImg, strokes: JSON.parse(JSON.stringify(editorStrokes)), texts: JSON.parse(JSON.stringify(editorTexts)) });
            const croppedImg = new Image();
            croppedImg.onload = () => { editorBaseImg = croppedImg; editorStrokes = []; editorTexts = []; initCanvasWithImage(croppedImg); };
            croppedImg.src = tempCanvas.toDataURL('image/png');
        }

        function promptAddEditorText() {
            const txt = prompt('សរសេរអក្សរដែលចង់ដាក់លើរូបភាព៖');
            if (!txt || !txt.trim()) return;
            const canvas = document.getElementById('photoEditorCanvas');
            editorTexts.push({ text: txt.trim(), color: editorColor, x: Math.round(canvas.width / 2), y: Math.round(canvas.height / 2), fontSize: Math.max(22, Math.round(canvas.width * 0.065)) });
            renderEditorCanvas();
        }

        function undoEditorAction() {
            if (editorMode === 'pen' && editorStrokes.length > 0) { editorStrokes.pop(); renderEditorCanvas(); return; }
            if (editorMode === 'text' && editorTexts.length > 0) { editorTexts.pop(); renderEditorCanvas(); return; }
            if (editorStrokes.length > 0) { editorStrokes.pop(); renderEditorCanvas(); }
            else if (editorTexts.length > 0) { editorTexts.pop(); renderEditorCanvas(); }
            else if (editorHistoryStack.length > 0) {
                const prev = editorHistoryStack.pop();
                editorBaseImg = prev.img; editorStrokes = prev.strokes; editorTexts = prev.texts;
                initCanvasWithImage(editorBaseImg);
            }
        }

        function renderEditorCanvas(exportClean = false) {
            const canvas = document.getElementById('photoEditorCanvas');
            if (!canvas || !editorBaseImg) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(editorBaseImg, 0, 0, canvas.width, canvas.height);

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            editorStrokes.forEach(st => {
                if (!st.points || st.points.length === 0) return;
                ctx.strokeStyle = st.color;
                ctx.lineWidth = st.size;
                ctx.beginPath();
                ctx.moveTo(st.points[0].x, st.points[0].y);
                for (let i = 1; i < st.points.length; i++) ctx.lineTo(st.points[i].x, st.points[i].y);
                ctx.stroke();
            });

            editorTexts.forEach(item => {
                ctx.font = `bold ${item.fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.lineWidth = Math.max(3, Math.round(item.fontSize * 0.12));
                ctx.strokeStyle = item.color === '#000000' ? '#ffffff' : '#000000';
                ctx.strokeText(item.text, item.x, item.y);
                ctx.fillStyle = item.color;
                ctx.fillText(item.text, item.x, item.y);
            });

            if (!exportClean && editorMode === 'crop') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.52)';
                ctx.fillRect(0, 0, canvas.width, cropBox.y);
                ctx.fillRect(0, cropBox.y + cropBox.h, canvas.width, canvas.height - (cropBox.y + cropBox.h));
                ctx.fillRect(0, cropBox.y, cropBox.x, cropBox.h);
                ctx.fillRect(cropBox.x + cropBox.w, cropBox.y, canvas.width - (cropBox.x + cropBox.w), cropBox.h);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(cropBox.x, cropBox.y, cropBox.w, cropBox.h);
                const hs = 14;
                ctx.fillStyle = '#4f46e5';
                [[cropBox.x, cropBox.y], [cropBox.x + cropBox.w, cropBox.y], [cropBox.x, cropBox.y + cropBox.h], [cropBox.x + cropBox.w, cropBox.y + cropBox.h]].forEach(([cx, cy]) => {
                    ctx.fillRect(cx - hs / 2, cy - hs / 2, hs, hs);
                    ctx.strokeRect(cx - hs / 2, cy - hs / 2, hs, hs);
                });
            }
        }

        function getCanvasCoords(e) {
            const canvas = document.getElementById('photoEditorCanvas');
            const rect = canvas.getBoundingClientRect();
            return { x: (e.clientX - rect.left) * (canvas.width / (rect.width || 1)), y: (e.clientY - rect.top) * (canvas.height / (rect.height || 1)) };
        }

        (function initCanvasPointerHandlers() {
            const canvas = document.getElementById('photoEditorCanvas');
            if (!canvas) return;
            canvas.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                const pt = getCanvasCoords(e);
                if (editorMode === 'crop') {
                    const hitR = 26;
                    if (Math.hypot(pt.x - cropBox.x, pt.y - cropBox.y) <= hitR) activeDragHandle = 'nw';
                    else if (Math.hypot(pt.x - (cropBox.x + cropBox.w), pt.y - cropBox.y) <= hitR) activeDragHandle = 'ne';
                    else if (Math.hypot(pt.x - cropBox.x, pt.y - (cropBox.y + cropBox.h)) <= hitR) activeDragHandle = 'sw';
                    else if (Math.hypot(pt.x - (cropBox.x + cropBox.w), pt.y - (cropBox.y + cropBox.h)) <= hitR) activeDragHandle = 'se';
                    else if (pt.x >= cropBox.x && pt.x <= cropBox.x + cropBox.w && pt.y >= cropBox.y && pt.y <= cropBox.y + cropBox.h) activeDragHandle = 'move';
                    dragStartPt = pt; dragStartCrop = { ...cropBox };
                } else if (editorMode === 'pen') {
                    isDrawingStroke = true;
                    currentStroke = { color: editorColor, size: editorBrushSize, points: [pt] };
                    editorStrokes.push(currentStroke);
                    renderEditorCanvas();
                } else if (editorMode === 'text') {
                    draggingTextIdx = -1;
                    for (let i = editorTexts.length - 1; i >= 0; i--) {
                        const t = editorTexts[i];
                        if (Math.abs(pt.x - t.x) <= 110 && Math.abs(pt.y - t.y) <= 36) { draggingTextIdx = i; dragStartPt = pt; break; }
                    }
                }
            });

            canvas.addEventListener('pointermove', (e) => {
                if (!activeDragHandle && !isDrawingStroke && draggingTextIdx === -1) return;
                e.preventDefault();
                const pt = getCanvasCoords(e);
                if (editorMode === 'crop' && activeDragHandle && dragStartCrop) {
                    const dx = pt.x - dragStartPt.x, dy = pt.y - dragStartPt.y, minSize = 40;
                    if (activeDragHandle === 'move') {
                        cropBox.x = Math.max(0, Math.min(canvas.width - cropBox.w, dragStartCrop.x + dx));
                        cropBox.y = Math.max(0, Math.min(canvas.height - cropBox.h, dragStartCrop.y + dy));
                    } else if (activeDragHandle === 'se') {
                        cropBox.w = Math.max(minSize, Math.min(canvas.width - dragStartCrop.x, dragStartCrop.w + dx));
                        cropBox.h = Math.max(minSize, Math.min(canvas.height - dragStartCrop.y, dragStartCrop.h + dy));
                    } else if (activeDragHandle === 'nw') {
                        const newX = Math.max(0, Math.min(dragStartCrop.x + dragStartCrop.w - minSize, dragStartCrop.x + dx));
                        const newY = Math.max(0, Math.min(dragStartCrop.y + dragStartCrop.h - minSize, dragStartCrop.y + dy));
                        cropBox.w = (dragStartCrop.x + dragStartCrop.w) - newX; cropBox.h = (dragStartCrop.y + dragStartCrop.h) - newY;
                        cropBox.x = newX; cropBox.y = newY;
                    } else if (activeDragHandle === 'ne') {
                        const newY = Math.max(0, Math.min(dragStartCrop.y + dragStartCrop.h - minSize, dragStartCrop.y + dy));
                        cropBox.w = Math.max(minSize, Math.min(canvas.width - dragStartCrop.x, dragStartCrop.w + dx));
                        cropBox.h = (dragStartCrop.y + dragStartCrop.h) - newY; cropBox.y = newY;
                    } else if (activeDragHandle === 'sw') {
                        const newX = Math.max(0, Math.min(dragStartCrop.x + dragStartCrop.w - minSize, dragStartCrop.x + dx));
                        cropBox.w = (dragStartCrop.x + dragStartCrop.w) - newX;
                        cropBox.h = Math.max(minSize, Math.min(canvas.height - dragStartCrop.y, dragStartCrop.h + dy)); cropBox.x = newX;
                    }
                    renderEditorCanvas();
                } else if (editorMode === 'pen' && isDrawingStroke && currentStroke) {
                    currentStroke.points.push(pt); renderEditorCanvas();
                } else if (editorMode === 'text' && draggingTextIdx >= 0) {
                    editorTexts[draggingTextIdx].x += (pt.x - dragStartPt.x);
                    editorTexts[draggingTextIdx].y += (pt.y - dragStartPt.y);
                    dragStartPt = pt; renderEditorCanvas();
                }
            });

            const endPointer = () => { activeDragHandle = null; isDrawingStroke = false; currentStroke = null; draggingTextIdx = -1; };
            canvas.addEventListener('pointerup', endPointer);
            canvas.addEventListener('pointercancel', endPointer);
        })();

        function applyEditedPhotoToStage() {
            const canvas = document.getElementById('photoEditorCanvas');
            const doneBtn = document.getElementById('sendEditedPhotoBtn');
            if (!canvas || !editorBaseImg) return;
            doneBtn.disabled = true;
            renderEditorCanvas(true);
            canvas.toBlob((blob) => {
                try {
                    if (blob && editingStagedIndex >= 0 && stagedMediaItems[editingStagedIndex]) {
                        const oldItem = stagedMediaItems[editingStagedIndex];
                        if (oldItem.previewUrl) URL.revokeObjectURL(oldItem.previewUrl);
                        stagedMediaItems[editingStagedIndex] = { ...oldItem, fileOrBlob: blob, name: `edited-${Date.now()}.jpg`, previewUrl: URL.createObjectURL(blob) };
                        renderStagedMediaTray();
                    }
                    editingStagedIndex = -1;
                    closePhotoEditor();
                } finally { doneBtn.disabled = false; }
            }, 'image/jpeg', 0.92);
        }

        // =========================================================================
        // FORWARD MESSAGE MODAL
        // =========================================================================
        let forwardPayload = null;
        function openForwardModal(msgId, encText, encMedia, msgType) {
            document.querySelectorAll('.cf-msg-popover').forEach(p => p.classList.remove('open'));
            forwardPayload = {
                message: decodeURIComponent(encText || ''),
                media_url: decodeURIComponent(encMedia || ''),
                message_type: msgType || 'text'
            };
            const listEl = document.getElementById('forwardContactsList');
            listEl.innerHTML = allConversations.map(c => `
                <div style="display:flex; align-items:center; justify-content:space-between; padding:8px 4px; border-bottom:1px solid #f1f5f9;">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <img src="${c.profile_pic || 'https://via.placeholder.com/40'}" style="width:40px; height:40px; border-radius:12px; object-fit:cover;">
                        <div class="notranslate" translate="no" style="font-weight:700; font-size:14px;">${c.first_name || ''} ${c.last_name || ''}</div>
                    </div>
                    <button type="button" onclick="confirmForwardTo('${c.email}', this)" class="cf-send-pill-btn" style="height:32px; padding:0 14px; font-size:12.5px;">Send</button>
                </div>
            `).join('');
            document.getElementById('forwardModal').style.display = 'flex';
        }

        function closeForwardModal() {
            document.getElementById('forwardModal').style.display = 'none';
            forwardPayload = null;
        }

        async function confirmForwardTo(targetEmail, btnEl) {
            if (!forwardPayload) return;
            btnEl.disabled = true;
            btnEl.innerText = 'Sending...';

            try {
                if (forwardPayload.media_url) {
                    await fetch('/api/messages', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            sender: currentUser.email,
                            receiver: targetEmail,
                            message: forwardPayload.message || '[Forwarded Media]',
                            media_url: forwardPayload.media_url,
                            message_type: forwardPayload.message_type
                        })
                    });
                } else {
                    await fetch('/api/messages', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            sender: currentUser.email,
                            receiver: targetEmail,
                            message: forwardPayload.message
                        })
                    });
                }
                btnEl.innerText = '✓ Sent';
                btnEl.style.background = '#e2e8f0';
                btnEl.style.color = '#0f172a';
            } catch (e) {
                btnEl.disabled = false;
                btnEl.innerText = 'Send';
            }
        }
    </script>
</body>
