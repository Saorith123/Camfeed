<!-- ... existing code ... -->
            <!-- Bottom Input Composer -->
            <div class="cf-composer-dock" id="chatInputBar" style="display: none;">
                <input type="file" id="chatCameraInput" accept="image/*,video/*" capture="environment" style="display: none;" onchange="sendMediaMessage(this)">
                <input type="file" id="chatMediaInput" accept="image/*,video/*" multiple style="display: none;" onchange="sendMediaMessage(this)">

                <!-- ៣. ប៊ូតុងសញ្ញាត្រេបី (☰) នៅខាងក្រៅ បើកម៉ឺនុយមុខងារផ្សេងៗ (Stickers, Pin Location, Camera) -->
                <button class="cf-dock-icon" id="tripleDotMenuBtn" onclick="toggleTripleDotMenu(event)" title="មុខងារបន្ថែម (More Options)" style="font-weight:900; font-size:18px;">☰</button>
                <button class="cf-dock-icon" onclick="document.getElementById('chatCameraInput').click()" title="Camera">📷</button>
                <button class="cf-dock-icon" onclick="document.getElementById('chatMediaInput').click()" title="Photo / Video">🖼️</button>
                <button class="cf-dock-icon" id="voiceRecordBtn" onclick="toggleVoiceRecord()" title="Voice Message">🎙️</button>

                <div class="cf-input-capsule">
                    <textarea id="messageTextInput" class="cf-text-field" rows="1" placeholder="សរសេរសារនៅទីនេះ... (Enter ចុះបន្ទាត់)" oninput="autoResizeComposerTextarea(this); updateSendOrThumbIcon()"></textarea>
                </div>

                <button class="cf-send-pill-btn" id="primaryActionBtn" onclick="handlePrimaryActionBtn()" title="Send">
                    <span id="primaryBtnLabel">👍</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Telegram-Style 3-Dot Popup Menu (Stickers & Pin Location) -->
    <div class="cf-sticker-drawer" id="cfTripleDotPopupMenu" onclick="event.stopPropagation()" style="bottom: 68px; left: 12px; max-width: 310px;">
        <div class="cf-drawer-tabs">
            <span style="font-size: 13.5px; font-weight: 800; padding: 4px 8px; color: #4f46e5;">📎 មុខងារបន្ថែម (Tools)</span>
            <button type="button" onclick="closeTripleDotMenu()" style="background:#f1f5f9; border:none; color:#0f172a; width:26px; height:26px; border-radius:50%; font-weight:800; cursor:pointer;">✕</button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px; padding: 8px;">
            <button type="button" onclick="openStickerDrawerFromMenu()" style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; background: none; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; text-align: left; color: #0f172a;" onmouseover="this.style.background='#eef2ff'" onmouseout="this.style.background='transparent'">
                <span style="font-size: 18px;">💟</span> Stickers & Emojis
            </button>
            <button type="button" onclick="openPinLocationModal()" style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; background: none; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; text-align: left; color: #0f172a;" onmouseover="this.style.background='#eef2ff'" onmouseout="this.style.background='transparent'">
                <span style="font-size: 18px;">📍</span> Pin Location (ផ្ញើទីតាំង)
            </button>
            <button type="button" onclick="document.getElementById('chatMediaInput').click(); closeTripleDotMenu();" style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; background: none; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; text-align: left; color: #0f172a;" onmouseover="this.style.background='#eef2ff'" onmouseout="this.style.background='transparent'">
                <span style="font-size: 18px;">🖼️</span> រូបភាព ឬវីដេអូ (Media)
            </button>
        </div>
    </div>

    <!-- Pin Location Interactive Modal -->
    <div id="pinLocationModal" class="modal-overlay" onclick="closePinLocationModal()">
        <div class="modal-card" style="max-width: 420px;" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span>📍 បញ្ជូនទីតាំងបច្ចុប្បន្ន (Pin Location)</span>
                <span style="cursor:pointer; font-size:22px;" onclick="closePinLocationModal()">&times;</span>
            </div>
            <div class="modal-body" style="gap: 12px;">
                <p style="font-size: 13px; color: #64748b; margin: 0;">ជ្រើសរើសវិធីផ្ញើទីតាំងរបស់អ្នកទៅកាន់មិត្តភក្តិ៖</p>
                <div style="background: #f8fafc; border: 1px solid var(--cf-border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px;">
                    <div style="font-weight: 700; font-size: 13.5px;" id="locationCoordsStatus">កំពុងស្វែងរក GPS របស់អ្នក...</div>
                    <div id="mapPreviewBox" style="width: 100%; height: 160px; background: #e2e8f0; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #64748b; font-weight: 600; overflow: hidden; position: relative;">
                        🗺️ផែនទី GPS (GPS Live Map)
                    </div>
                </div>
                <button type="button" onclick="sendGpsLocationMessage()" class="cf-send-pill-btn" style="width: 100%; height: 42px; border-radius: 12px; font-size: 14px;">📍 ផ្ញើទីតាំងនេះ (Send Location)</button>
            </div>
        </div>
    </div>

    <!-- Interactive Photo Editor Modal -->
<!-- ... existing code ... -->
    <script>
// ... existing code ...
        let stagedMediaItems = [];
        let editingStagedIndex = -1;

        // =========================================================================
        // TRIPLE-DOT MENU & PIN LOCATION LOGIC
        // =========================================================================
        function toggleTripleDotMenu(event) {
            if (event) event.stopPropagation();
            closeStickerDrawer();
            const menu = document.getElementById('cfTripleDotPopupMenu');
            if (menu) menu.classList.toggle('show');
        }

        function closeTripleDotMenu() {
            const menu = document.getElementById('cfTripleDotPopupMenu');
            if (menu) menu.classList.remove('show');
        }

        function openStickerDrawerFromMenu() {
            closeTripleDotMenu();
            const drawer = document.getElementById('cfStickerDrawer');
            if (drawer) {
                drawer.classList.add('show');
                renderStickersGrid();
            }
        }

        let userLastCoords = { lat: 11.5564, lng: 104.9282, label: 'Phnom Penh, Cambodia' };

        function openPinLocationModal() {
            closeTripleDotMenu();
            document.getElementById('pinLocationModal').style.display = 'flex';
            const statusEl = document.getElementById('locationCoordsStatus');
            const mapBox = document.getElementById('mapPreviewBox');

            if (navigator.geolocation) {
                statusEl.innerText = 'កំពុងទាញយកទីតាំង GPS ពិតប្រាកដ...';
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        userLastCoords.lat = pos.coords.latitude;
                        userLastCoords.lng = pos.coords.longitude;
                        statusEl.innerText = `📍 Lat: ${userLastCoords.lat.toFixed(4)}, Lng: ${userLastCoords.lng.toFixed(4)}`;
                        mapBox.innerHTML = `<iframe width="100%" height="100%" frameborder="0" scrolling="no" marginheight="0" marginwidth="0" src="https://maps.google.com/maps?q=${userLastCoords.lat},${userLastCoords.lng}&z=15&output=embed"></iframe>`;
                    },
                    (err) => {
                        statusEl.innerText = '📍 ប្រើប្រាស់ទីតាំងស្ដង់ដារ (Phnom Penh)';
                        mapBox.innerHTML = `<iframe width="100%" height="100%" frameborder="0" scrolling="no" marginheight="0" marginwidth="0" src="https://maps.google.com/maps?q=11.5564,104.9282&z=14&output=embed"></iframe>`;
                    },
                    { timeout: 10000, enableHighAccuracy: true }
                );
            } else {
                statusEl.innerText = '📍 ទីតាំងបច្ចុប្បន្ន';
                mapBox.innerHTML = `<iframe width="100%" height="100%" frameborder="0" scrolling="no" marginheight="0" marginwidth="0" src="https://maps.google.com/maps?q=11.5564,104.9282&z=14&output=embed"></iframe>`;
            }
        }

        function closePinLocationModal() {
            document.getElementById('pinLocationModal').style.display = 'none';
        }

        async function sendGpsLocationMessage() {
            if (!activeFriend) return;
            const targetEmail = activeFriend.email;
            closePinLocationModal();

            const mapEmbedUrl = `https://www.google.com/maps?q=${userLastCoords.lat},${userLastCoords.lng}&z=15&output=embed`;
            const mapLink = `https://www.google.com/maps/search/?api=1&query=${userLastCoords.lat},${userLastCoords.lng}`;
            const locationMsgText = `📍 ទីតាំងរបស់ខ្ញុំ (My Location):\n${mapLink}`;

            const tempId = 'temp-loc-' + Date.now();
            pendingOutgoingMessages.push({
                tempId,
                receiverEmail: targetEmail,
                type: 'text',
                text: locationMsgText
            });
            forceRenderCurrentFeed(true);

            try {
                const res = await fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sender: currentUser.email,
                        receiver: targetEmail,
                        message: locationMsgText,
                        media_url: mapLink,
                        message_type: 'location'
                    })
                });
                const data = await res.json();
                pendingOutgoingMessages = pendingOutgoingMessages.filter(p => p.tempId !== tempId);
                if (data.success) {
                    await fetchMessages(true);
                    loadConversations();
                } else {
                    forceRenderCurrentFeed(false);
                }
            } catch (e) {
                pendingOutgoingMessages = pendingOutgoingMessages.filter(p => p.tempId !== tempId);
                forceRenderCurrentFeed(false);
            }
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#cfTripleDotPopupMenu') && !e.target.closest('#tripleDotMenuBtn')) {
                closeTripleDotMenu();
            }
        });

        // =========================================================================
        // RENDER MESSAGES WITH LOCATION CARD SUPPORT
        // =========================================================================
<!-- ... existing code ... -->
        function renderMessages(messages, forceScroll) {
            const box = document.getElementById('chatMessages');
            const activePending = activeFriend ? pendingOutgoingMessages.filter(p => p.receiverEmail === activeFriend.email) : [];

            if (messages.length === 0 && activePending.length === 0) {
                box.innerHTML = '<div class="cf-empty-box"><div>សួស្តី! ចាប់ផ្តើមផ្ញើសារឥឡូវនេះ 👋</div></div>';
                return;
            }

            const wasAtBottom = forceScroll || (box.scrollHeight - box.scrollTop <= box.clientHeight + 100);
            const friendAvatar = (activeFriend && activeFriend.profile_pic) ? activeFriend.profile_pic : 'https://via.placeholder.com/30';
            let lastTimeGroup = '';
            let lastSeenSentMsgId = null;
            messages.forEach(m => {
                if (m.sender_email === currentUser.email && (m.is_read === true || m.is_read === 1 || m.is_read === 't')) {
                    lastSeenSentMsgId = m.id;
                }
            });

            const overrides = getLocalOverrides();
            const audioUrlsToPreload = [];

            let html = messages.map(m => {
                const isSent = m.sender_email === currentUser.email;
                const rowClass = isSent ? 'sent' : 'received';
                const timeStr = m.created_at ? new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
                let timeDividerHtml = '';
                if (timeStr && timeStr !== lastTimeGroup) {
                    timeDividerHtml = `<div class="cf-time-chip">${timeStr}</div>`;
                    lastTimeGroup = timeStr;
                }

                const ov = overrides[m.id] || {};
                const rawMsg = ov.deleted ? DELETED_MARKER : (ov.editedText !== undefined ? EDITED_PREFIX + ov.editedText : (m.message || ''));
                const isDeleted = ov.deleted || m.is_deleted === true || rawMsg === DELETED_MARKER;

                if (isDeleted) {
                    const leftAv = !isSent ? `<img src="${friendAvatar}" class="cf-msg-avatar">` : '';
                    return `
                        ${timeDividerHtml}
                        <div class="cf-msg-row ${rowClass}">
                            ${leftAv}
                            <div class="cf-msg-stack">
                                <div class="cf-bubble-deleted">🚫 សារនេះត្រូវបានលុប (Message deleted)</div>
                            </div>
                        </div>
                    `;
                }

                let isEdited = false;
                let displayText = rawMsg;
                if (displayText.startsWith(EDITED_PREFIX)) {
                    isEdited = true;
                    displayText = displayText.slice(EDITED_PREFIX.length);
                } else if (m.is_edited) {
                    isEdited = true;
                }

                const isVideo = !ov.deleted && m.media_url && (m.message_type === 'video' || (m.media_url.match(/\.(mp4|webm|mov|m4v)$/i) && m.message_type !== 'audio'));
                const isAudio = !ov.deleted && m.media_url && (m.message_type === 'audio' || displayText === '[Voice Message]' || m.media_url.match(/\.(mp3|wav|ogg|m4a)$/i));
                const isLocation = !ov.deleted && (m.message_type === 'location' || displayText.includes('📍 ទីតាំងរបស់ខ្ញុំ'));
                const isTextOnly = !m.media_url && displayText && displayText !== '👍' && !displayText.startsWith('STICKER_EMOJI:');

                const menuItems = `
                    <button type="button" onclick="openForwardModal(${m.id}, '${encodeURIComponent(displayText)}', '${encodeURIComponent(m.media_url || '')}', '${m.message_type || 'text'}')">↪️ បញ្ជូនបន្ត (Forward)</button>
                    ${(isSent && isTextOnly) ? `<button type="button" onclick="startEditMessage(${m.id}, '${encodeURIComponent(displayText)}')">✏️ កែប្រែ (Edit)</button>` : ''}
                    ${isSent ? `<button type="button" class="danger" onclick="deleteSentMessage(${m.id})">🗑️ លុប (Delete)</button>` : ''}
                `;

                const actionsHtml = `
                    <div class="cf-msg-actions-wrap">
                        <button type="button" class="cf-msg-opt-btn" onclick="toggleMsgOptionsMenu(${m.id}, event)" title="Options">⋮</button>
                        <div class="cf-msg-popover" id="msg-pop-${m.id}">${menuItems}</div>
                    </div>
                `;

                let bodyHtml = '';
                if (isAudio) {
                    audioUrlsToPreload.push({ url: m.media_url, id: m.id });
                    const cached = audioBlobCache.get(m.media_url);
                    const initialDur = (cached && cached.durationSec > 0) ? formatSeconds(cached.durationSec) : '0:00';
                    const barsHtml = WAVEFORM_BARS.map(h => `<span class="wave-bar" style="height:${Math.round(h * 0.22)}px;"></span>`).join('');
                    const playedSet = getPlayedVoicesSet();
                    const isUnplayedReceived = !isSent && !playedSet.has(String(m.id));
                    bodyHtml = `
                        <div class="cf-voice-pill ${isUnplayedReceived ? 'is-unplayed' : ''}" id="voice-pill-${m.id}">
                            <button type="button" class="cf-voice-play" id="voice-btn-${m.id}" onclick="togglePlayVoiceMessage(${m.id}, '${m.media_url}')">▶</button>
                            <div class="cf-waveform" id="voice-wave-${m.id}" onclick="togglePlayVoiceMessage(${m.id}, '${m.media_url}')">${barsHtml}</div>
                            <span class="cf-voice-dur" id="voice-dur-${m.id}" data-total-dur="${initialDur}">${initialDur}</span>
                            ${isUnplayedReceived ? `<span class="cf-voice-unplayed-dot" id="voice-unplayed-dot-${m.id}" title="សារសំឡេងថ្មីមិនទាន់ស្តាប់"></span>` : ''}
                        </div>
                    `;
                } else if (isLocation) {
                    bodyHtml = `
                        <div class="cf-media-card" style="width:250px; cursor:pointer;" onclick="window.open('${m.media_url || '#'}', '_blank')">
                            <div style="height:120px; background:#e2e8f0; display:flex; align-items:center; justify-content:center; font-size:32px;">📍</div>
                            <div style="padding:10px; background:#fff; color:#0f172a; font-size:13px; font-weight:700;">
                                <div>📍 ទីតាំង GPS (Location)</div>
                                <div style="font-size:11px; color:#4f46e5; margin-top:2px;">ចុចដើម្បីបើក Google Maps ↗</div>
                            </div>
                        </div>
                    `;
                } else if (m.media_type === 'sticker' && m.media_url) {
                    bodyHtml = `<img src="${m.media_url}" class="cf-sent-sticker-img" onclick="openPhotoLightbox('${m.media_url}')" alt="Sticker">`;
                } else if (displayText.startsWith('STICKER_EMOJI:')) {
                    const emChar = displayText.replace('STICKER_EMOJI:', '');
                    bodyHtml = `<div class="cf-sent-sticker-emoji">${escapeHtml(emChar)}</div>`;
                } else if (m.media_url) {
                    const dlBtnHtml = `<button type="button" class="cf-media-dl-btn" onclick="downloadChatMediaFile('${m.media_url}', ${isVideo ? 'true' : 'false'}, event)" title="ទាញយក (Download)">⬇️</button>`;
                    bodyHtml = isVideo
                        ? `<div class="cf-media-card">${dlBtnHtml}<video src="${m.media_url}" controls playsinline webkit-playsinline preload="metadata"></video></div>`
                        : `<div class="cf-media-card">${dlBtnHtml}<img src="${m.media_url}" onclick="openPhotoLightbox('${m.media_url}')"></div>`;
                } else if (displayText === '👍') {
                    bodyHtml = `<div class="big-thumb-sticker">👍</div>`;
                } else if (displayText) {
                    bodyHtml = `<div class="cf-bubble notranslate" translate="no">${escapeHtml(displayText)}${isEdited ? '<span class="cf-edited-tag">(បានកែ)</span>' : ''}</div>`;
                }

                const seenFooter = (isSent && m.id === lastSeenSentMsgId)
                    ? `<div class="cf-msg-footer"><span>✓✓ បានឃើញ (Seen)</span></div>`
                    : (isSent ? `<div class="cf-msg-footer"><span>✓ បានផ្ញើ</span></div>` : '');

                const leftAvatarHtml = !isSent ? `<img src="${friendAvatar}" class="cf-msg-avatar">` : '';

                return `
                    ${timeDividerHtml}
                    <div class="cf-msg-row ${rowClass}">
                        ${leftAvatarHtml}
                        ${isSent ? actionsHtml : ''}
                        <div class="cf-msg-stack">
                            ${bodyHtml}
                            ${seenFooter}
                        </div>
                        ${!isSent ? actionsHtml : ''}
                    </div>
                `;
            }).join('');

            box.innerHTML = html;
            audioUrlsToPreload.forEach(item => preloadAudioBlob(item.url, item.id));

            if (wasAtBottom) {
                box.scrollTop = box.scrollHeight;
            }
        }
    </script>
