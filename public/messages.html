    <script>
        const currentUser = JSON.parse(localStorage.getItem('camfeed_user')) || null;
        let allConversations = [];
        let activeFriend = null;
        let pollInterval = null;
        let lastMessagesSignature = '';

        // =========================================================================
        // PRE-FETCHED IN-MEMORY AUDIO BLOB CACHE (Zero-Stutter Smooth Playback)
        // =========================================================================
        const audioBlobCache = new Map(); // url -> { blobUrl, durationSec, loadingPromise }
        let activeAudioPlayer = null;
        let activeAudioMsgId = null;
        let activeAnimFrame = null;

        // Deterministic waveform bar heights for visual Messenger waveform
        const WAVEFORM_BARS = [35, 65, 95, 50, 80, 100, 60, 40, 85, 70, 95, 45, 75, 100, 65, 50, 90, 75, 45, 85, 60, 35, 70, 50];

        function formatSeconds(sec) {
            if (!sec || !isFinite(sec) || sec < 0) return '0:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // Pre-downloads the entire audio file into local RAM Blob BEFORE playback so it never stutters or jumps
        function preloadAudioBlob(remoteUrl, msgId) {
            if (!remoteUrl) return Promise.resolve(null);
            if (audioBlobCache.has(remoteUrl)) {
                const entry = audioBlobCache.get(remoteUrl);
                if (entry.blobUrl) {
                    const durEl = document.getElementById(`voice-dur-${msgId}`);
                    if (durEl && entry.durationSec > 0 && activeAudioMsgId !== msgId) {
                        durEl.innerText = formatSeconds(entry.durationSec);
                    }
                    return Promise.resolve(entry);
                }
                return entry.loadingPromise;
            }

            const entry = { blobUrl: null, durationSec: 0, loadingPromise: null };
            entry.loadingPromise = fetch(remoteUrl)
                .then(res => res.blob())
                .then(blob => {
                    const localBlobUrl = URL.createObjectURL(blob);
                    entry.blobUrl = localBlobUrl;

                    return new Promise((resolve) => {
                        const probe = new Audio();
                        probe.preload = 'metadata';
                        probe.src = localBlobUrl;
                        probe.onloadedmetadata = () => {
                            if (isFinite(probe.duration) && probe.duration > 0) {
                                entry.durationSec = probe.duration;
                            } else {
                                // Fallback duration decode via Web Audio API if WebM header has Infinity duration
                                blob.arrayBuffer().then(buf => {
                                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                                    if (!AudioCtx) return resolve(entry);
                                    const ctx = new AudioCtx();
                                    ctx.decodeAudioData(buf, decoded => {
                                        entry.durationSec = decoded.duration || 0;
                                        ctx.close().catch(() => {});
                                        const durEl = document.getElementById(`voice-dur-${msgId}`);
                                        if (durEl && entry.durationSec > 0 && activeAudioMsgId !== msgId) {
                                            durEl.innerText = formatSeconds(entry.durationSec);
                                        }
                                        resolve(entry);
                                    }, () => resolve(entry));
                                }).catch(() => resolve(entry));
                                return;
                            }
                            const durEl = document.getElementById(`voice-dur-${msgId}`);
                            if (durEl && entry.durationSec > 0 && activeAudioMsgId !== msgId) {
                                durEl.innerText = formatSeconds(entry.durationSec);
                            }
                            resolve(entry);
                        };
                        probe.onerror = () => resolve(entry);
                    });
                })
                .catch(() => null);

            audioBlobCache.set(remoteUrl, entry);
            return entry.loadingPromise;
        }

        function resetVoiceUI(msgId) {
            const btn = document.getElementById(`voice-btn-${msgId}`);
            if (btn) btn.innerHTML = '▶';
            const bars = document.querySelectorAll(`#voice-wave-${msgId} .wave-bar`);
            bars.forEach(b => b.classList.remove('played'));
            const durEl = document.getElementById(`voice-dur-${msgId}`);
            if (durEl && durEl.dataset.totalDur) {
                durEl.innerText = durEl.dataset.totalDur;
            }
        }

        async function togglePlayVoiceMessage(msgId, remoteUrl) {
            const btn = document.getElementById(`voice-btn-${msgId}`);
            const durEl = document.getElementById(`voice-dur-${msgId}`);

            // If clicking the currently playing message -> pause cleanly
            if (activeAudioPlayer && activeAudioMsgId === msgId) {
                if (!activeAudioPlayer.paused) {
                    activeAudioPlayer.pause();
                    if (btn) btn.innerHTML = '▶';
                    if (activeAnimFrame) cancelAnimationFrame(activeAnimFrame);
                    return;
                } else {
                    await activeAudioPlayer.play();
                    if (btn) btn.innerHTML = '⏸';
                    animateVoiceProgress(msgId);
                    return;
                }
            }

            // Stop any other playing voice message
            if (activeAudioPlayer) {
                activeAudioPlayer.pause();
                if (activeAnimFrame) cancelAnimationFrame(activeAnimFrame);
                if (activeAudioMsgId) resetVoiceUI(activeAudioMsgId);
            }

            // Ensure audio is completely downloaded into RAM Blob BEFORE starting playback
            if (btn) btn.innerHTML = '⏳';
            const cached = await preloadAudioBlob(remoteUrl, msgId);
            const playableSrc = (cached && cached.blobUrl) ? cached.blobUrl : remoteUrl;

            const audio = new Audio(playableSrc);
            audio.preload = 'auto';
            activeAudioPlayer = audio;
            activeAudioMsgId = msgId;

            const totalDur = (cached && cached.durationSec > 0) ? cached.durationSec : 0;
            if (durEl && totalDur > 0) {
                durEl.dataset.totalDur = formatSeconds(totalDur);
            }

            audio.onended = () => {
                resetVoiceUI(msgId);
                activeAudioPlayer = null;
                activeAudioMsgId = null;
                if (activeAnimFrame) cancelAnimationFrame(activeAnimFrame);
            };

            try {
                await audio.play();
                if (btn) btn.innerHTML = '⏸';
                animateVoiceProgress(msgId, totalDur);
            } catch (err) {
                if (btn) btn.innerHTML = '▶';
            }
        }

        function animateVoiceProgress(msgId, knownDuration = 0) {
            const step = () => {
                if (!activeAudioPlayer || activeAudioMsgId !== msgId || activeAudioPlayer.paused) return;
                const dur = (isFinite(activeAudioPlayer.duration) && activeAudioPlayer.duration > 0)
                    ? activeAudioPlayer.duration
                    : knownDuration;
                const cur = activeAudioPlayer.currentTime || 0;
                const ratio = dur > 0 ? Math.min(1, cur / dur) : 0;

                const bars = document.querySelectorAll(`#voice-wave-${msgId} .wave-bar`);
                const activeCount = Math.round(ratio * bars.length);
                bars.forEach((b, idx) => {
                    b.classList.toggle('played', idx < activeCount);
                });

                const durEl = document.getElementById(`voice-dur-${msgId}`);
                if (durEl) {
                    const remaining = dur > 0 ? Math.max(0, dur - cur) : cur;
                    durEl.innerText = formatSeconds(remaining);
                }

                activeAnimFrame = requestAnimationFrame(step);
            };
            activeAnimFrame = requestAnimationFrame(step);
        }

        // =========================================================================
        // VOICE RECORDING -> LISTEN & REVIEW -> SEND OR DISCARD
        // =========================================================================
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let keepRecordingForReview = true;
        let recordTimerInterval = null;
        let recordSeconds = 0;

        let pendingVoiceBlob = null;
        let pendingVoiceExt = 'webm';
        let pendingVoiceUrl = null;
        let reviewAudioObj = null;

        async function toggleVoiceRecord() {
            if (!isRecording) {
                discardReviewedVoice();
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
                        ? 'audio/webm;codecs=opus'
                        : (MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '');
                    mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
                    audioChunks = [];
                    keepRecordingForReview = true;

                    mediaRecorder.ondataavailable = event => {
                        if (event.data && event.data.size > 0) audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        stream.getTracks().forEach(track => track.stop());
                        clearInterval(recordTimerInterval);
                        document.getElementById('recordingBanner').classList.remove('active');
                        document.getElementById('voiceRecordBtn').classList.remove('recording');

                        if (!keepRecordingForReview || audioChunks.length === 0) return;

                        const blobType = mediaRecorder.mimeType || 'audio/webm';
                        pendingVoiceExt = blobType.includes('mp4') ? 'm4a' : 'webm';
                        pendingVoiceBlob = new Blob(audioChunks, { type: blobType });
                        pendingVoiceUrl = URL.createObjectURL(pendingVoiceBlob);

                        document.getElementById('reviewDurationText').innerText = formatSeconds(recordSeconds);
                        document.getElementById('reviewPlayBtn').innerText = '▶';
                        document.getElementById('voiceReviewBanner').classList.add('active');
                    };

                    mediaRecorder.start(200);
                    isRecording = true;
                    recordSeconds = 0;
                    document.getElementById('recordingTimerText').innerText = '0:00';
                    document.getElementById('recordingBanner').classList.add('active');
                    document.getElementById('voiceRecordBtn').classList.add('recording');

                    recordTimerInterval = setInterval(() => {
                        recordSeconds += 1;
                        document.getElementById('recordingTimerText').innerText = formatSeconds(recordSeconds);
                    }, 1000);
                } catch (err) {
                    alert('សូមអនុញ្ញាតឱ្យប្រើ Microphone ដើម្បីថតសំឡេង!');
                }
            } else {
                stopRecordingForReview();
            }
        }

        function stopRecordingForReview() {
            if (mediaRecorder && isRecording) {
                keepRecordingForReview = true;
                mediaRecorder.stop();
                isRecording = false;
            }
        }

        function cancelVoiceRecording() {
            if (mediaRecorder && isRecording) {
                keepRecordingForReview = false;
                mediaRecorder.stop();
                isRecording = false;
            }
        }

        function toggleReviewAudioPlay() {
            if (!pendingVoiceUrl) return;
            const btn = document.getElementById('reviewPlayBtn');
            if (reviewAudioObj && !reviewAudioObj.paused) {
                reviewAudioObj.pause();
                btn.innerText = '▶';
                return;
            }
            if (!reviewAudioObj) {
                reviewAudioObj = new Audio(pendingVoiceUrl);
                reviewAudioObj.onended = () => { btn.innerText = '▶'; };
            }
            reviewAudioObj.play().then(() => {
                btn.innerText = '⏸';
            }).catch(() => {});
        }

        function discardReviewedVoice() {
            if (reviewAudioObj) {
                reviewAudioObj.pause();
                reviewAudioObj = null;
            }
            if (pendingVoiceUrl) {
                URL.revokeObjectURL(pendingVoiceUrl);
                pendingVoiceUrl = null;
            }
            pendingVoiceBlob = null;
            const banner = document.getElementById('voiceReviewBanner');
            if (banner) banner.classList.remove('active');
        }

        async function sendReviewedVoice() {
            if (!pendingVoiceBlob || !activeFriend) return;
            const sendBtn = document.getElementById('sendReviewedVoiceBtn');
            sendBtn.disabled = true;
            sendBtn.innerText = 'កំពុងផ្ញើ...';

            const formData = new FormData();
            formData.append('sender', currentUser.email);
            formData.append('receiver', activeFriend.email);
            formData.append('mediaFile', pendingVoiceBlob, `voice-${Date.now()}.${pendingVoiceExt}`);

            try {
                const res = await fetch('/api/messages', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (data.success) {
                    discardReviewedVoice();
                    await fetchMessages(true);
                    loadConversations();
                }
            } catch (err) {
                console.error('Voice upload error:', err);
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = 'ផ្ញើ ➤';
            }
        }

        // =========================================================================
        // CONVERSATIONS & MESSAGING LOGIC
        // =========================================================================
        function isUserActivelyOnline(lastActiveRaw) {
            if (!lastActiveRaw) return false;
            const ts = Date.parse(lastActiveRaw);
            if (isNaN(ts)) return false;
            // Considered actively online ONLY if heartbeat was within the last 35 seconds
            return (Date.now() - ts) <= 35000;
        }

        function formatLastSeenStatus(lastActiveRaw) {
            if (!lastActiveRaw) return 'Offline';
            const ts = Date.parse(lastActiveRaw);
            if (isNaN(ts)) return 'Offline';
            const diffSec = Math.floor((Date.now() - ts) / 1000);
            if (diffSec <= 35) return 'Active now';
            const diffMin = Math.floor(diffSec / 60);
            if (diffMin < 60) return `Active ${diffMin}m ago`;
            const diffHr = Math.floor(diffMin / 60);
            if (diffHr < 24) return `Active ${diffHr}h ago`;
            return 'Offline';
        }

        async function sendOnlineHeartbeat() {
            if (!currentUser || document.visibilityState === 'hidden') return;
            try {
                await fetch('/api/presence/ping', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentUser.email })
                });
            } catch (e) {}
        }

        async function refreshActiveFriendStatus() {
            if (!activeFriend) return;
            try {
                const res = await fetch(`/api/user-profile?email=${encodeURIComponent(activeFriend.email)}&viewerEmail=${encodeURIComponent(currentUser.email)}`);
                const data = await res.json();
                if (data.success && data.user) {
                    const online = isUserActivelyOnline(data.user.last_active);
                    const dotEl = document.getElementById('activeChatOnlineDot');
                    const statusEl = document.getElementById('activeChatStatus');
                    if (dotEl) dotEl.classList.toggle('is-online', online);
                    if (statusEl) statusEl.innerText = formatLastSeenStatus(data.user.last_active);
                }
            } catch (e) {}
        }

        if (!currentUser) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('userBadge').innerText = `${currentUser.first_name || ''} ${currentUser.last_name || ''}`;
            sendOnlineHeartbeat();
            setInterval(sendOnlineHeartbeat, 15000);
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    sendOnlineHeartbeat();
                    if (activeFriend) {
                        fetch('/api/mark-read', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ userEmail: currentUser.email, senderEmail: activeFriend.email })
                        }).catch(() => {});
                    }
                }
            });
            loadConversations();
        }

        async function loadConversations() {
            try {
                const res = await fetch(`/api/chat-conversations?email=${encodeURIComponent(currentUser.email)}`);
                const data = await res.json();
                if (data.success && Array.isArray(data.conversations)) {
                    allConversations = data.conversations;
                    renderContacts(allConversations);

                    const urlParams = new URLSearchParams(window.location.search);
                    const targetEmail = urlParams.get('chat') || urlParams.get('user');
                    if (targetEmail && !activeFriend) {
                        const found = allConversations.find(f => f.email === targetEmail);
                        if (found) {
                            openChat(found);
                        } else {
                            const uRes = await fetch(`/api/user-profile?email=${encodeURIComponent(targetEmail)}&viewerEmail=${encodeURIComponent(currentUser.email)}`);
                            const uData = await uRes.json();
                            if (uData.success && uData.user) {
                                openChat(uData.user);
                            }
                        }
                    }
                }
            } catch (err) {
                console.error('Error loading conversations:', err);
                document.getElementById('contactsList').innerHTML = '<div style="padding: 20px; text-align: center; color: #65676b;">Unable to load conversations.</div>';
            }
        }

        async function handleSearch(keyword) {
            const q = keyword.trim();
            if (!q) {
                renderContacts(allConversations);
                return;
            }
            try {
                const res = await fetch(`/api/search-users?email=${encodeURIComponent(currentUser.email)}&keyword=${encodeURIComponent(q)}`);
                const data = await res.json();
                if (data.success && Array.isArray(data.users)) {
                    renderContacts(data.users);
                }
            } catch (err) {
                console.error('Search error:', err);
            }
        }

        function renderContacts(list) {
            const container = document.getElementById('contactsList');
            if (!list || list.length === 0) {
                container.innerHTML = '<div style="padding: 20px; text-align: center; color: #65676b;">No conversations found.</div>';
                return;
            }
            container.innerHTML = list.map(person => {
                const isActive = activeFriend && activeFriend.email === person.email ? 'active' : '';
                const avatar = person.profile_pic || 'https://via.placeholder.com/48';
                const subtitle = person.last_message || person.email;
                const safeData = JSON.stringify({
                    email: person.email,
                    first_name: person.first_name,
                    last_name: person.last_name,
                    profile_pic: person.profile_pic
                }).replace(/'/g, "&#39;");

                const onlineClass = isUserActivelyOnline(person.last_active) ? 'is-online' : '';
                return `
                    <div class="contact-item ${isActive}" onclick='openChat(${safeData})'>
                        <div class="contact-avatar-wrap">
                            <img src="${avatar}" class="contact-avatar">
                            <span class="contact-online-dot ${onlineClass}"></span>
                        </div>
                        <div class="contact-info">
                            <div class="contact-name notranslate" translate="no">${person.first_name || ''} ${person.last_name || ''}</div>
                            <div class="contact-sub notranslate" translate="no">${escapeHtml(subtitle)}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function openChat(friend) {
            activeFriend = friend;
            lastMessagesSignature = '';
            document.getElementById('activeChatName').innerText = `${friend.first_name || ''} ${friend.last_name || ''}`;
            const onlineNow = isUserActivelyOnline(friend.last_active);
            document.getElementById('activeChatOnlineDot').classList.toggle('is-online', onlineNow);
            document.getElementById('activeChatStatus').innerText = formatLastSeenStatus(friend.last_active);
            document.getElementById('activeChatAvatar').src = friend.profile_pic || 'https://via.placeholder.com/38';
            document.getElementById('chatInputBar').style.display = 'flex';
            refreshActiveFriendStatus();

            if (window.innerWidth <= 768) {
                document.getElementById('mainTopNav').classList.add('chat-open-hide');
                document.getElementById('contactsPanel').classList.add('hidden');
                document.getElementById('chatPanel').classList.remove('hidden');
            } else {
                document.getElementById('chatPanel').classList.remove('hidden');
            }

            renderContacts(allConversations);
            await fetchMessages(true);

            fetch('/api/mark-read', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userEmail: currentUser.email, senderEmail: friend.email })
            }).catch(() => {});

            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(() => { fetchMessages(false); refreshActiveFriendStatus(); }, 3000);
        }

        function showContactsMobile() {
            if (activeAudioPlayer) {
                activeAudioPlayer.pause();
                activeAudioPlayer = null;
                activeAudioMsgId = null;
            }
            document.getElementById('mainTopNav').classList.remove('chat-open-hide');
            document.getElementById('contactsPanel').classList.remove('hidden');
            document.getElementById('chatPanel').classList.add('hidden');
            if (pollInterval) clearInterval(pollInterval);
            loadConversations();
        }

        async function fetchMessages(forceScroll = false) {
            if (!activeFriend) return;
            try {
                const res = await fetch(`/api/messages?user1=${encodeURIComponent(currentUser.email)}&user2=${encodeURIComponent(activeFriend.email)}`);
                const data = await res.json();
                if (data.success && Array.isArray(data.messages)) {
                    const sig = data.messages.map(m => `${m.id}:${m.is_read}`).join('|');
                    if (sig !== lastMessagesSignature || forceScroll) {
                        lastMessagesSignature = sig;
                        renderMessages(data.messages, forceScroll);
                    }
                }
            } catch (err) {
                console.error('Error fetching messages:', err);
            }
        }

        function renderMessages(messages, forceScroll) {
            const box = document.getElementById('chatMessages');
            if (messages.length === 0) {
                box.innerHTML = '<div class="empty-state"><div>សួស្តី! ចាប់ផ្តើមផ្ញើសារឥឡូវនេះ 👋</div></div>';
                return;
            }

            const wasAtBottom = forceScroll || (box.scrollHeight - box.scrollTop <= box.clientHeight + 90);
            const friendAvatar = (activeFriend && activeFriend.profile_pic) ? activeFriend.profile_pic : 'https://via.placeholder.com/28';
            let lastTimeGroup = '';
            let lastSeenSentMsgId = null;
            messages.forEach(m => {
                if (m.sender_email === currentUser.email && (m.is_read === true || m.is_read === 1 || m.is_read === 't')) {
                    lastSeenSentMsgId = m.id;
                }
            });

            const audioUrlsToPreload = [];

            box.innerHTML = messages.map(m => {
                const isSent = m.sender_email === currentUser.email;
                const rowClass = isSent ? 'sent' : 'received';
                const timeStr = m.created_at ? new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
                let timeDividerHtml = '';
                if (timeStr && timeStr !== lastTimeGroup) {
                    timeDividerHtml = `<div class="time-divider">${timeStr}</div>`;
                    lastTimeGroup = timeStr;
                }

                const forwardBtnHtml = `
                    <button type="button" class="forward-circle-btn" onclick="openForwardModal(${m.id}, '${encodeURIComponent(m.message || '')}', '${encodeURIComponent(m.media_url || '')}', '${m.message_type || 'text'}')" title="Forward">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M14 9V5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z"/></svg>
                    </button>
                `;

                let contentHtml = '';
                const isVideo = m.media_url && (m.message_type === 'video' || m.media_url.match(/\.(mp4|webm|mov)$/i) && m.message_type !== 'audio');
                const isAudio = m.media_url && (m.message_type === 'audio' || m.message === '[Voice Message]' || m.media_url.match(/\.(mp3|wav|ogg|m4a)$/i));

                if (isAudio) {
                    audioUrlsToPreload.push({ url: m.media_url, id: m.id });
                    const cached = audioBlobCache.get(m.media_url);
                    const initialDur = (cached && cached.durationSec > 0) ? formatSeconds(cached.durationSec) : '0:00';
                    const barsHtml = WAVEFORM_BARS.map(h => `<span class="wave-bar" style="height:${Math.round(h * 0.22)}px;"></span>`).join('');

                    const pillHtml = `
                        <div class="voice-pill-box">
                            <button type="button" class="voice-play-btn" id="voice-btn-${m.id}" onclick="togglePlayVoiceMessage(${m.id}, '${m.media_url}')">▶</button>
                            <div class="voice-waveform" id="voice-wave-${m.id}" onclick="togglePlayVoiceMessage(${m.id}, '${m.media_url}')">
                                ${barsHtml}
                            </div>
                            <span class="voice-duration-text" id="voice-dur-${m.id}" data-total-dur="${initialDur}">${initialDur}</span>
                        </div>
                    `;
                    contentHtml = isSent ? `${forwardBtnHtml}${pillHtml}` : `${pillHtml}${forwardBtnHtml}`;
                } else if (m.media_url) {
                    const mediaTag = isVideo
                        ? `<div class="msg-media-card"><video src="${m.media_url}" controls playsinline webkit-playsinline preload="metadata"></video></div>`
                        : `<div class="msg-media-card"><img src="${m.media_url}" onclick="window.open('${m.media_url}', '_blank')"></div>`;
                    contentHtml = isSent ? `${forwardBtnHtml}${mediaTag}` : `${mediaTag}${forwardBtnHtml}`;
                } else if (m.message === '👍') {
                    contentHtml = `<div class="big-thumb-sticker">👍</div>`;
                } else if (m.message) {
                    contentHtml = `<div class="msg-bubble notranslate" translate="no">${escapeHtml(m.message)}</div>`;
                }

                const leftAvatarHtml = !isSent ? `<img src="${friendAvatar}" class="msg-sender-avatar">` : '';
                const seenHtml = (isSent && m.id === lastSeenSentMsgId) ? `<img src="${friendAvatar}" class="msg-seen-avatar" title="Seen">` : '';

                return `
                    ${timeDividerHtml}
                    <div class="msg-row ${rowClass}">
                        ${leftAvatarHtml}
                        ${contentHtml}
                        ${seenHtml}
                    </div>
                `;
            }).join('');

            // Pre-download all voice messages into memory immediately so clicking Play is instant and stutter-free
            audioUrlsToPreload.forEach(item => preloadAudioBlob(item.url, item.id));

            if (wasAtBottom) {
                box.scrollTop = box.scrollHeight;
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateSendOrThumbIcon() {
            const val = document.getElementById('messageTextInput').value.trim();
            const btn = document.getElementById('primaryActionBtn');
            if (val.length > 0) {
                btn.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>`;
            } else {
                btn.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>`;
            }
        }

        function handlePrimaryActionBtn() {
            const input = document.getElementById('messageTextInput');
            const text = input.value.trim();
            if (text.length > 0) {
                sendTextMessage(text);
            } else {
                sendTextMessage('👍');
            }
        }

        function toggleEmojiPopup(event) {
            event.stopPropagation();
            document.getElementById('emojiPopupBar').classList.toggle('show');
        }

        function insertEmoji(em) {
            const inp = document.getElementById('messageTextInput');
            inp.value += em;
            inp.focus();
            updateSendOrThumbIcon();
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#emojiPopupBar') && !e.target.closest('.emoji-inside-btn')) {
                document.getElementById('emojiPopupBar').classList.remove('show');
            }
        });

        async function sendTextMessage(customText) {
            const input = document.getElementById('messageTextInput');
            const text = (customText !== undefined ? customText : input.value).trim();
            if (!text || !activeFriend) return;

            input.value = '';
            updateSendOrThumbIcon();
            document.getElementById('emojiPopupBar').classList.remove('show');

            try {
                const res = await fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sender: currentUser.email,
                        receiver: activeFriend.email,
                        message: text
                    })
                });
                const data = await res.json();
                if (data.success) {
                    await fetchMessages(true);
                    loadConversations();
                }
            } catch (err) {
                console.error('Send error:', err);
            }
        }

        // =========================================================================
        // MULTI-FILE MEDIA STAGING QUEUE (Send Immediately OR Click "Edit")
        // =========================================================================
        let stagedMediaItems = []; // [{ id, fileOrBlob, name, previewUrl, isImage }]
        let editingStagedIndex = -1;

        function sendMediaMessage(fileInput) {
            const files = Array.from(fileInput.files || []);
            if (files.length === 0 || !activeFriend) return;
            fileInput.value = '';

            files.forEach(file => {
                const isImage = !!(file.type && file.type.startsWith('image/'));
                const previewUrl = URL.createObjectURL(file);
                stagedMediaItems.push({
                    id: Date.now() + Math.random(),
                    fileOrBlob: file,
                    name: file.name || (isImage ? 'photo.jpg' : 'video.mp4'),
                    previewUrl,
                    isImage
                });
            });

            renderStagedMediaTray();
        }

        function renderStagedMediaTray() {
            const tray = document.getElementById('mediaStagingTray');
            const scrollEl = document.getElementById('stagingItemsScroll');
            const sendBtn = document.getElementById('sendStagedMediaBtn');
            if (!tray || !scrollEl) return;

            if (stagedMediaItems.length === 0) {
                tray.classList.remove('active');
                scrollEl.innerHTML = '';
                return;
            }

            tray.classList.add('active');
            sendBtn.innerText = stagedMediaItems.length > 1
                ? `Send (${stagedMediaItems.length}) ➤`
                : 'Send ➤';

            scrollEl.innerHTML = stagedMediaItems.map((item, idx) => `
                <div class="staging-thumb-card">
                    ${item.isImage
                        ? `<img src="${item.previewUrl}">`
                        : `<video src="${item.previewUrl}" muted playsinline></video>`
                    }
                    <button type="button" class="staging-remove-btn" onclick="removeStagedMedia(${idx})" title="លុប">×</button>
                    ${item.isImage
                        ? `<button type="button" class="staging-edit-badge" onclick="editStagedPhoto(${idx})">✏️ Edit</button>`
                        : `<span style="position:absolute; bottom:4px; left:4px; background:rgba(0,0,0,0.7); color:#fff; font-size:10px; padding:2px 6px; border-radius:6px;">🎬 Video</span>`
                    }
                </div>
            `).join('');
        }

        function removeStagedMedia(idx) {
            const removed = stagedMediaItems.splice(idx, 1)[0];
            if (removed && removed.previewUrl) URL.revokeObjectURL(removed.previewUrl);
            renderStagedMediaTray();
        }

        function clearStagedMedia() {
            stagedMediaItems.forEach(it => { if (it.previewUrl) URL.revokeObjectURL(it.previewUrl); });
            stagedMediaItems = [];
            renderStagedMediaTray();
        }

        function editStagedPhoto(idx) {
            const item = stagedMediaItems[idx];
            if (!item || !item.isImage) return;
            editingStagedIndex = idx;
            openPhotoEditor(item.fileOrBlob);
        }

        async function sendAllStagedMedia() {
            if (stagedMediaItems.length === 0 || !activeFriend) return;
            const sendBtn = document.getElementById('sendStagedMediaBtn');
            sendBtn.disabled = true;
            sendBtn.innerText = 'កំពុងផ្ញើ...';

            const itemsToSend = [...stagedMediaItems];
            clearStagedMedia();

            try {
                for (let i = 0; i < itemsToSend.length; i++) {
                    const it = itemsToSend[i];
                    await uploadAndSendChatFile(it.fileOrBlob, it.name);
                }
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = 'Send ➤';
            }
        }

        async function uploadAndSendChatFile(fileOrBlob, fileName) {
            if (!activeFriend) return;
            const formData = new FormData();
            formData.append('sender', currentUser.email);
            formData.append('receiver', activeFriend.email);
            formData.append('mediaFile', fileOrBlob, fileName);

            try {
                const res = await fetch('/api/messages', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (data.success) {
                    await fetchMessages(true);
                    loadConversations();
                } else {
                    alert(data.error || 'Failed to send media.');
                }
            } catch (err) {
                console.error('Media upload error:', err);
            }
        }

        // =========================================================================
        // INTERACTIVE PHOTO EDITOR (CROP + FREEHAND PEN + DRAGGABLE TEXT)
        // =========================================================================
        let editorBaseImg = null;
        let editorHistoryStack = []; // snapshots of base image (after crops)
        let editorStrokes = [];      // [{ color, size, points: [{x, y}] }]
        let editorTexts = [];        // [{ text, color, x, y, fontSize }]
        let editorMode = 'crop';     // 'crop' | 'pen' | 'text'
        let editorColor = '#ff3b30';
        let editorBrushSize = 5;

        let cropBox = { x: 0, y: 0, w: 0, h: 0 };
        let activeDragHandle = null; // 'move' | 'nw' | 'ne' | 'sw' | 'se'
        let dragStartPt = { x: 0, y: 0 };
        let dragStartCrop = null;

        let isDrawingStroke = false;
        let currentStroke = null;
        let draggingTextIdx = -1;

        function openPhotoEditor(file) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    editorBaseImg = img;
                    editorHistoryStack = [];
                    editorStrokes = [];
                    editorTexts = [];
                    initCanvasWithImage(img);
                    document.getElementById('photoEditorModal').classList.add('active');
                    setEditorMode('crop');
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

        function closePhotoEditor() {
            document.getElementById('photoEditorModal').classList.remove('active');
            editorBaseImg = null;
        }

        function initCanvasWithImage(img) {
            const canvas = document.getElementById('photoEditorCanvas');
            const maxW = Math.min(window.innerWidth - 24, 900);
            const maxH = Math.min(window.innerHeight - 190, 900);
            const scale = Math.min(maxW / img.width, maxH / img.height, 1);

            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);

            cropBox = {
                x: Math.round(canvas.width * 0.08),
                y: Math.round(canvas.height * 0.08),
                w: Math.round(canvas.width * 0.84),
                h: Math.round(canvas.height * 0.84)
            };
            renderEditorCanvas();
        }

        function setEditorMode(mode) {
            editorMode = mode;
            ['crop', 'pen', 'text'].forEach(m => {
                const b = document.getElementById(`toolBtn-${m}`);
                if (b) b.classList.toggle('active', m === mode);
            });

            const sub = document.getElementById('editorSubToolbar');
            const hint = document.getElementById('editorHintText');
            const colors = ['#ff3b30', '#ffcc00', '#34c759', '#007aff', '#ffffff', '#000000'];

            if (mode === 'crop') {
                hint.innerText = 'អូសជ្រុងប្រអប់ដើម្បីកាត់រូបភាព រួចចុច "✓ អនុវត្តការកាត់"';
                sub.innerHTML = `
                    <button type="button" onclick="setCropAspect('free')" style="background:#2c2c2e; color:#fff; border:1px solid #555; padding:5px 11px; border-radius:14px; font-size:12px; font-weight:700; cursor:pointer;">សេរី (Free)</button>
                    <button type="button" onclick="setCropAspect('1:1')" style="background:#2c2c2e; color:#fff; border:1px solid #555; padding:5px 11px; border-radius:14px; font-size:12px; font-weight:700; cursor:pointer;">1:1 ការ៉េ</button>
                    <button type="button" onclick="setCropAspect('4:5')" style="background:#2c2c2e; color:#fff; border:1px solid #555; padding:5px 11px; border-radius:14px; font-size:12px; font-weight:700; cursor:pointer;">4:5 បញ្ឈរ</button>
                    <button type="button" onclick="applyCropSelection()" style="background:#34c759; color:#fff; border:none; padding:6px 14px; border-radius:14px; font-size:12.5px; font-weight:700; cursor:pointer;">✓ អនុវត្តការកាត់ (Apply Crop)</button>
                `;
            } else if (mode === 'pen') {
                hint.innerText = 'ប្រើម្រាមដៃគូរលើរូបភាពដោយសេរី';
                const swatches = colors.map(c => `<span class="color-swatch ${editorColor === c ? 'selected' : ''}" style="background:${c};" onclick="selectEditorColor('${c}')"></span>`).join('');
                sub.innerHTML = `
                    ${swatches}
                    <button type="button" onclick="editorBrushSize = editorBrushSize === 5 ? 11 : 5; this.innerText = editorBrushSize === 5 ? '🖌️ តូច' : '🖌️ ធំ';" style="background:#2c2c2e; color:#fff; border:1px solid #555; padding:5px 11px; border-radius:14px; font-size:12px; font-weight:700; cursor:pointer;">${editorBrushSize === 5 ? '🖌️ តូច' : '🖌️ ធំ'}</button>
                `;
            } else if (mode === 'text') {
                hint.innerText = 'ចុច "+ បន្ថែមអក្សរ" រួចអូសផ្លាស់ប្តូរទីតាំងអក្សរលើរូបភាព';
                const swatches = colors.map(c => `<span class="color-swatch ${editorColor === c ? 'selected' : ''}" style="background:${c};" onclick="selectEditorColor('${c}')"></span>`).join('');
                sub.innerHTML = `
                    ${swatches}
                    <button type="button" onclick="promptAddEditorText()" style="background:#1877f2; color:#fff; border:none; padding:6px 14px; border-radius:16px; font-size:12.5px; font-weight:700; cursor:pointer;">+ បន្ថែមអក្សរ (Add Text)</button>
                `;
            }
            renderEditorCanvas();
        }

        function selectEditorColor(c) {
            editorColor = c;
            if (editorTexts.length > 0 && editorMode === 'text') {
                editorTexts[editorTexts.length - 1].color = c;
            }
            setEditorMode(editorMode);
        }

        function setCropAspect(ratioType) {
            const canvas = document.getElementById('photoEditorCanvas');
            if (ratioType === 'free') {
                cropBox = {
                    x: Math.round(canvas.width * 0.08),
                    y: Math.round(canvas.height * 0.08),
                    w: Math.round(canvas.width * 0.84),
                    h: Math.round(canvas.height * 0.84)
                };
            } else if (ratioType === '1:1') {
                const side = Math.round(Math.min(canvas.width, canvas.height) * 0.8);
                cropBox = {
                    x: Math.round((canvas.width - side) / 2),
                    y: Math.round((canvas.height - side) / 2),
                    w: side,
                    h: side
                };
            } else if (ratioType === '4:5') {
                let h = Math.round(canvas.height * 0.85);
                let w = Math.round(h * 0.8);
                if (w > canvas.width * 0.9) {
                    w = Math.round(canvas.width * 0.9);
                    h = Math.round(w * 1.25);
                }
                cropBox = {
                    x: Math.round((canvas.width - w) / 2),
                    y: Math.round((canvas.height - h) / 2),
                    w,
                    h
                };
            }
            renderEditorCanvas();
        }

        function applyCropSelection() {
            const canvas = document.getElementById('photoEditorCanvas');
            if (!editorBaseImg || cropBox.w < 20 || cropBox.h < 20) return;

            // Render clean image + existing drawings/texts without crop overlay first
            renderEditorCanvas(true);

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = cropBox.w;
            tempCanvas.height = cropBox.h;
            const tCtx = tempCanvas.getContext('2d');
            tCtx.drawImage(canvas, cropBox.x, cropBox.y, cropBox.w, cropBox.h, 0, 0, cropBox.w, cropBox.h);

            editorHistoryStack.push({
                img: editorBaseImg,
                strokes: JSON.parse(JSON.stringify(editorStrokes)),
                texts: JSON.parse(JSON.stringify(editorTexts))
            });

            const croppedImg = new Image();
            croppedImg.onload = () => {
                editorBaseImg = croppedImg;
                editorStrokes = [];
                editorTexts = [];
                initCanvasWithImage(croppedImg);
            };
            croppedImg.src = tempCanvas.toDataURL('image/png');
        }

        function promptAddEditorText() {
            const txt = prompt('សរសេរអក្សរដែលចង់ដាក់លើរូបភាព៖');
            if (!txt || !txt.trim()) return;
            const canvas = document.getElementById('photoEditorCanvas');
            editorTexts.push({
                text: txt.trim(),
                color: editorColor,
                x: Math.round(canvas.width / 2),
                y: Math.round(canvas.height / 2),
                fontSize: Math.max(22, Math.round(canvas.width * 0.065))
            });
            renderEditorCanvas();
        }

        function undoEditorAction() {
            if (editorMode === 'pen' && editorStrokes.length > 0) {
                editorStrokes.pop();
                renderEditorCanvas();
                return;
            }
            if (editorMode === 'text' && editorTexts.length > 0) {
                editorTexts.pop();
                renderEditorCanvas();
                return;
            }
            if (editorStrokes.length > 0) {
                editorStrokes.pop();
                renderEditorCanvas();
            } else if (editorTexts.length > 0) {
                editorTexts.pop();
                renderEditorCanvas();
            } else if (editorHistoryStack.length > 0) {
                const prev = editorHistoryStack.pop();
                editorBaseImg = prev.img;
                editorStrokes = prev.strokes;
                editorTexts = prev.texts;
                initCanvasWithImage(editorBaseImg);
            }
        }

        function renderEditorCanvas(exportClean = false) {
            const canvas = document.getElementById('photoEditorCanvas');
            if (!canvas || !editorBaseImg) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Base Image
            ctx.drawImage(editorBaseImg, 0, 0, canvas.width, canvas.height);

            // 2. Pen Strokes
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            editorStrokes.forEach(st => {
                if (!st.points || st.points.length === 0) return;
                ctx.strokeStyle = st.color;
                ctx.lineWidth = st.size;
                ctx.beginPath();
                ctx.moveTo(st.points[0].x, st.points[0].y);
                for (let i = 1; i < st.points.length; i++) {
                    ctx.lineTo(st.points[i].x, st.points[i].y);
                }
                ctx.stroke();
            });

            // 3. Draggable Text Overlays
            editorTexts.forEach(item => {
                ctx.font = `bold ${item.fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.lineWidth = Math.max(3, Math.round(item.fontSize * 0.12));
                ctx.strokeStyle = item.color === '#000000' ? '#ffffff' : '#000000';
                ctx.strokeText(item.text, item.x, item.y);
                ctx.fillStyle = item.color;
                ctx.fillText(item.text, item.x, item.y);
            });

            // 4. Crop Overlay Frame (hidden during final export)
            if (!exportClean && editorMode === 'crop') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.52)';
                ctx.fillRect(0, 0, canvas.width, cropBox.y);
                ctx.fillRect(0, cropBox.y + cropBox.h, canvas.width, canvas.height - (cropBox.y + cropBox.h));
                ctx.fillRect(0, cropBox.y, cropBox.x, cropBox.h);
                ctx.fillRect(cropBox.x + cropBox.w, cropBox.y, canvas.width - (cropBox.x + cropBox.w), cropBox.h);

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(cropBox.x, cropBox.y, cropBox.w, cropBox.h);

                // Corner Handles
                const hs = 14;
                ctx.fillStyle = '#1877f2';
                const corners = [
                    [cropBox.x, cropBox.y],
                    [cropBox.x + cropBox.w, cropBox.y],
                    [cropBox.x, cropBox.y + cropBox.h],
                    [cropBox.x + cropBox.w, cropBox.y + cropBox.h]
                ];
                corners.forEach(([cx, cy]) => {
                    ctx.fillRect(cx - hs / 2, cy - hs / 2, hs, hs);
                    ctx.strokeRect(cx - hs / 2, cy - hs / 2, hs, hs);
                });
            }
        }

        function getCanvasCoords(e) {
            const canvas = document.getElementById('photoEditorCanvas');
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / (rect.width || 1);
            const scaleY = canvas.height / (rect.height || 1);
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        (function initCanvasPointerHandlers() {
            const canvas = document.getElementById('photoEditorCanvas');
            if (!canvas) return;

            canvas.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                const pt = getCanvasCoords(e);

                if (editorMode === 'crop') {
                    const hitR = 26;
                    if (Math.hypot(pt.x - cropBox.x, pt.y - cropBox.y) <= hitR) activeDragHandle = 'nw';
                    else if (Math.hypot(pt.x - (cropBox.x + cropBox.w), pt.y - cropBox.y) <= hitR) activeDragHandle = 'ne';
                    else if (Math.hypot(pt.x - cropBox.x, pt.y - (cropBox.y + cropBox.h)) <= hitR) activeDragHandle = 'sw';
                    else if (Math.hypot(pt.x - (cropBox.x + cropBox.w), pt.y - (cropBox.y + cropBox.h)) <= hitR) activeDragHandle = 'se';
                    else if (pt.x >= cropBox.x && pt.x <= cropBox.x + cropBox.w && pt.y >= cropBox.y && pt.y <= cropBox.y + cropBox.h) {
                        activeDragHandle = 'move';
                    }
                    dragStartPt = pt;
                    dragStartCrop = { ...cropBox };
                } else if (editorMode === 'pen') {
                    isDrawingStroke = true;
                    currentStroke = { color: editorColor, size: editorBrushSize, points: [pt] };
                    editorStrokes.push(currentStroke);
                    renderEditorCanvas();
                } else if (editorMode === 'text') {
                    draggingTextIdx = -1;
                    for (let i = editorTexts.length - 1; i >= 0; i--) {
                        const t = editorTexts[i];
                        if (Math.abs(pt.x - t.x) <= 110 && Math.abs(pt.y - t.y) <= 36) {
                            draggingTextIdx = i;
                            dragStartPt = pt;
                            break;
                        }
                    }
                }
            });

            canvas.addEventListener('pointermove', (e) => {
                if (!activeDragHandle && !isDrawingStroke && draggingTextIdx === -1) return;
                e.preventDefault();
                const pt = getCanvasCoords(e);

                if (editorMode === 'crop' && activeDragHandle && dragStartCrop) {
                    const dx = pt.x - dragStartPt.x;
                    const dy = pt.y - dragStartPt.y;
                    const minSize = 40;

                    if (activeDragHandle === 'move') {
                        cropBox.x = Math.max(0, Math.min(canvas.width - cropBox.w, dragStartCrop.x + dx));
                        cropBox.y = Math.max(0, Math.min(canvas.height - cropBox.h, dragStartCrop.y + dy));
                    } else if (activeDragHandle === 'se') {
                        cropBox.w = Math.max(minSize, Math.min(canvas.width - dragStartCrop.x, dragStartCrop.w + dx));
                        cropBox.h = Math.max(minSize, Math.min(canvas.height - dragStartCrop.y, dragStartCrop.h + dy));
                    } else if (activeDragHandle === 'nw') {
                        const newX = Math.max(0, Math.min(dragStartCrop.x + dragStartCrop.w - minSize, dragStartCrop.x + dx));
                        const newY = Math.max(0, Math.min(dragStartCrop.y + dragStartCrop.h - minSize, dragStartCrop.y + dy));
                        cropBox.w = (dragStartCrop.x + dragStartCrop.w) - newX;
                        cropBox.h = (dragStartCrop.y + dragStartCrop.h) - newY;
                        cropBox.x = newX;
                        cropBox.y = newY;
                    } else if (activeDragHandle === 'ne') {
                        const newY = Math.max(0, Math.min(dragStartCrop.y + dragStartCrop.h - minSize, dragStartCrop.y + dy));
                        cropBox.w = Math.max(minSize, Math.min(canvas.width - dragStartCrop.x, dragStartCrop.w + dx));
                        cropBox.h = (dragStartCrop.y + dragStartCrop.h) - newY;
                        cropBox.y = newY;
                    } else if (activeDragHandle === 'sw') {
                        const newX = Math.max(0, Math.min(dragStartCrop.x + dragStartCrop.w - minSize, dragStartCrop.x + dx));
                        cropBox.w = (dragStartCrop.x + dragStartCrop.w) - newX;
                        cropBox.h = Math.max(minSize, Math.min(canvas.height - dragStartCrop.y, dragStartCrop.h + dy));
                        cropBox.x = newX;
                    }
                    renderEditorCanvas();
                } else if (editorMode === 'pen' && isDrawingStroke && currentStroke) {
                    currentStroke.points.push(pt);
                    renderEditorCanvas();
                } else if (editorMode === 'text' && draggingTextIdx >= 0) {
                    editorTexts[draggingTextIdx].x += (pt.x - dragStartPt.x);
                    editorTexts[draggingTextIdx].y += (pt.y - dragStartPt.y);
                    dragStartPt = pt;
                    renderEditorCanvas();
                }
            });

            const endPointer = () => {
                activeDragHandle = null;
                isDrawingStroke = false;
                currentStroke = null;
                draggingTextIdx = -1;
            };
            canvas.addEventListener('pointerup', endPointer);
            canvas.addEventListener('pointercancel', endPointer);
        })();

        function applyEditedPhotoToStage() {
            const canvas = document.getElementById('photoEditorCanvas');
            const doneBtn = document.getElementById('sendEditedPhotoBtn');
            if (!canvas || !editorBaseImg) return;

            doneBtn.disabled = true;
            renderEditorCanvas(true);

            canvas.toBlob((blob) => {
                try {
                    if (blob && editingStagedIndex >= 0 && stagedMediaItems[editingStagedIndex]) {
                        const oldItem = stagedMediaItems[editingStagedIndex];
                        if (oldItem.previewUrl) URL.revokeObjectURL(oldItem.previewUrl);
                        const newUrl = URL.createObjectURL(blob);
                        stagedMediaItems[editingStagedIndex] = {
                            ...oldItem,
                            fileOrBlob: blob,
                            name: `edited-${Date.now()}.jpg`,
                            previewUrl: newUrl
                        };
                        renderStagedMediaTray();
                    }
                    editingStagedIndex = -1;
                    closePhotoEditor();
                } finally {
                    doneBtn.disabled = false;
                }
            }, 'image/jpeg', 0.92);
        }

        // Forward Message Modal
        let forwardPayload = null;
        function openForwardModal(msgId, encText, encMedia, msgType) {
            forwardPayload = {
                message: decodeURIComponent(encText || ''),
                media_url: decodeURIComponent(encMedia || ''),
                message_type: msgType || 'text'
            };
            const listEl = document.getElementById('forwardContactsList');
            listEl.innerHTML = allConversations.map(c => `
                <div style="display:flex; align-items:center; justify-content:space-between; padding:8px 4px; border-bottom:1px solid #f0f2f5;">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <img src="${c.profile_pic || 'https://via.placeholder.com/40'}" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">
                        <div class="notranslate" translate="no" style="font-weight:700; font-size:14px;">${c.first_name || ''} ${c.last_name || ''}</div>
                    </div>
                    <button type="button" onclick="confirmForwardTo('${c.email}', this)" style="background:#1877f2; color:#fff; border:none; border-radius:16px; padding:6px 14px; font-size:12.5px; font-weight:700; cursor:pointer;">ផ្ញើ</button>
                </div>
            `).join('');
            document.getElementById('forwardModal').style.display = 'flex';
        }

        function closeForwardModal() {
            document.getElementById('forwardModal').style.display = 'none';
            forwardPayload = null;
        }

        async function confirmForwardTo(targetEmail, btnEl) {
            if (!forwardPayload) return;
            btnEl.disabled = true;
            btnEl.innerText = '✓ បានផ្ញើ';
            btnEl.style.background = '#e4e6eb';
            btnEl.style.color = '#050505';

            try {
                if (forwardPayload.media_url) {
                    const blob = await fetch(forwardPayload.media_url).then(r => r.blob());
                    const fd = new FormData();
                    fd.append('sender', currentUser.email);
                    fd.append('receiver', targetEmail);
                    fd.append('mediaFile', blob, forwardPayload.message_type === 'audio' ? 'forwarded-voice.webm' : 'forwarded-media');
                    await fetch('/api/messages', { method: 'POST', body: fd });
                } else {
                    await fetch('/api/messages', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            sender: currentUser.email,
                            receiver: targetEmail,
                            message: forwardPayload.message
                        })
                    });
                }
            } catch (e) {}
        }
    </script>
