<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camfeed - Messages</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.1); flex-shrink: 0; }
        .logo-nav { font-size: 22px; font-weight: bold; color: #1877f2; cursor: pointer; }
        .back-btn { padding: 6px 12px; background: #e4e6eb; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }

        .chat-container { flex: 1; display: flex; max-width: 1000px; width: 100%; margin: 10px auto; background: white; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); overflow: hidden; height: calc(100dvh - 70px); }
        
        .chat-sidebar { width: 340px; border-right: 1px solid #e4e6eb; display: flex; flex-direction: column; background: #fff; flex-shrink: 0; }
        .sidebar-header { padding: 15px; border-bottom: 1px solid #f0f2f5; display: flex; flex-direction: column; gap: 10px; }
        .search-input { width: 100%; padding: 8px 12px; border: 1px solid #ccd0d5; border-radius: 20px; background: #f0f2f5; outline: none; font-size: 13px; }

        .sidebar-user-list { flex: 1; overflow-y: auto; }
        .chat-user-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #f0f2f5; transition: background 0.2s; position: relative; }
        .chat-user-item:hover { background: #f2f2f2; }
        .chat-user-item.active { background: #e7f3ff; border-left: 4px solid #1877f2; }
        
        .avatar-wrapper { position: relative; flex-shrink: 0; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #ccc; }
        .online-dot { position: absolute; bottom: 2px; right: 2px; width: 12px; height: 12px; background: #31a24c; border: 2px solid white; border-radius: 50%; }

        .chat-main { flex: 1; display: flex; flex-direction: column; background: #fff; min-width: 0; position: relative; }
        .messages-list { flex: 1; padding: 15px; overflow-y: auto; background: #f7f8fa; display: flex; flex-direction: column; gap: 10px; }
        
        .msg-bubble { padding: 10px 14px; border-radius: 18px; max-width: 75%; font-size: 14px; line-height: 1.4; word-break: break-word; }
        .msg-sent { background: #1877f2; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg-received { background: #e4e6eb; color: #050505; align-self: flex-start; border-bottom-left-radius: 4px; }
        
        .chat-input-area { display: flex; flex-direction: column; background: white; border-top: 1px solid #e4e6eb; flex-shrink: 0; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
        .chat-input-row { display: flex; padding: 10px 15px; gap: 8px; align-items: center; }
        
        input[type="text"].msg-text { flex: 1; padding: 10px 14px; border: 1px solid #ccd0d5; border-radius: 20px; outline: none; font-size: 14px; }
        
        .action-icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 6px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #1877f2; }
        .action-icon-btn:hover { background: #f2f2f2; }
        
        .recording-indicator { color: #fa383e; font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 6px; flex: 1; padding-left: 5px; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        .send-btn { padding: 8px 16px; background: #1877f2; color: white; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .send-btn:hover { background: #166fe5; }
        .cancel-btn { padding: 8px 12px; background: #e4e6eb; color: #fa383e; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 13px; }

        #voicePreviewContainer { display: none; align-items: center; justify-content: space-between; background: #e7f3ff; padding: 10px 15px; border-top: 1px solid #b0d3f8; gap: 8px; }

        @media (max-width: 768px) {
            .chat-container { width: 100%; margin: 0; border-radius: 0; height: calc(100dvh - 60px); }
            .chat-sidebar { width: 100%; }
            .chat-sidebar.hidden-mobile { display: none !important; }
            .chat-main.hidden-mobile { display: none !important; }
            .chat-main { width: 100%; }
            .mobile-back-chat { display: flex !important; align-items: center; gap: 8px; font-weight: bold; color: #1877f2; cursor: pointer; border: none; background: none; font-size: 15px; padding: 0; margin-right: 10px; }
        }
        .mobile-back-chat { display: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div style="display: flex; align-items: center;">
            <button class="mobile-back-chat" id="mobileBackBtn" onclick="backToSidebar()">❮ Back</button>
            <div class="logo-nav" onclick="window.location.href='feed.html'">camfeed</div>
        </div>
        <button class="back-btn" onclick="window.location.href='feed.html'">⬅ Feed</button>
    </div>

    <div class="chat-container">
        <!-- Sidebar -->
        <div class="chat-sidebar" id="sidebarSection">
            <div class="sidebar-header">
                <h3 style="margin: 0; font-size: 20px; color: #050505;">Chats</h3>
                <input type="text" id="userSearchInput" class="search-input" placeholder="Search friends or followers..." oninput="searchConversationsOrFriends(this.value)">
            </div>
            <div class="sidebar-user-list" id="sidebarUsersList">
                <p style="text-align: center; color: #65676b; padding: 20px; font-size: 13px;">Loading chats...</p>
            </div>
        </div>

        <!-- Chat Main Area -->
        <div class="chat-main hidden-mobile" id="chatMainArea">
            <div id="chatHeader" style="padding: 12px 15px; font-weight: bold; font-size: 15px; border-bottom: 1px solid #e4e6eb; background: #fff; color: #65676b; display: flex; align-items: center;">
                Select a conversation
            </div>
            <div class="messages-list" id="messagesListContainer">
                <div style="text-align: center; color: #90949c; margin-top: 60px;">
                    <p style="font-size: 40px; margin: 0;">💬</p>
                    <p style="font-size: 14px; font-weight: 500; margin-top: 10px;">Your Messages</p>
                    <p style="font-size: 12px; color: #b0b3b8;">Select a friend from the left sidebar or profile to chat.</p>
                </div>
            </div>

            <!-- Chat Input Area -->
            <div class="chat-input-area hidden" id="chatInputArea">
                <!-- Voice Preview Box -->
                <div id="voicePreviewContainer">
                    <div style="display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0;">
                        <button id="previewPlayBtn" onclick="togglePreviewAudio()" style="background: #1877f2; color: white; border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0;">▶</button>
                        <span id="previewTimer" style="font-size: 13px; font-weight: bold; color: #050505; flex-shrink: 0;">0:00 / 0:00</span>
                        <div style="background: #ccd0d5; height: 4px; flex: 1; border-radius: 2px; position: relative;">
                            <div id="previewProgressBar" style="background: #1877f2; width: 0%; height: 100%; border-radius: 2px;"></div>
                        </div>
                    </div>
                    <div style="display: flex; gap: 6px; flex-shrink: 0;">
                        <button onclick="cancelVoicePreview()" class="cancel-btn">Cancel</button>
                        <button onclick="sendVoiceMessage()" class="send-btn">Send</button>
                    </div>
                </div>

                <!-- Normal Chat Input Row -->
                <div class="chat-input-row" id="normalInputRow">
                    <button id="recordBtn" class="action-icon-btn" onclick="toggleVoiceRecording()" title="Record Voice">🎙️</button>
                    <div id="recordingTimeDisplay" class="hidden">🔴 <span id="recSeconds">0:00</span> (Recording...)</div>
                    <input type="text" id="messageInput" class="msg-text" placeholder="Aa..." onkeypress="handleKeyPress(event)">
                    <button class="send-btn" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('camfeed_user')) || null;
        let activeChatEmail = null;
        let activeChatName = null;
        let messagePollingInterval = null;

        let mediaStream = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let recordedAudioBlob = null;
        let isRecording = false;
        let previewAudio = null;
        let recTimerInterval = null;
        let recSecondsCount = 0;

        if (!currentUser) {
            window.location.href = 'index.html';
        } else {
            initMessenger();
        }

        async function initMessenger() {
            await loadConversations();
            const urlParams = new URLSearchParams(window.location.search);
            const targetChatEmail = urlParams.get('chat');
            if (targetChatEmail) {
                try {
                    const res = await fetch(`/api/user-profile?email=${targetChatEmail}&viewerEmail=${currentUser.email}`);
                    const data = await res.json();
                    if (data.success && data.user) {
                        selectChat(targetChatEmail, `${data.user.first_name} ${data.user.last_name}`);
                    }
                } catch (err) { console.error(err); }
            }
        }

        async function loadConversations() {
            try {
                const res = await fetch(`/api/chat-conversations?email=${currentUser.email}`);
                const data = await res.json();
                if (data.success) {
                    renderSidebarList(data.conversations);
                }
            } catch (err) { console.error(err); }
        }

        function renderSidebarList(users) {
            const sidebar = document.getElementById('sidebarUsersList');
            if (users.length === 0) {
                sidebar.innerHTML = '<p style="text-align: center; color: #65676b; padding: 20px; font-size: 13px;">No conversations yet. Search your friends or followers to chat!</p>';
                return;
            }

            sidebar.innerHTML = users.map(u => `
                <div class="chat-user-item" id="user-item-${u.email}" onclick="selectChat('${u.email}', '${u.first_name} ${u.last_name}')">
                    <div class="avatar-wrapper">
                        <img src="${u.profile_pic || 'https://via.placeholder.com/45'}" class="avatar">
                        <div class="online-dot"></div>
                    </div>
                    <div style="flex: 1; min-width: 0;">
                        <div style="font-weight: bold; color: #050505; font-size: 14px;">${u.first_name} ${u.last_name}</div>
                        <div style="font-size: 12px; color: #65676b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${u.last_message || 'Started a conversation'}</div>
                    </div>
                </div>
            `).join('');
        }

        async function searchConversationsOrFriends(keyword) {
            if (!keyword.trim()) {
                loadConversations();
                return;
            }
            try {
                const res = await fetch(`/api/search-users?email=${currentUser.email}&keyword=${encodeURIComponent(keyword)}`);
                const data = await res.json();
                if (data.success) {
                    renderSidebarList(data.users);
                }
            } catch (err) { console.error(err); }
        }

        function selectChat(email, name) {
            activeChatEmail = email;
            activeChatName = name;
            
            document.querySelectorAll('.chat-user-item').forEach(el => el.classList.remove('active'));
            const activeEl = document.getElementById(`user-item-${email}`);
            if (activeEl) activeEl.classList.add('active');

            document.getElementById('chatHeader').innerText = name;
            document.getElementById('chatInputArea').classList.remove('hidden');
            
            if (window.innerWidth <= 768) {
                document.getElementById('sidebarSection').classList.add('hidden-mobile');
                document.getElementById('chatMainArea').classList.remove('hidden-mobile');
                document.getElementById('mobileBackBtn').style.display = 'flex';
            }

            loadMessages();

            if (messagePollingInterval) clearInterval(messagePollingInterval);
            messagePollingInterval = setInterval(() => {
                if (activeChatEmail) loadMessages(true);
            }, 2000);
        }

        function backToSidebar() {
            document.getElementById('sidebarSection').classList.remove('hidden-mobile');
            document.getElementById('chatMainArea').classList.add('hidden-mobile');
            document.getElementById('mobileBackBtn').style.display = 'none';
            activeChatEmail = null;
            if (messagePollingInterval) clearInterval(messagePollingInterval);
            loadConversations();
        }

        async function loadMessages(isPolling = false) {
            if (!activeChatEmail) return;
            try {
                const res = await fetch(`/api/messages?user1=${currentUser.email}&user2=${activeChatEmail}`);
                const data = await res.json();
                if (data.success) {
                    const container = document.getElementById('messagesListContainer');
                    
                    if (data.messages.length === 0) {
                        if (!isPolling) {
                            container.innerHTML = `
                                <div style="text-align: center; color: #90949c; margin-top: 50px;">
                                    <p style="font-size: 14px;">Say hello to ${activeChatName}!</p>
                                </div>
                            `;
                        }
                        return;
                    }

                    const messagesHtml = data.messages.map(m => {
                        let contentHtml = '';
                        if (m.message_type === 'audio' && m.media_url) {
                            contentHtml = `<audio src="${m.media_url}" controls style="max-width: 180px; height: 32px;"></audio>`;
                        } else {
                            contentHtml = `<span>${m.message}</span>`;
                        }

                        const dateObj = new Date(m.created_at);
                        const timeString = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                        const dateString = dateObj.toLocaleDateString();
                        const fullTimeStr = `${dateString} ${timeString}`;

                        const isSent = m.sender_email === currentUser.email;
                        return `
                            <div style="display: flex; flex-direction: column; align-items: ${isSent ? 'flex-end' : 'flex-start'}; gap: 2px;">
                                <div class="msg-bubble ${isSent ? 'msg-sent' : 'msg-received'}">${contentHtml}</div>
                                <span style="font-size: 10px; color: #90949c; padding: 0 4px;">${fullTimeStr}</span>
                            </div>
                        `;
                    }).join('');

                    if (container.innerHTML !== messagesHtml) {
                        container.innerHTML = messagesHtml;
                        container.scrollTop = container.scrollHeight;
                    }
                }
            } catch (err) { console.error(err); }
        }

        async function toggleVoiceRecording() {
            const recordBtn = document.getElementById('recordBtn');
            const messageInput = document.getElementById('messageInput');
            const recTimeDisplay = document.getElementById('recordingTimeDisplay');

            if (!isRecording) {
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ 
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } 
                    });
                    
                    mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'audio/webm' });
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        if (event.data.size > 0) audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        recordedAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(recordedAudioBlob);
                        
                        previewAudio = new Audio(audioUrl);
                        previewAudio.onloadedmetadata = () => {
                            document.getElementById('previewTimer').innerText = `0:00 / ${formatTime(previewAudio.duration)}`;
                        };

                        previewAudio.ontimeupdate = () => {
                            const progress = (previewAudio.currentTime / previewAudio.duration) * 100;
                            document.getElementById('previewProgressBar').style.width = `${progress}%`;
                            document.getElementById('previewTimer').innerText = `${formatTime(previewAudio.currentTime)} / ${formatTime(previewAudio.duration)}`;
                        };

                        previewAudio.onended = () => {
                            document.getElementById('previewPlayBtn').innerText = '▶';
                            document.getElementById('previewProgressBar').style.width = '0%';
                        };

                        document.getElementById('voicePreviewContainer').style.display = 'flex';
                        document.getElementById('normalInputRow').style.display = 'none';
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.style.color = 'red';

                    messageInput.style.display = 'none';
                    if(recTimeDisplay) recTimeDisplay.classList.remove('hidden');
                    recSecondsCount = 0;
                    document.getElementById('recSeconds').innerText = '0:00';

                    recTimerInterval = setInterval(() => {
                        recSecondsCount++;
                        const el = document.getElementById('recSeconds');
                        if (el) el.innerText = formatTime(recSecondsCount);
                    }, 1000);

                } catch (err) { alert("Microphone access denied or in use."); }
            } else {
                stopRecordingProcess();
            }
        }

        function stopRecordingProcess() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                document.getElementById('recordBtn').style.color = '#1877f2';

                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                    mediaStream = null;
                }

                clearInterval(recTimerInterval);
                const disp = document.getElementById('recordingTimeDisplay');
                if (disp) disp.classList.add('hidden');
                document.getElementById('messageInput').style.display = 'block';
            }
        }

        function togglePreviewAudio() {
            if (!previewAudio) return;
            const playBtn = document.getElementById('previewPlayBtn');
            if (previewAudio.paused) {
                previewAudio.play();
                playBtn.innerText = '⏸';
            } else {
                previewAudio.pause();
                playBtn.innerText = '▶';
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function cancelVoicePreview() {
            if (previewAudio) { previewAudio.pause(); previewAudio = null; }
            recordedAudioBlob = null;
            document.getElementById('voicePreviewContainer').style.display = 'none';
            document.getElementById('normalInputRow').style.display = 'flex';
        }

        async function sendVoiceMessage() {
            if (!recordedAudioBlob) return;
            if (previewAudio) { previewAudio.pause(); previewAudio = null; }

            const previewContainer = document.getElementById('voicePreviewContainer');
            previewContainer.innerHTML = `<div style="display:flex; align-items:center; gap:8px; margin:auto; color:#1877f2; font-weight:bold;"><div class="spinner" style="width:16px; height:16px; border:2px solid #1877f2; border-top:transparent; border-radius:50%; animation: spin 0.8s linear infinite;"></div> Sending voice...</div>`;

            const formData = new FormData();
            formData.append('sender', currentUser.email);
            formData.append('receiver', activeChatEmail);
            formData.append('message', '[Voice Message]');
            formData.append('mediaFile', recordedAudioBlob, 'voice.webm');

            try {
                const res = await fetch('/api/messages', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.success) {
                    cancelVoicePreview();
                    loadMessages();
                    loadConversations();
                } else {
                    alert("Failed to send voice message.");
                    cancelVoicePreview();
                }
            } catch (err) {
                console.error(err);
                cancelVoicePreview();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message || !activeChatEmail) return;

            input.value = '';
            try {
                const res = await fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender: currentUser.email, receiver: activeChatEmail, message })
                });
                const data = await res.json();
                if (data.success) {
                    loadMessages();
                    loadConversations();
                }
            } catch (err) { console.error(err); }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
<style>
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
