        async function confirmSendMedia() {
            if (selectedFilesQueue.length === 0 || !activeChatEmail) return;
            const filesToSend = [...selectedFilesQueue];
            closeMediaPreviewModal();

            for (const file of filesToSend) {
                try {
                    if (file.type.startsWith('video')) {
                        // បង្ហោះវីដេអូក្នុង Chat ផ្ទាល់ទៅ Cloudflare R2
                        const urlRes = await fetch('/api/videos/upload-url', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                user_email: currentUser.email,
                                file_name: file.name,
                                content_type: file.type || 'video/mp4'
                            })
                        });
                        const urlData = await urlRes.json();
                        if (urlRes.ok && urlData.uploadUrl) {
                            await fetch(urlData.uploadUrl, {
                                method: 'PUT',
                                headers: { 'Content-Type': file.type || 'video/mp4' },
                                body: file
                            });
                            await fetch('/api/messages', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    sender: currentUser.email,
                                    receiver: activeChatEmail,
                                    message: '[Video Message]',
                                    media_url: urlData.publicUrl,
                                    message_type: 'video'
                                })
                            });
                            continue;
                        }
                    }

                    // រូបភាព ឬឯកសារផ្សេងៗ ប្រើ FormData ធម្មតា
                    const formData = new FormData();
                    formData.append('sender', currentUser.email);
                    formData.append('receiver', activeChatEmail);
                    formData.append('mediaFile', file);

                    await fetch('/api/messages', { method: 'POST', body: formData });
                } catch (err) { console.error(err); }
            }
            loadMessages();
            loadConversations();
        }
