<!DOCTYPE html>
<html lang="km">
<head>
    <script src="auth-client.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CamFeed - Direct Connect</title>
    <link rel="icon" type="image/png" href="logo-icon.png">
    <link rel="apple-touch-icon" href="logo-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cf-bg: #f1f5f9;
            --cf-surface: #ffffff;
            --cf-surface-soft: #f8fafc;
            --cf-border: #e2e8f0;
            --cf-primary: #4f46e5;
            --cf-primary-grad: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --cf-text: #0f172a;
            --cf-muted: #64748b;
            --cf-online: #10b981;
            --cf-offline: #94a3b8;
            --cf-danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--cf-bg);
            color: var(--cf-text);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Sleek Modern Top Navigation */
        .cf-top-bar {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            height: 60px;
            padding: 0 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--cf-border);
            flex-shrink: 0;
            z-index: 20;
        }
        .cf-nav-left { display: flex; align-items: center; gap: 12px; }
        .cf-nav-back {
            background: var(--cf-surface-soft);
            border: 1px solid var(--cf-border);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--cf-text);
            transition: all 0.15s;
        }
        .cf-nav-back:hover { background: #eef2ff; border-color: #c7d2fe; color: var(--cf-primary); }
        .cf-brand-title {
            font-size: 20px;
            font-weight: 800;
            background: var(--cf-primary-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .cf-self-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #eef2ff;
            color: var(--cf-primary);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12.5px;
            font-weight: 700;
        }
        .cf-self-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--cf-online);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        /* Split-Card Workspace Layout */
        .cf-workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
            max-width: 1240px;
            width: 100%;
            margin: 0 auto;
            padding: 12px;
            gap: 12px;
        }

        /* Left Contacts Card */
        .cf-sidebar {
            width: 340px;
            background: var(--cf-surface);
            border: 1px solid var(--cf-border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04);
        }
        .cf-sidebar-head {
            padding: 14px 16px 10px;
            border-bottom: 1px solid #f1f5f9;
        }
        .cf-search-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .cf-search-wrap input {
            width: 100%;
            padding: 10px 14px 10px 36px;
            border-radius: 14px;
            border: 1px solid var(--cf-border);
            background: var(--cf-surface-soft);
            outline: none;
            font-size: 13.5px;
            font-family: inherit;
            color: var(--cf-text);
            transition: border-color 0.15s, background 0.15s;
        }
        .cf-search-wrap input:focus {
            background: #fff;
            border-color: var(--cf-primary);
        }
        .cf-search-icon {
            position: absolute;
            left: 12px;
            font-size: 14px;
            color: var(--cf-muted);
            pointer-events: none;
        }
        .cf-contacts-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .cf-contact-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid transparent;
        }
        .cf-contact-card:hover { background: var(--cf-surface-soft); }
        .cf-contact-card.active {
            background: #eef2ff;
            border-color: #c7d2fe;
        }
        .cf-avatar-box {
            position: relative;
            width: 48px;
            height: 48px;
            flex-shrink: 0;
        }
        .cf-avatar-box img {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            object-fit: cover;
            background: #e2e8f0;
        }
        .cf-status-ring {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: var(--cf-offline);
            border: 2.5px solid #fff;
        }
        .cf-status-ring.online {
            background: var(--cf-online);
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.25);
        }
        .cf-contact-meta { flex: 1; min-width: 0; }
        .cf-contact-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }
        .cf-contact-name {
            font-weight: 700;
            font-size: 14.5px;
            color: var(--cf-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cf-contact-state-tag {
            font-size: 10.5px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 999px;
            flex-shrink: 0;
        }
        .cf-contact-state-tag.online {
            background: #d1fae5;
            color: #065f46;
        }
        .cf-contact-state-tag.offline {
            background: #f1f5f9;
            color: #64748b;
        }
        .cf-contact-preview {
            font-size: 12.5px;
            color: var(--cf-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 3px;
        }

        /* Unread Conversation Highlight in Sidebar (Bold Black Name + Larger Bold Preview until opened) */
        .cf-contact-card.is-unread {
            background: #f0f4ff;
            border-color: #dbeafe;
        }
        .cf-contact-card.is-unread .cf-contact-name {
            font-weight: 900;
            color: #000000;
            font-size: 15.5px;
        }
        .cf-contact-card.is-unread .cf-contact-preview {
            font-weight: 800;
            color: #050505;
            font-size: 14px;
        }
        .cf-unread-pill {
            background: #4f46e5;
            color: #fff;
            font-size: 10.5px;
            font-weight: 800;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Media Download Button Overlay on Photos & Videos */
        .cf-media-dl-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 12;
            width: 32px;
            height: 32px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.28);
            background: rgba(15, 23, 42, 0.72);
            color: #ffffff;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
            text-decoration: none;
            transition: transform 0.12s, background 0.15s;
        }
        .cf-media-dl-btn:hover {
            background: #4f46e5;
            transform: scale(1.06);
        }

        /* Unplayed Received Voice Message Distinct Highlight (Turns normal once clicked/listened) */
        .cf-voice-pill.is-unplayed {
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%) !important;
            border: 1.5px solid #f59e0b !important;
            box-shadow: 0 3px 12px rgba(245, 158, 11, 0.22);
        }
        .cf-voice-pill.is-unplayed .cf-voice-play {
            background: #f59e0b !important;
            color: #ffffff !important;
        }
        .cf-voice-pill.is-unplayed .wave-bar {
            background-color: #fbbf24 !important;
        }
        .cf-voice-unplayed-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25);
            flex-shrink: 0;
        }

        /* Right Conversation Card */
        .cf-chat-card {
            flex: 1;
            background: var(--cf-surface);
            border: 1px solid var(--cf-border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            min-width: 0;
            height: 100%;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04);
        }

        /* Conversation Header */
        .cf-chat-header {
            height: 64px;
            padding: 0 16px;
            border-bottom: 1px solid var(--cf-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.95);
            flex-shrink: 0;
            z-index: 10;
        }
        .cf-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1;
        }
        .cf-mobile-back {
            display: none;
            background: var(--cf-surface-soft);
            border: 1px solid var(--cf-border);
            color: var(--cf-text);
            width: 36px;
            height: 36px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .cf-header-avatar {
            position: relative;
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            cursor: pointer;
        }
        .cf-header-avatar img {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            object-fit: cover;
            background: #e2e8f0;
        }
        .cf-header-info { min-width: 0; cursor: pointer; }
        .cf-header-name {
            font-weight: 800;
            font-size: 15.5px;
            color: var(--cf-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cf-presence-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11.5px;
            font-weight: 700;
            margin-top: 2px;
            padding: 2px 8px;
            border-radius: 999px;
        }
        .cf-presence-badge.online {
            background: #ecfdf5;
            color: #059669;
        }
        .cf-presence-badge.offline {
            background: #f1f5f9;
            color: #64748b;
        }
        .cf-presence-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
        }

        .cf-header-tools {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .cf-tool-circle {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            border: 1px solid var(--cf-border);
            background: var(--cf-surface-soft);
            color: var(--cf-text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
        }
        .cf-tool-circle:hover {
            background: #eef2ff;
            border-color: #c7d2fe;
            color: var(--cf-primary);
        }

        /* Messages Stream */
        .cf-messages-feed {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 0.65px, transparent 0.65px);
            background-size: 18px 18px;
        }
        .cf-empty-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--cf-muted);
            padding: 24px;
        }
        .cf-time-chip {
            align-self: center;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid var(--cf-border);
            color: var(--cf-muted);
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 999px;
            margin: 6px 0;
        }

        /* Message Row & Modern Asymmetric Bubbles */
        .cf-msg-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            width: 100%;
            position: relative;
        }
        .cf-msg-row.sent { justify-content: flex-end; }
        .cf-msg-row.received { justify-content: flex-start; }

        .cf-msg-avatar {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            background: #e2e8f0;
        }
        .cf-msg-stack {
            display: flex;
            flex-direction: column;
            max-width: 76%;
            position: relative;
        }
        .cf-msg-row.sent .cf-msg-stack { align-items: flex-end; }
        .cf-msg-row.received .cf-msg-stack { align-items: flex-start; }

        .cf-bubble {
            padding: 10px 15px;
            font-size: 14.5px;
            line-height: 1.45;
            word-break: break-word;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
            position: relative;
        }
        .cf-msg-row.sent .cf-bubble {
            background: var(--cf-primary-grad);
            color: #ffffff;
            border-radius: 18px 18px 4px 18px;
        }
        .cf-msg-row.received .cf-bubble {
            background: #ffffff;
            color: var(--cf-text);
            border: 1px solid var(--cf-border);
            border-radius: 18px 18px 18px 4px;
        }

        /* Deleted Message Tombstone Trace */
        .cf-bubble-deleted {
            padding: 9px 14px;
            font-size: 13px;
            font-style: italic;
            color: #64748b;
            background: #f1f5f9;
            border: 1px dashed #cbd5e1;
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            user-select: none;
        }

        .cf-edited-tag {
            font-size: 10px;
            opacity: 0.78;
            margin-left: 6px;
            font-weight: 600;
        }

        /* Sending / Delivery Status Indicator */
        .cf-msg-footer {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 3px;
            font-size: 10.5px;
            font-weight: 700;
            color: var(--cf-muted);
        }
        .cf-sending-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #eef2ff;
            color: var(--cf-primary);
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
        }
        .cf-mini-spin {
            width: 10px;
            height: 10px;
            border: 2px solid rgba(79, 70, 229, 0.25);
            border-top-color: var(--cf-primary);
            border-radius: 50%;
            animation: spinFast 0.7s linear infinite;
        }
        @keyframes spinFast { to { transform: rotate(360deg); } }

        /* Hover / Tap Action Controls for Sent & Received Messages (Edit / Delete / Forward) */
        .cf-msg-actions-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
            align-self: center;
            position: relative;
        }
        .cf-msg-opt-btn {
            width: 28px;
            height: 28px;
            border-radius: 10px;
            border: 1px solid var(--cf-border);
            background: #fff;
            color: var(--cf-muted);
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .cf-msg-opt-btn:hover {
            background: #eef2ff;
            color: var(--cf-primary);
            border-color: #c7d2fe;
        }
        .cf-msg-popover {
            display: none;
            position: absolute;
            bottom: 34px;
            right: 0;
            background: #fff;
            border: 1px solid var(--cf-border);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.16);
            min-width: 145px;
            z-index: 60;
            overflow: hidden;
        }
        .cf-msg-row.received .cf-msg-popover {
            right: auto;
            left: 0;
        }
        .cf-msg-popover.open { display: block; }
        .cf-msg-popover button {
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            padding: 9px 12px;
            font-size: 12.5px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--cf-text);
        }
        .cf-msg-popover button:hover { background: #f1f5f9; }
        .cf-msg-popover button.danger { color: var(--cf-danger); }

        /* Modern Media Cards (Photos & Videos) */
        .cf-media-card {
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--cf-border);
            background: #0f172a;
            max-width: 250px;
            position: relative;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.1);
        }
        .cf-media-card img {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }
        .cf-media-card video {
            width: 100%;
            max-height: 330px;
            object-fit: cover;
            display: block;
            background: #000;
        }
        .cf-media-uploading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.68);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #fff;
            padding: 12px;
            text-align: center;
        }
        .cf-upload-progress-bar {
            width: 80%;
            height: 6px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            overflow: hidden;
        }
        .cf-upload-progress-fill {
            height: 100%;
            background: #38bdf8;
            transition: width 0.2s;
        }

        /* Voice Waveform Pill */
        .cf-voice-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 14px 9px 10px;
            border-radius: 18px;
            min-width: 225px;
            max-width: 74vw;
            user-select: none;
        }
        .cf-msg-row.sent .cf-voice-pill {
            background: var(--cf-primary-grad);
            color: #fff;
        }
        .cf-msg-row.received .cf-voice-pill {
            background: #fff;
            color: var(--cf-text);
            border: 1px solid var(--cf-border);
        }
        .cf-voice-play {
            width: 32px;
            height: 32px;
            border-radius: 11px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            font-size: 13px;
        }
        .cf-msg-row.sent .cf-voice-play {
            background: rgba(255, 255, 255, 0.22);
            color: #fff;
        }
        .cf-msg-row.received .cf-voice-play {
            background: #eef2ff;
            color: var(--cf-primary);
        }
        .cf-waveform {
            display: flex;
            align-items: center;
            gap: 2.5px;
            height: 24px;
            flex: 1;
            cursor: pointer;
        }
        .wave-bar {
            width: 2.5px;
            border-radius: 2px;
            transition: background-color 0.15s;
        }
        .cf-msg-row.sent .wave-bar { background-color: rgba(255, 255, 255, 0.38); }
        .cf-msg-row.sent .wave-bar.played { background-color: #ffffff; }
        .cf-msg-row.received .wave-bar { background-color: #cbd5e1; }
        .cf-msg-row.received .wave-bar.played { background-color: var(--cf-primary); }
        .cf-voice-dur {
            font-size: 12px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            min-width: 34px;
            text-align: right;
        }

        .big-thumb-sticker { font-size: 38px; line-height: 1; user-select: none; }

        /* Edit Mode Banner above Composer */
        .cf-edit-banner {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: #eef2ff;
            border-top: 1px solid #c7d2fe;
            padding: 8px 14px;
            font-size: 12.5px;
            color: var(--cf-primary);
            font-weight: 700;
        }
        .cf-edit-banner.active { display: flex; }

        /* Recording & Voice Review Banners */
        .cf-rec-banner {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: #fef2f2;
            color: #dc2626;
            padding: 9px 14px;
            font-size: 13px;
            font-weight: 700;
            border-top: 1px solid #fecaca;
        }
        .cf-rec-banner.active { display: flex; }

        .cf-review-banner {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: #eef2ff;
            border-top: 1px solid #c7d2fe;
            padding: 8px 14px;
        }
        .cf-review-banner.active { display: flex; }
        .cf-review-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--cf-primary-grad);
            color: #fff;
            padding: 6px 12px;
            border-radius: 14px;
            flex: 1;
            min-width: 0;
        }

        /* Staged Multi-Media Tray (Preview -> Edit or Click Send) */
        .cf-staging-tray {
            display: none;
            flex-direction: column;
            gap: 8px;

    <script>
        const currentUser = JSON.parse(localStorage.getItem('camfeed_user')) || null;
        let allConversations = [];
        let activeFriend = null;
        let pollInterval = null;
        let lastMessagesSignature = '';

        // Local Optimistic Queue for Outgoing Items ("Sending..." until uploaded to R2 & confirmed by server)
        let pendingOutgoingMessages = []; // [{ tempId, receiverEmail, type, text, previewUrl, progress }]

        // Edit Message State
        let editingMessageId = null;

        // Local fallback cache for edited/deleted messages if backend route isn't updated yet
        const DELETED_MARKER = '__CAMFEED_MSG_DELETED__';
        const EDITED_PREFIX = '__CAMFEED_EDITED__:';

        function getLocalOverrides() {
            try { return JSON.parse(localStorage.getItem('camfeed_chat_overrides') || '{}'); } catch (e) { return {}; }
        }
        function setLocalOverride(msgId, data) {
            const all = getLocalOverrides();
            all[msgId] = { ...(all[msgId] || {}), ...data };
            localStorage.setItem('camfeed_chat_overrides', JSON.stringify(all));
        }

        // =========================================================================
        // PRE-FETCHED IN-MEMORY AUDIO BLOB CACHE (Zero-Stutter Smooth Playback)
        // =========================================================================
        const audioBlobCache = new Map();
        let activeAudioPlayer = null;
        let activeAudioMsgId = null;
        let activeAnimFrame = null;
        const WAVEFORM_BARS = [35, 65, 95, 50, 80, 100, 60, 40, 85, 70, 95, 45, 75, 100, 65, 50, 90, 75, 45, 85, 60, 35, 70, 50];

        function formatSeconds(sec) {
            if (!sec || !isFinite(sec) || sec < 0) return '0:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function preloadAudioBlob(remoteUrl, msgId) {
            if (!remoteUrl) return Promise.resolve(null);
            if (audioBlobCache.has(remoteUrl)) {
                const entry = audioBlobCache.get(remoteUrl);
                if (entry.blobUrl) {
                    const durEl = document.getElementById(`voice-dur-${msgId}`);
                    if (durEl && entry.durationSec > 0 && activeAudioMsgId !== msgId) {
                        durEl.innerText = formatSeconds(entry.durationSec);
                    }
                    return Promise.resolve(entry);
                }
                return entry.loadingPromise;
            }

            const entry = { blobUrl: null, durationSec: 0, loadingPromise: null };
            entry.loadingPromise = fetch(remoteUrl)
                .then(res => res.blob())
                .then(blob => {
                    const localBlobUrl = URL.createObjectURL(blob);
                    entry.blobUrl = localBlobUrl;
                    return new Promise((resolve) => {
                        const probe = new Audio();
                        probe.preload = 'metadata';
                        probe.src = localBlobUrl;
                        probe.onloadedmetadata = () => {
                            if (isFinite(probe.duration) && probe.duration > 0) {
                                entry.durationSec = probe.duration;
                                const durEl = document.getElementById(`voice-dur-${msgId}`);
                                if (durEl && activeAudioMsgId !== msgId) durEl.innerText = formatSeconds(entry.durationSec);
                                resolve(entry);
                            } else {
                                blob.arrayBuffer().then(buf => {
                                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                                    if (!AudioCtx) return resolve(entry);
                                    const ctx = new AudioCtx();
                                    ctx.decodeAudioData(buf, decoded => {
                                        entry.durationSec = decoded.duration || 0;
                                        ctx.close().catch(() => {});
                                        const durEl = document.getElementById(`voice-dur-${msgId}`);
                                        if (durEl && entry.durationSec > 0 && activeAudioMsgId !== msgId) {
                                            durEl.innerText = formatSeconds(entry.durationSec);
                                        }
                                        resolve(entry);
                                    }, () => resolve(entry));
                                }).catch(() => resolve(entry));
                            }
                        };
                        probe.onerror = () => resolve(entry);
                    });
                })
                .catch(() => null);

            audioBlobCache.set(remoteUrl, entry);
            return entry.loadingPromise;
        }

        async function togglePlayVoiceMessage(msgId, remoteUrl) {
            markVoiceAsPlayed(msgId);
            const btn = document.getElementById(`voice-btn-${msgId}`);
            const durEl = document.getElementById(`voice-dur-${msgId}`);

            if (activeAudioPlayer && activeAudioMsgId === msgId) {
                if (!activeAudioPlayer.paused) {
                    activeAudioPlayer.pause();
                    if (btn) btn.innerHTML = '▶';
                    if (activeAnimFrame) cancelAnimationFrame(activeAnimFrame);
                    return;
                } else {
                    await activeAudioPlayer.play();
                    if (btn) btn.innerHTML = '⏸';
                    animateVoiceProgress(msgId);
                    return;
                }
            }

            if (activeAudioPlayer) {
                activeAudioPlayer.pause();
                if (activeAnimFrame) cancelAnimationFrame(activeAnimFrame);
                if (activeAudioMsgId) resetVoiceUI(activeAudioMsgId);
            }

            if (btn) btn.innerHTML = '⏳';
            const cached = await preloadAudioBlob(remoteUrl, msgId);
            const playableSrc = (cached && cached.blobUrl) ? cached.blobUrl : remoteUrl;

            const audio = new Audio(playableSrc);
            audio.preload = 'auto';
            activeAudioPlayer = audio;
            activeAudioMsgId = msgId;

            const totalDur = (cached && cached.durationSec > 0) ? cached.durationSec : 0;
            if (durEl && totalDur > 0) durEl.dataset.totalDur = formatSeconds(totalDur);

            audio.onended = () => {
                resetVoiceUI(msgId);
                activeAudioPlayer = null;
                activeAudioMsgId = null;
                if (activeAnimFrame) cancelAnimationFrame(activeAnimFrame);
            };

            try {
                await audio.play();
                if (btn) btn.innerHTML = '⏸';
                animateVoiceProgress(msgId, totalDur);
            } catch (err) {
                if (btn) btn.innerHTML = '▶';
            }
        }

        function animateVoiceProgress(msgId, knownDuration = 0) {
            const step = () => {
                if (!activeAudioPlayer || activeAudioMsgId !== msgId || activeAudioPlayer.paused) return;
                const dur = (isFinite(activeAudioPlayer.duration) && activeAudioPlayer.duration > 0) ? activeAudioPlayer.duration : knownDuration;
                const cur = activeAudioPlayer.currentTime || 0;
                const ratio = dur > 0 ? Math.min(1, cur / dur) : 0;

                const bars = document.querySelectorAll(`#voice-wave-${msgId} .wave-bar`);
                const activeCount = Math.round(ratio * bars.length);
                bars.forEach((b, idx) => b.classList.toggle('played', idx < activeCount));

                const durEl = document.getElementById(`voice-dur-${msgId}`);
                if (durEl) {
                    const remaining = dur > 0 ? Math.max(0, dur - cur) : cur;
                    durEl.innerText = formatSeconds(remaining);
                }
                activeAnimFrame = requestAnimationFrame(step);
            };
            activeAnimFrame = requestAnimationFrame(step);
        }

        // =========================================================================
        // DIRECT CLOUDFLARE R2 MEDIA UPLOADER FOR CHAT (Photos, Videos & Voice)
        // Ensures media uploads to R2 FIRST ("Sending...") before saving message!
        // =========================================================================
        function compressChatImage(fileOrBlob) {
            return new Promise((resolve) => {
                if (!fileOrBlob.type || !fileOrBlob.type.startsWith('image/') || fileOrBlob.type === 'image/gif') {
                    return resolve(fileOrBlob);
                }
                const img = new Image();
                const objUrl = URL.createObjectURL(fileOrBlob);
                img.onload = () => {
                    URL.revokeObjectURL(objUrl);
                    const maxDim = 1600;
                    let w = img.width;
                    let h = img.height;
                    if (w <= maxDim && h <= maxDim && fileOrBlob.size <= 600 * 1024) return resolve(fileOrBlob);
                    if (w > maxDim || h > maxDim) {
                        const scale = maxDim / Math.max(w, h);
                        w = Math.round(w * scale);
                        h = Math.round(h * scale);
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    canvas.toBlob((blob) => {
                        if (blob && blob.size > 0 && blob.size < fileOrBlob.size) resolve(blob);
                        else resolve(fileOrBlob);
                    }, 'image/jpeg', 0.84);
                };
                img.onerror = () => { URL.revokeObjectURL(objUrl); resolve(fileOrBlob); };
                img.src = objUrl;
            });
        }

        function uploadChatMediaToR2(fileOrBlob, fileName, onProgress) {
            return new Promise(async (resolve, reject) => {
                const contentType = fileOrBlob.type || 'application/octet-stream';
                try {
                    const urlRes = await fetch('/api/videos/upload-url', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user_email: currentUser.email,
                            file_name: fileName,
                            content_type: contentType
                        })
                    });
                    const urlData = await urlRes.json();
                    if (urlRes.ok && urlData.uploadUrl && urlData.publicUrl) {
                        const xhr = new XMLHttpRequest();
                        xhr.open('PUT', urlData.uploadUrl, true);
                        xhr.setRequestHeader('Content-Type', contentType);
                        xhr.upload.onprogress = (e) => {
                            if (e.lengthComputable && onProgress) onProgress(Math.round((e.loaded / e.total) * 100));
                        };
                        xhr.onload = () => {
                            if (xhr.status >= 200 && xhr.status < 300) {
                                resolve(urlData.publicUrl);
                            } else {
                                uploadChatMediaViaServerR2(fileOrBlob, fileName, onProgress).then(resolve).catch(reject);
                            }
                        };
                        xhr.onerror = () => {
                            uploadChatMediaViaServerR2(fileOrBlob, fileName, onProgress).then(resolve).catch(reject);
                        };
                        xhr.send(fileOrBlob);
                        return;
                    }
                } catch (e) {}

                uploadChatMediaViaServerR2(fileOrBlob, fileName, onProgress).then(resolve).catch(reject);
            });
        }

        function uploadChatMediaViaServerR2(fileOrBlob, fileName, onProgress) {
            return new Promise((resolve, reject) => {
                const fd = new FormData();
                fd.append('user_email', currentUser.email);
                fd.append('file', fileOrBlob, fileName);
                const xhr = new XMLHttpRequest();
                xhr.open('POST', '/api/videos/upload-direct', true);
                xhr.timeout = 60000;
                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable && onProgress) onProgress(Math.round((e.loaded / e.total) * 100));
                };
                xhr.onload = () => {
                    try {
                        const data = JSON.parse(xhr.responseText || '{}');
                        if (xhr.status >= 200 && xhr.status < 300 && data.publicUrl) {
                            resolve(data.publicUrl);
                        } else {
                            reject(new Error(data.error || 'R2 Upload failed'));
                        }
                    } catch (e) { reject(new Error('Invalid upload response')); }
                };
                xhr.onerror = () => reject(new Error('Network error during upload'));
                xhr.ontimeout = () => reject(new Error('Upload timed out'));
                xhr.send(fd);
            });
        }

        // =========================================================================
        // VOICE RECORDING -> LISTEN & REVIEW -> SEND TO R2
        // =========================================================================
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let keepRecordingForReview = true;
        let recordTimerInterval = null;
        let recordSeconds = 0;

        let pendingVoiceBlob = null;
        let pendingVoiceExt = 'webm';
        let pendingVoiceUrl = null;
        let reviewAudioObj = null;

        async function toggleVoiceRecord() {
            if (!isRecording) {
                discardReviewedVoice();
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
                        ? 'audio/webm;codecs=opus'
                        : (MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '');
                    mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
                    audioChunks = [];
                    keepRecordingForReview = true;

                    mediaRecorder.ondataavailable = event => {
                        if (event.data && event.data.size > 0) audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        stream.getTracks().forEach(track => track.stop());
                        clearInterval(recordTimerInterval);
                        document.getElementById('recordingBanner').classList.remove('active');
                        document.getElementById('voiceRecordBtn').classList.remove('recording');

                        if (!keepRecordingForReview || audioChunks.length === 0) return;

                        const blobType = mediaRecorder.mimeType || 'audio/webm';
                        pendingVoiceExt = blobType.includes('mp4') ? 'm4a' : 'webm';
                        pendingVoiceBlob = new Blob(audioChunks, { type: blobType });
                        pendingVoiceUrl = URL.createObjectURL(pendingVoiceBlob);

                        document.getElementById('reviewDurationText').innerText = formatSeconds(recordSeconds);
                        document.getElementById('reviewPlayBtn').innerText = '▶';
                        document.getElementById('voiceReviewBanner').classList.add('active');
                    };

                    mediaRecorder.start(200);
                    isRecording = true;
                    recordSeconds = 0;
                    document.getElementById('recordingTimerText').innerText = '0:00';
                    document.getElementById('recordingBanner').classList.add('active');
                    document.getElementById('voiceRecordBtn').classList.add('recording');

                    recordTimerInterval = setInterval(() => {
                        recordSeconds += 1;
                        document.getElementById('recordingTimerText').innerText = formatSeconds(recordSeconds);
                    }, 1000);
                } catch (err) {
                    alert('សូមអនុញ្ញាតឱ្យប្រើ Microphone ដើម្បីថតសំឡេង!');
                }
            } else {
                stopRecordingForReview();
            }
        }

        function stopRecordingForReview() {
            if (mediaRecorder && isRecording) {
                keepRecordingForReview = true;
                mediaRecorder.stop();
                isRecording = false;
            }
        }

        function cancelVoiceRecording() {
            if (mediaRecorder && isRecording) {
                keepRecordingForReview = false;
                mediaRecorder.stop();
                isRecording = false;
            }
        }

        function toggleReviewAudioPlay() {
            if (!pendingVoiceUrl) return;
            const btn = document.getElementById('reviewPlayBtn');
            if (reviewAudioObj && !reviewAudioObj.paused) {
                reviewAudioObj.pause();
                btn.innerText = '▶';
                return;
            }
            if (!reviewAudioObj) {
                reviewAudioObj = new Audio(pendingVoiceUrl);
                reviewAudioObj.onended = () => { btn.innerText = '▶'; };

        function discardReviewedVoice() {
            if (reviewAudioObj) { reviewAudioObj.pause(); reviewAudioObj = null; }
            if (pendingVoiceUrl) { URL.revokeObjectURL(pendingVoiceUrl); pendingVoiceUrl = null; }
            pendingVoiceBlob = null;

        async function sendReviewedVoice() {
            if (!pendingVoiceBlob || !activeFriend) return;
            const blobToUpload = pendingVoiceBlob;
            const ext = pendingVoiceExt;
            const targetEmail = activeFriend.email;
            discardReviewedVoice();

            const tempId = 'temp-' + Date.now();
            pendingOutgoingMessages.push({
                tempId,
                receiverEmail: targetEmail,
                type: 'audio',
                text: '[Voice Message]',
                progress: 10
            });
            forceRenderCurrentFeed(true);

            try {
                const r2Url = await uploadChatMediaToR2(blobToUpload, `voice-${Date.now()}.${ext}`, (pct) => {
                    const item = pendingOutgoingMessages.find(p => p.tempId === tempId);
                    if (item) { item.progress = pct; forceRenderCurrentFeed(false); }
                });

                const res = await fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sender: currentUser.email,
                        receiver: targetEmail,
                        message: '[Voice Message]',
                        media_url: r2Url,
                        message_type: 'audio'
                    })
                });
                const data = await res.json();
                pendingOutgoingMessages = pendingOutgoingMessages.filter(p => p.tempId !== tempId);
                if (data.success) {
                    await fetchMessages(true);
                    loadConversations();
                } else {
                    forceRenderCurrentFeed(false);
                    alert(data.error || 'Failed to send voice message.');
                }
            } catch (err) {
                pendingOutgoingMessages = pendingOutgoingMessages.filter(p => p.tempId !== tempId);
                forceRenderCurrentFeed(false);
                alert('មិនអាចផ្ញើសារសំឡេងបានទេ៖ ' + err.message);
            }
        }

        // =========================================================================
        // ACCURATE REAL-TIME ONLINE / OFFLINE PRESENCE ENGINE
        // =========================================================================
        function isUserActivelyOnline(lastActiveRaw) {
            if (!lastActiveRaw) return false;
            const ts = Date.parse(lastActiveRaw);
            if (isNaN(ts)) return false;
            // Strictly online ONLY when user has active heartbeat within the last 25 seconds
            return (Date.now() - ts) <= 25000;
        }

        function formatLastSeenStatus(lastActiveRaw) {
            if (!lastActiveRaw) return 'Offline';
            const ts = Date.parse(lastActiveRaw);
            if (isNaN(ts)) return 'Offline';
            const diffSec = Math.floor((Date.now() - ts) / 1000);
            if (diffSec <= 25) return 'Online';
            return 'Offline';
        }

        let lastHeartbeatSentAt = 0;
        async function sendOnlineHeartbeat(force = false) {
            if (!currentUser) return;
            if (!force && document.visibilityState === 'hidden') return;
            const now = Date.now();
            if (!force && (now - lastHeartbeatSentAt) < 8000) return;
            lastHeartbeatSentAt = now;

            try {
                await fetch('/api/presence/ping', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentUser.email, online: true })
                });
            } catch (e) {}
        }

        function sendOfflineBeacon() {
            if (!currentUser) return;
            try {
                const blob = new Blob([JSON.stringify({ email: currentUser.email, online: false })], { type: 'application/json' });
                if (navigator.sendBeacon) {
                    navigator.sendBeacon('/api/presence/offline', blob);
                }
            } catch (e) {}
        }

            sendOnlineHeartbeat(true);

            ['click', 'touchstart', 'keydown'].forEach(evt => {
                document.addEventListener(evt, () => sendOnlineHeartbeat(false), { passive: true });
            });
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    sendOnlineHeartbeat(true);

        let unreadSenderMap = {}; // { [senderEmail]: count }

        async function loadConversations() {
            try {
                const [res, notifRes] = await Promise.all([
                    fetch(`/api/chat-conversations?email=${encodeURIComponent(currentUser.email)}`),
                    fetch(`/api/chat-notifications?email=${encodeURIComponent(currentUser.email)}`).catch(() => null)
                ]);
                const data = await res.json();
                if (notifRes) {
                    try {
                        const nData = await notifRes.json();
                        if (nData.success && Array.isArray(nData.unreadMessages)) {
                            const map = {};
                            nData.unreadMessages.forEach(m => {
                                const se = (m.sender_email || '').toLowerCase();
                                if (!activeFriend || activeFriend.email.toLowerCase() !== se) {
                                    map[se] = (map[se] || 0) + 1;
                                }
                            });
                            unreadSenderMap = map;
                        }
                    } catch (e) {}
                }

                if (data.success && Array.isArray(data.conversations)) {
                    allConversations = data.conversations.map(c => {
                        const se = (c.email || '').toLowerCase();
                        const isCurrentlyOpen = activeFriend && activeFriend.email.toLowerCase() === se;
                        const dbUnread = parseInt(c.unread_count) || 0;
                        const liveUnread = isCurrentlyOpen ? 0 : Math.max(dbUnread, unreadSenderMap[se] || 0);
                        return { ...c, unread_count: liveUnread };
                    });
                    const searchVal = (document.getElementById('searchContactInput')?.value || '').trim();
                    if (!searchVal) renderContacts(allConversations);

                    const urlParams = new URLSearchParams(window.location.search);
                    const targetEmail = urlParams.get('chat') || urlParams.get('user');
                    if (targetEmail && !activeFriend) {
                        const found = allConversations.find(f => f.email === targetEmail);
                        if (found) {
                            openChat(found);
                        } else {
                            const uRes = await fetch(`/api/user-profile?email=${encodeURIComponent(targetEmail)}&viewerEmail=${encodeURIComponent(currentUser.email)}`);
                            const uData = await uRes.json();
                            if (uData.success && uData.user) openChat(uData.user);
                        }
                    }
                }
            } catch (err) {
                console.error('Error loading conversations:', err);
            }
        }
