<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camfeed - Messages</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f0f2f5; color: #050505; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        .top-nav { background: #fff; height: 56px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e4e6eb; flex-shrink: 0; }
        .nav-left { display: flex; align-items: center; gap: 12px; }
        .back-btn { background: #f0f2f5; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .back-btn:hover { background: #e4e6eb; }
        .page-title { font-size: 20px; font-weight: bold; color: #1877f2; }

        .chat-layout { display: flex; flex: 1; overflow: hidden; max-width: 1200px; width: 100%; margin: 0 auto; background: #fff; border-left: 1px solid #e4e6eb; border-right: 1px solid #e4e6eb; }

        /* Sidebar Contacts */
        .contacts-panel { width: 320px; border-right: 1px solid #e4e6eb; display: flex; flex-direction: column; background: #fff; }
        .search-box { padding: 12px; border-bottom: 1px solid #f0f2f5; }
        .search-box input { width: 100%; padding: 9px 14px; border-radius: 20px; border: none; background: #f0f2f5; outline: none; font-size: 14px; }
        .contacts-list { flex: 1; overflow-y: auto; }
        .contact-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; cursor: pointer; transition: background 0.15s; }
        .contact-item:hover { background: #f2f3f5; }
        .contact-item.active { background: #ebf5ff; }
        .contact-avatar { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: #e4e6eb; }
        .contact-info { flex: 1; min-width: 0; }
        .contact-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .contact-sub { font-size: 12px; color: #65676b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Chat Area */
        .chat-panel { flex: 1; display: flex; flex-direction: column; background: #fff; min-width: 0; }
        .chat-header { height: 60px; padding: 0 16px; border-bottom: 1px solid #e4e6eb; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
        .mobile-back-btn { display: none; background: none; border: none; font-size: 20px; cursor: pointer; padding: 4px 8px; }
        .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fff; }
        .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #65676b; text-align: center; padding: 20px; }

        .msg-row { display: flex; flex-direction: column; max-width: 72%; }
        .msg-row.sent { align-self: flex-end; align-items: flex-end; }
        .msg-row.received { align-self: flex-start; align-items: flex-start; }

        .msg-bubble { padding: 9px 14px; border-radius: 18px; font-size: 14.5px; line-height: 1.4; word-break: break-word; }
        .msg-row.sent .msg-bubble { background: #0084ff; color: #fff; border-bottom-right-radius: 4px; }
        .msg-row.received .msg-bubble { background: #f0f2f5; color: #050505; border-bottom-left-radius: 4px; }

        .msg-media { max-width: 240px; border-radius: 12px; margin-top: 4px; display: block; }
        .msg-audio { max-width: 240px; height: 36px; margin-top: 4px; }
        .msg-time { font-size: 11px; color: #8a8d91; margin-top: 3px; padding: 0 4px; }

        /* Input Footer */
        .chat-input-bar { padding: 10px 14px; border-top: 1px solid #e4e6eb; display: flex; align-items: center; gap: 8px; background: #fff; flex-shrink: 0; }
        .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 6px; border-radius: 50%; color: #0084ff; display: flex; align-items: center; justify-content: center; }
        .icon-btn:hover { background: #f0f2f5; }
        .icon-btn.recording { color: #fa383e; background: #ffebe9; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .msg-input { flex: 1; padding: 9px 14px; border-radius: 20px; border: 1px solid #dddfe2; background: #f0f2f5; outline: none; font-size: 14px; }
        .send-btn { background: #0084ff; color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 14px; cursor: pointer; }
        .send-btn:hover { background: #0073e6; }

        @media (max-width: 768px) {
            .contacts-panel { width: 100%; }
            .contacts-panel.hidden { display: none; }
            .chat-panel { width: 100%; }
            .chat-panel.hidden { display: none; }
            .mobile-back-btn { display: inline-block; }
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="nav-left">
            <button class="back-btn" onclick="window.location.href='feed.html'" title="Back to Feed">←</button>
            <div class="page-title">Camfeed Chat</div>
        </div>
        <div id="userBadge" style="font-size: 13px; color: #65676b; font-weight: 500;"></div>
    </div>

    <div class="chat-layout">
        <!-- Contacts Sidebar -->
        <div class="contacts-panel" id="contactsPanel">
            <div class="search-box">
                <input type="text" id="searchContactInput" placeholder="Search friends..." oninput="filterContacts()">
            </div>
            <div class="contacts-list" id="contactsList">
                <div style="padding: 20px; text-align: center; color: #65676b;">Loading contacts...</div>
            </div>
        </div>

        <!-- Chat Panel -->
        <div class="chat-panel hidden" id="chatPanel">
            <div class="chat-header" id="chatHeader">
                <button class="mobile-back-btn" onclick="showContactsMobile()">←</button>
                <img src="https://via.placeholder.com/40" id="activeChatAvatar" class="contact-avatar" style="width: 40px; height: 40px;">
                <div>
                    <div id="activeChatName" style="font-weight: 600; font-size: 15px;">Select a friend</div>
                    <div id="activeChatEmail" style="font-size: 12px; color: #65676b;"></div>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="empty-state">
                    <div style="font-size: 40px; margin-bottom: 10px;">💬</div>
                    <div style="font-weight: 600; font-size: 16px;">Your Messages</div>
                    <div style="font-size: 13px; margin-top: 4px;">Select a friend from the list to start chatting.</div>
                </div>
            </div>

            <div class="chat-input-bar" id="chatInputBar" style="display: none;">
                <input type="file" id="chatMediaInput" accept="image/*,video/*" style="display: none;" onchange="sendMediaMessage(this)">
                <button class="icon-btn" onclick="document.getElementById('chatMediaInput').click()" title="Send Photo/Video">🖼️</button>
                <button class="icon-btn" id="voiceRecordBtn" onclick="toggleVoiceRecord()" title="Record Voice Message">🎤</button>
                <input type="text" id="messageTextInput" class="msg-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendTextMessage()">
                <button class="send-btn" onclick="sendTextMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('camfeed_user')) || null;
        let allFriends = [];
        let activeFriend = null;
        let pollInterval = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        if (!currentUser) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('userBadge').innerText = `${currentUser.first_name || ''} ${currentUser.last_name || ''}`;
            loadContacts();
        }

        async function loadContacts() {
            try {
                const res = await fetch(`/api/friends/${encodeURIComponent(currentUser.email)}`);
                const data = await res.json();
                if (data.success && Array.isArray(data.friends)) {
                    allFriends = data.friends;
                    renderContacts(allFriends);

                    const urlParams = new URLSearchParams(window.location.search);
                    const targetEmail = urlParams.get('user');
                    if (targetEmail) {
                        const found = allFriends.find(f => f.email === targetEmail);
                        if (found) openChat(found);
                    }
                } else {
                    loadFallbackUsers();
                }
            } catch (err) {
                console.error('Error loading contacts:', err);
                loadFallbackUsers();
            }
        }

        async function loadFallbackUsers() {
            try {
                const res = await fetch('/api/users');
                const data = await res.json();
                if (data.success && Array.isArray(data.users)) {
                    allFriends = data.users.filter(u => u.email !== currentUser.email);
                    renderContacts(allFriends);
                } else {
                    document.getElementById('contactsList').innerHTML = '<div style="padding: 20px; text-align: center; color: #65676b;">No contacts found.</div>';
                }
            } catch (err) {
                document.getElementById('contactsList').innerHTML = '<div style="padding: 20px; text-align: center; color: #65676b;">Unable to load contacts.</div>';
            }
        }

        function renderContacts(list) {
            const container = document.getElementById('contactsList');
            if (!list || list.length === 0) {
                container.innerHTML = '<div style="padding: 20px; text-align: center; color: #65676b;">No friends available yet.</div>';
                return;
            }
            container.innerHTML = list.map(friend => {
                const isActive = activeFriend && activeFriend.email === friend.email ? 'active' : '';
                const avatar = friend.profile_pic || 'https://via.placeholder.com/46';
                return `
                    <div class="contact-item ${isActive}" onclick='openChat(${JSON.stringify(friend).replace(/'/g, "&#39;")})'>
                        <img src="${avatar}" class="contact-avatar">
                        <div class="contact-info">
                            <div class="contact-name">${friend.first_name || ''} ${friend.last_name || ''}</div>
                            <div class="contact-sub">${friend.email}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterContacts() {
            const q = document.getElementById('searchContactInput').value.toLowerCase().trim();
            const filtered = allFriends.filter(f =>
                `${f.first_name || ''} ${f.last_name || ''}`.toLowerCase().includes(q) ||
                (f.email && f.email.toLowerCase().includes(q))
            );
            renderContacts(filtered);
        }

        function openChat(friend) {
            activeFriend = friend;
            document.getElementById('activeChatName').innerText = `${friend.first_name || ''} ${friend.last_name || ''}`;
            document.getElementById('activeChatEmail').innerText = friend.email;
            document.getElementById('activeChatAvatar').src = friend.profile_pic || 'https://via.placeholder.com/40';
            document.getElementById('chatInputBar').style.display = 'flex';

            if (window.innerWidth <= 768) {
                document.getElementById('contactsPanel').classList.add('hidden');
                document.getElementById('chatPanel').classList.remove('hidden');
            } else {
                document.getElementById('chatPanel').classList.remove('hidden');
            }

            renderContacts(allFriends);
            fetchMessages();

            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(fetchMessages, 3000);
        }

        function showContactsMobile() {
            document.getElementById('contactsPanel').classList.remove('hidden');
            document.getElementById('chatPanel').classList.add('hidden');
            if (pollInterval) clearInterval(pollInterval);
        }

        async function fetchMessages() {
            if (!activeFriend) return;
            try {
                const res = await fetch(`/api/messages?user1=${encodeURIComponent(currentUser.email)}&user2=${encodeURIComponent(activeFriend.email)}`);
                const data = await res.json();
                if (data.success && Array.isArray(data.messages)) {
                    renderMessages(data.messages);
                }
            } catch (err) {
                console.error('Error fetching messages:', err);
            }
        }

        function renderMessages(messages) {
            const box = document.getElementById('chatMessages');
            if (messages.length === 0) {
                box.innerHTML = '<div class="empty-state"><div>Say hi to start the conversation! 👋</div></div>';
                return;
            }

            const wasAtBottom = box.scrollHeight - box.scrollTop <= box.clientHeight + 60;

            box.innerHTML = messages.map(m => {
                const isSent = m.sender_email === currentUser.email;
                const rowClass = isSent ? 'sent' : 'received';
                const timeStr = m.created_at ? new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

                let mediaHtml = '';
                if (m.media_url) {
                    if (m.media_type === 'video' || m.media_url.match(/\.(mp4|webm|mov)$/i)) {
                        mediaHtml = `<video src="${m.media_url}" class="msg-media" controls playsinline></video>`;
                    } else if (m.media_type === 'audio' || m.media_url.match(/\.(mp3|wav|ogg|m4a)$/i)) {
                        mediaHtml = `<audio src="${m.media_url}" class="msg-audio" controls></audio>`;
                    } else {
                        mediaHtml = `<img src="${m.media_url}" class="msg-media" onclick="window.open('${m.media_url}', '_blank')">`;
                    }
                }

                const textHtml = m.content ? `<div class="msg-bubble">${escapeHtml(m.content)}</div>` : '';

                return `
                    <div class="msg-row ${rowClass}">
                        ${textHtml}
                        ${mediaHtml}
                        <div class="msg-time">${timeStr}</div>
                    </div>
                `;
            }).join('');

            if (wasAtBottom) {
                box.scrollTop = box.scrollHeight;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function sendTextMessage() {
            const input = document.getElementById('messageTextInput');
            const content = input.value.trim();
            if (!content || !activeFriend) return;

            input.value = '';
            try {
                const res = await fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sender_email: currentUser.email,
                        receiver_email: activeFriend.email,
                        content: content
                    })
                });
                const data = await res.json();
                if (data.success) {
                    await fetchMessages();
                    const box = document.getElementById('chatMessages');
                    box.scrollTop = box.scrollHeight;
                }
            } catch (err) {
                console.error('Send error:', err);
            }
        }

        async function sendMediaMessage(fileInput) {
            const file = fileInput.files[0];
            if (!file || !activeFriend) return;

            const formData = new FormData();
            formData.append('sender_email', currentUser.email);
            formData.append('receiver_email', activeFriend.email);
            formData.append('media', file);

            try {
                const res = await fetch('/api/messages/media', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (data.success) {
                    await fetchMessages();
                    const box = document.getElementById('chatMessages');
                    box.scrollTop = box.scrollHeight;
                } else {
                    alert(data.message || 'Failed to send media.');
                }
            } catch (err) {
                console.error('Media upload error:', err);
            } finally {
                fileInput.value = '';
            }
        }

        async function toggleVoiceRecord() {
            const btn = document.getElementById('voiceRecordBtn');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        if (event.data.size > 0) audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        stream.getTracks().forEach(track => track.stop());

                        if (!activeFriend) return;
                        const formData = new FormData();
                        formData.append('sender_email', currentUser.email);
                        formData.append('receiver_email', activeFriend.email);
                        formData.append('media', audioBlob, 'voice-message.webm');

                        try {
                            const res = await fetch('/api/messages/media', {
                                method: 'POST',
                                body: formData
                            });
                            const data = await res.json();
                            if (data.success) {
                                await fetchMessages();
                                const box = document.getElementById('chatMessages');
                                box.scrollTop = box.scrollHeight;
                            }
                        } catch (err) {
                            console.error('Voice upload error:', err);
                        }
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    btn.classList.add('recording');
                } catch (err) {
                    alert('សូមអនុញ្ញាតឱ្យប្រើ Microphone ដើម្បីថតសំឡេង!');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.classList.remove('recording');
            }
        }
    </script>
</body>
</html>
