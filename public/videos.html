<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camfeed - Videos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100vh; background-color: black; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }

        .reels-top-bar { position: fixed; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
        .back-btn { background: rgba(0,0,0,0.5); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); }

        .reels-container { width: 100vw; height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
        .reels-container::-webkit-scrollbar { display: none; }

        .reel-item { width: 100vw; height: 100vh; scroll-snap-align: start; position: relative; display: flex; align-items: center; justify-content: center; background: black; }
        .reel-video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }

        .reel-overlay { position: absolute; bottom: 30px; left: 15px; right: 70px; z-index: 10; color: white; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
        .reel-author-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; cursor: pointer; }
        .reel-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid white; }
        .reel-caption { font-size: 14px; color: #f1f1f1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .reel-actions { position: absolute; bottom: 30px; right: 15px; z-index: 10; display: flex; flex-direction: column; gap: 20px; align-items: center; color: white; }
        .action-icon-btn { background: rgba(0,0,0,0.4); border: none; color: white; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; backdrop-filter: blur(4px); }
        .action-count { font-size: 12px; font-weight: bold; text-align: center; margin-top: 2px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

        /* Comments Modal Popup */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 2000; display: none; padding: 15px; box-sizing: border-box; }
        .modal-card { background: white; width: 100%; max-width: 450px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); overflow: hidden; max-height: 75vh; display: flex; flex-direction: column; }
        .modal-header { padding: 12px 15px; font-weight: bold; font-size: 16px; border-bottom: 1px solid #e4e6eb; display: flex; justify-content: space-between; align-items: center; color: #050505; }
        .modal-body { padding: 15px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; }
        
        .comment-item { display: flex; gap: 10px; font-size: 13px; align-items: flex-start; }
        .comment-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
        .comment-bubble { background: #f0f2f5; padding: 8px 12px; border-radius: 16px; color: #050505; word-break: break-word; }
        .comment-author { font-weight: bold; color: #050505; font-size: 12.5px; margin-bottom: 2px; display: block; }
        
        input[type="text"] { width: 100%; padding: 10px 14px; border: 1px solid #dddfe2; border-radius: 20px; outline: none; font-size: 14px; }
        .send-comment-btn { padding: 8px 16px; background: #1877f2; color: white; border: none; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="reels-top-bar">
        <button class="back-btn" onclick="window.location.href='feed.html'">❮</button>
        <div style="font-weight: bold; font-size: 18px; color: white; text-shadow: 0 1px 3px rgba(0,0,0,0.8);">Videos</div>
        <div style="width: 40px;"></div>
    </div>

    <div class="reels-container" id="reelsFeedContainer">
        <div style="color: white; text-align: center; margin-top: 50vh; transform: translateY(-50%);">Loading Videos...</div>
    </div>

    <!-- Comments Modal Popup -->
    <div id="commentsModal" class="modal-overlay" onclick="closeCommentsModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span>Comments</span>
                <span style="cursor: pointer; font-size: 20px;" onclick="closeCommentsModal()">×</span>
            </div>
            <div class="modal-body" id="modalCommentList"></div>
            <div style="display: flex; padding: 10px 15px; border-top: 1px solid #e4e6eb; gap: 8px; background: #fff; align-items: center;">
                <input type="text" id="modalCommentInput" placeholder="Write a comment..." onkeypress="if(event.key==='Enter') addModalComment()">
                <button onclick="addModalComment()" class="send-comment-btn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('camfeed_user')) || null;
        let activePostIdForComment = null;

        if (!currentUser) {
            window.location.href = 'index.html';
        } else {
            loadVideosFeed();
        }

        async function loadVideosFeed() {
            try {
                const res = await fetch(`/api/posts?email=${currentUser.email}`);
                const data = await res.json();
                if (data.success) {
                    const container = document.getElementById('reelsFeedContainer');
                    container.innerHTML = '';
                    const videoPosts = data.posts.filter(p => p.media_type === 'video');

                    if (videoPosts.length === 0) {
                        container.innerHTML = '<div style="color: white; text-align: center; margin-top: 50vh; transform: translateY(-50%);">No videos available.</div>';
                        return;
                    }

                    container.innerHTML = videoPosts.map(video => `
                        <div class="reel-item" id="reel-${video.id}">
                            <video src="${video.media_url}" class="reel-video" loop playsinline preload="metadata" onclick="togglePlayPause(this)"></video>
                            
                            <div class="reel-overlay">
                                <div class="reel-author-row" onclick="window.location.href='profile.html?email=${video.user_email}'">
                                    <img src="${video.profile_pic || 'https://via.placeholder.com/40'}" class="reel-avatar">
                                    <div style="font-weight: bold; font-size: 15px;">${video.first_name} ${video.last_name}</div>
                                </div>
                                <div class="reel-caption">${video.content || ''}</div>
                            </div>

                            <div class="reel-actions">
                                <div>
                                    <button class="action-icon-btn" onclick="sendReaction(${video.id}, '👍')">👍</button>
                                    <div class="action-count" id="likeCount-${video.id}">${video.likes_count || 0}</div>
                                </div>
                                <div>
                                    <button class="action-icon-btn" onclick="openCommentsModal(${video.id})">💬</button>
                                    <div class="action-count" id="commentCount-${video.id}">${video.comments_count || 0}</div>
                                </div>
                                <div>
                                    <button class="action-icon-btn" onclick="navigator.clipboard.writeText(window.location.origin + '/videos.html?v=${video.id}'); alert('Video link copied!');">🔗</button>
                                </div>
                            </div>
                        </div>
                    `).join('');

                    initReelsAutoplay();

                    const urlParams = new URLSearchParams(window.location.search);
                    const targetVideoId = urlParams.get('v');
                    if (targetVideoId) {
                        setTimeout(() => {
                            const targetEl = document.getElementById(`reel-${targetVideoId}`);
                            if (targetEl) {
                                targetEl.scrollIntoView({ behavior: 'auto' });
                            }
                        }, 100);
                    }
                }
            } catch (err) {
                console.error(err);
            }
        }

        function togglePlayPause(videoElem) {
            if (videoElem.paused) {
                videoElem.play();
            } else {
                videoElem.pause();
            }
        }

        async function sendReaction(postId, emoji) {
            try {
                const res = await fetch('/api/reaction', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ postId, email: currentUser.email, reactionType: emoji })
                });
                const data = await res.json();
                if (data.success) {
                    const countElem = document.getElementById(`likeCount-${postId}`);
                    if (countElem) countElem.innerText = data.likes_count;
                }
            } catch (err) { console.error(err); }
        }

        async function openCommentsModal(postId) {
            activePostIdForComment = postId;
            const modal = document.getElementById('commentsModal');
            const list = document.getElementById('modalCommentList');
            list.innerHTML = '<p style="text-align:center; color:#65676b;">Loading comments...</p>';
            modal.style.display = 'flex';

            try {
                const res = await fetch(`/api/comments/${postId}`);
                const data = await res.json();
                if (data.success) {
                    if (data.comments.length === 0) {
                        list.innerHTML = '<p style="text-align:center; color:#65676b; padding:20px;">No comments yet. Be the first to comment!</p>';
                        return;
                    }
                    list.innerHTML = data.comments.map(c => `
                        <div class="comment-item">
                            <img src="${c.profile_pic || 'https://via.placeholder.com/34'}" class="comment-avatar">
                            <div class="comment-bubble">
                                <span class="comment-author">${c.first_name} ${c.last_name}</span>
                                <div>${c.content}</div>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) {
                list.innerHTML = '<p style="text-align:center; color:red;">Failed to load comments.</p>';
            }
        }

        function closeCommentsModal() {
            document.getElementById('commentsModal').style.display = 'none';
            activePostIdForComment = null;
        }

        async function addModalComment() {
            const input = document.getElementById('modalCommentInput');
            const content = input.value.trim();
            if (!content || !activePostIdForComment) return;

            try {
                const res = await fetch('/api/comments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ postId: activePostIdForComment, email: currentUser.email, content })
                });
                const data = await res.json();
                if (data.success) {
                    input.value = '';
                    openCommentsModal(activePostIdForComment);

                    const countElem = document.getElementById(`commentCount-${activePostIdForComment}`);
                    if (countElem) {
                        let currentCount = parseInt(countElem.innerText) || 0;
                        countElem.innerText = currentCount + 1;
                    }
                }
            } catch (err) {
                console.error(err);
            }
        }

        function initReelsAutoplay() {
            const videoItems = document.querySelectorAll('.reel-video');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target;
                    if (entry.isIntersecting) {
                        video.play().catch(err => console.log("Autoplay blocked:", err));
                    } else {
                        video.pause();
                        video.currentTime = 0;
                    }
                });
            }, { threshold: 0.7 });

            videoItems.forEach(vid => observer.observe(vid));
        }
    </script>
</body>
</html>
