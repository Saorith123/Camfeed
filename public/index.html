<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camfeed - Login</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; justify-content: center; align-items: center; }

        .container { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 420px; padding: 20px; box-sizing: border-box; }
        
        .logo-container { text-align: center; margin-bottom: 20px; }
        .logo { font-size: 52px; font-weight: bold; color: #1877f2; letter-spacing: -1px; margin-bottom: 8px; }
        .logo-tagline { font-size: 18px; color: #606770; line-height: 1.2; }
        
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1); width: 100%; box-sizing: border-box; }
        
        input, select { width: 100%; padding: 12px 16px; margin: 6px 0; border: 1px solid #dddfe2; border-radius: 6px; box-sizing: border-box; font-size: 15px; outline: none; font-family: inherit; background: #fff; }
        input:focus, select:focus { border-color: #1877f2; box-shadow: 0 0 0 2px #e7f3ff; }
        
        .row { display: flex; gap: 10px; }
        .row input { flex: 1; }

        .password-container { position: relative; width: 100%; }
        .password-container input { width: 100%; padding-right: 40px; }
        .eye-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 18px; color: #606770; user-select: none; }

        .btn-primary { width: 100%; padding: 12px; background: #1877f2; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-primary:hover { background: #166fe5; }
        
        .btn-create { width: 100%; padding: 12px; background: #42b72a; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; text-align: center; display: block; text-decoration: none; box-sizing: border-box; }
        .btn-create:hover { background: #36a420; }

        .divider { border-bottom: 1px solid #dadde1; margin: 20px 0; }
        .msg { text-align: center; margin-top: 12px; font-size: 14px; font-weight: 500; }
        .hidden { display: none !important; }
        label { font-size: 12px; color: #606770; display: block; margin-top: 6px; text-align: left; }

        .lang-container { margin-top: 20px; text-align: center; }
        .lang-select { padding: 6px 12px; border: 1px solid #ccd0d5; border-radius: 4px; background: #fff; font-size: 13px; cursor: pointer; outline: none; width: auto; display: inline-block; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <div class="logo">camfeed</div>
            <div class="logo-tagline" id="logoTagline">Connect with friends and the world around you on Camfeed.</div>
        </div>

        <!-- LOGIN VIEW -->
        <div class="card" id="loginCard">
            <form onsubmit="event.preventDefault(); loginUser();">
                <input type="text" id="loginEmail" name="username" autocomplete="username" placeholder="Mobile number or email" required>
                <div class="password-container">
                    <input type="password" id="loginPassword" name="password" autocomplete="current-password" placeholder="Password" required>
                    <span class="eye-icon" onclick="togglePassword('loginPassword', this)">👁️</span>
                </div>
                <button type="submit" class="btn-primary" id="btnLoginText">Log In</button>
            </form>
            <div style="text-align: center; margin-top: 15px;">
                <a href="#" style="color: #1877f2; font-size: 14px; text-decoration: none;" id="forgotText">Forgot password?</a>
            </div>
            <div class="divider"></div>
            <button type="button" class="btn-create" onclick="showRegisterForm()" id="btnCreateText">Create new account</button>
            <div class="msg" id="loginMsg"></div>
        </div>

        <!-- REGISTER VIEW -->
        <div class="card hidden" id="registerCard">
            <h3 id="regTitle" style="margin-top: 0; color: #1c1e21; text-align: center; margin-bottom: 4px;">Sign Up</h3>
            <p id="regSubtitle" style="font-size: 14px; color: #606770; text-align: center; margin-bottom: 15px;">It's quick and easy.</p>
            
            <form onsubmit="event.preventDefault(); registerUser();">
                <div class="row">
                    <input type="text" id="firstName" placeholder="First name" required>
                    <input type="text" id="lastName" placeholder="Surname" required>
                </div>
                <input type="text" id="regEmail" name="email" autocomplete="email" placeholder="Mobile number or email" required>
                <div class="password-container">
                    <input type="password" id="regPassword" name="new-password" autocomplete="new-password" placeholder="New password" required>
                    <span class="eye-icon" onclick="togglePassword('regPassword', this)">👁️</span>
                </div>

                <label id="lblDob">Date of birth</label>
                <input type="date" id="birthdate" required>

                <label id="lblGender">Gender</label>
                <select id="gender" required>
                    <option value="" id="optGenderDefault">Select gender</option>
                    <option value="Male" id="optMale">Male</option>
                    <option value="Female" id="optFemale">Female</option>
                    <option value="Custom" id="optCustom">Custom</option>
                </select>

                <label id="lblCountry">Country</label>
                <select id="country" required>
                    <option value="">Select Country</option>
                    <option value="Cambodia">Cambodia</option>
                    <option value="United States">United States</option>
                    <option value="Thailand">Thailand</option>
                    <option value="Vietnam">Vietnam</option>
                    <option value="China">China</option>
                    <option value="Japan">Japan</option>
                    <option value="South Korea">South Korea</option>
                    <option value="France">France</option>
                    <option value="Australia">Australia</option>
                    <option value="Canada">Canada</option>
                    <option value="United Kingdom">United Kingdom</option>
                    <option value="Other">Other Country Worldwide</option>
                </select>

                <button type="submit" class="btn-create" style="margin-top: 15px;" id="btnSignSubmit">Sign Up</button>
            </form>
            <div style="text-align: center; margin-top: 15px;">
                <a href="#" onclick="showLoginForm()" style="color: #1877f2; font-size: 14px; text-decoration: none;" id="haveAccText">Already have an account?</a>
            </div>
            <div class="msg" id="regMsg"></div>
        </div>

        <div class="lang-container">
            <select class="lang-select" id="langSwitch" onchange="changeLanguage()">
                <option value="en">English (US)</option>
                <option value="km">ភាសាខ្មែរ</option>
            </select>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const savedEmail = localStorage.getItem('camfeed_remembered_email');
            if (savedEmail) {
                document.getElementById('loginEmail').value = savedEmail;
            }
        });

        const texts = {
            en: {
                logoTagline: "Connect with friends and the world around you on Camfeed.",
                loginEmail: "Mobile number or email", password: "Password", btnLoginText: "Log In",
                forgotText: "Forgot password?", btnCreateText: "Create new account", regTitle: "Sign Up",
                regSubtitle: "It's quick and easy.", firstName: "First name", lastName: "Surname",
                regEmail: "Mobile number or email", regPassword: "New password", lblDob: "Date of birth",
                lblGender: "Gender", optGenderDefault: "Select gender", optMale: "Male", optFemale: "Female",
                optCustom: "Custom", lblCountry: "Country", btnSignSubmit: "Sign Up", haveAccText: "Already have an account?"
            },
            km: {
                logoTagline: "ជួបជុំជាមួយមិត្តភក្តិ និងពិភពលោកជុំវិញខ្លួនអ្នកនៅលើ Camfeed។",
                loginEmail: "លេខទូរស័ព្ទ ឬ អ៊ីមែល", password: "ពាក្យសម្ងាត់", btnLoginText: "ចូលគណនី",
                forgotText: "ភ្លេចពាក្យសម្ងាត់?", btnCreateText: "បង្កើតគណនីថ្មី", regTitle: "ចុះឈ្មោះ",
                regSubtitle: "រហ័ស និងងាយស្រួល។", firstName: "នាមខ្លួន", lastName: "នាមត្រកូល",
                regEmail: "លេខទូរស័ព្ទ ឬ អ៊ីមែល", regPassword: "ពាក្យសម្ងាត់ថ្មី", lblDob: "ថ្ងៃខែឆ្នាំកំណើត",
                lblGender: "ភេទ", optGenderDefault: "ជ្រើសរើសភេទ", optMale: "ប្រុស", optFemale: "ស្រី",
                optCustom: "ផ្សេងៗ", lblCountry: "ប្រទេស", btnSignSubmit: "ចុះឈ្មោះ", haveAccText: "មានគណនីរួចហើយ?"
            }
        };

        function changeLanguage() {
            const lang = document.getElementById('langSwitch').value;
            const t = texts[lang];
            document.getElementById('logoTagline').innerText = t.logoTagline;
            document.getElementById('loginEmail').placeholder = t.loginEmail;
            document.getElementById('loginPassword').placeholder = t.password;
            document.getElementById('btnLoginText').innerText = t.btnLoginText;
            document.getElementById('forgotText').innerText = t.forgotText;
            document.getElementById('btnCreateText').innerText = t.btnCreateText;
            document.getElementById('regTitle').innerText = t.regTitle;
            document.getElementById('regSubtitle').innerText = t.regSubtitle;
            document.getElementById('firstName').placeholder = t.firstName;
            document.getElementById('lastName').placeholder = t.lastName;
            document.getElementById('regEmail').placeholder = t.regEmail;
            document.getElementById('regPassword').placeholder = t.regPassword;
            document.getElementById('lblDob').innerText = t.lblDob;
            document.getElementById('lblGender').innerText = t.lblGender;
            document.getElementById('optGenderDefault').innerText = t.optGenderDefault;
            document.getElementById('optMale').innerText = t.optMale;
            document.getElementById('optFemale').innerText = t.optFemale;
            document.getElementById('optCustom').innerText = t.optCustom;
            document.getElementById('lblCountry').innerText = t.lblCountry;
            document.getElementById('btnSignSubmit').innerText = t.btnSignSubmit;
            document.getElementById('haveAccText').innerText = t.haveAccText;
        }

        function togglePassword(fieldId, iconElement) {
            const inputField = document.getElementById(fieldId);
            if (inputField.type === "password") {
                inputField.type = "text";
                iconElement.innerText = "🙈";
            } else {
                inputField.type = "password";
                iconElement.innerText = "👁️";
            }
        }

        function showRegisterForm() {
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('registerCard').classList.remove('hidden');
        }

        function showLoginForm() {
            document.getElementById('registerCard').classList.add('hidden');
            document.getElementById('loginCard').classList.remove('hidden');
        }

        async function registerUser() {
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const birthdate = document.getElementById('birthdate').value;
            const gender = document.getElementById('gender').value;
            const country = document.getElementById('country').value;
            const msg = document.getElementById('regMsg');

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ firstName, lastName, email, password, birthdate, gender, country })
                });
                const data = await res.json();
                if (data.success) {
                    msg.style.color = 'green';
                    msg.innerText = 'Account created successfully! Please log in.';
                    setTimeout(showLoginForm, 2000);
                } else {
                    msg.style.color = 'red';
                    msg.innerText = data.error || 'Registration failed';
                }
            } catch (err) {
                msg.style.color = 'red';
                msg.innerText = 'Server connection error';
            }
        }

        async function loginUser() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const msg = document.getElementById('loginMsg');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('camfeed_remembered_email', email);
                    localStorage.setItem('camfeed_user', JSON.stringify(data.user));
                    window.location.href = 'feed.html';
                } else {
                    msg.style.color = 'red';
                    msg.innerText = data.message || 'Invalid email or password';
                }
            } catch (err) {
                msg.style.color = 'red';
                msg.innerText = 'Server connection error';
            }
        }
    </script>
</body>
</html>
